        ? JSON.parse(__firebase_config) 
        : {

            authDomain: "makermech-d88e1.firebaseapp.com",

          };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const googleProvider = new GoogleAuthProvider();

      window.syncToGoogleAppsScript = async (payload, customGasUrl) => {
        const currentGasUrl = customGasUrl || localStorage.getItem('moc_gasWebappUrl') || '';
        if (!currentGasUrl || !currentGasUrl.trim()) return;
        try {
          const response = await fetch(currentGasUrl.trim(), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          if (response.ok || response.type === 'opaque') {
            console.log("Google Sheet Action Success");
          } else {
            console.error("Google Sheet Action Failed", response.statusText);
          }
        } catch (err) {
          console.error("Google Sheet Action Failed", err);
        }
      };

      window.fetchGoogleSheetVersions = async (customGasUrl) => {
        const currentGasUrl = customGasUrl || localStorage.getItem('moc_gasWebappUrl') || '';
        if (!currentGasUrl || !currentGasUrl.trim()) throw new Error("請先填寫 Google Apps Script 網址");
        
        try {
          const response = await fetch(currentGasUrl.trim());
          const result = await response.json();
          if (result.status === "success") {
            return result.versions || [];
          } else {
            throw new Error(result.message || "讀取失敗");
          }
        } catch (err) {
          console.error("Fetch Google Sheet Versions Failed", err);
          throw err;
        }
      };

      window.firebaseService = { auth, db, googleProvider, signInWithPopup, signOut, onAuthStateChanged, doc, getDoc, setDoc };
      window.dispatchEvent(new Event('firebase-ready'));
    </script>

      const formatCurrency = (num) => {
        return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(num || 0);
      };

      // 📦 舊訂單相容轉換：自動將 amount 換算為 unitPrice
      const sanitizeOrders = (rawOrders) => {
        if (!Array.isArray(rawOrders)) return [];
        return rawOrders.map(o => {
          let formattedItems = [];
          if (Array.isArray(o.items)) {
            formattedItems = o.items.map((it, idx) => {
              let uPrice = it.unitPrice !== undefined ? it.unitPrice : '';
              if (uPrice === '' && it.amount !== undefined && it.quantity) {
                const amt = parseFloat(it.amount) || 0;
                const qty = parseFloat(it.quantity) || 1;
                if (qty > 0) uPrice = (amt / qty).toString();
              }
              return {
                id: it.id || 'item_' + Date.now() + '_' + idx,
                productName: it.productName || it.itemTitle || '',
                quantity: it.quantity || '',
                unitPrice: uPrice
              };
            });
          } else {
            formattedItems = [{ id: 'item_' + Date.now(), productName: '', quantity: '', unitPrice: '' }];
          }

          return {
            id: o.id || 'order_' + Date.now() + Math.random(),
            orderDate: o.orderDate || new Date().toISOString().split('T')[0],
            shippingDate: o.shippingDate || '',
            shipped: !!o.shipped,
            nickname: o.nickname || '',
            items: formattedItems,
            paymentUSD: o.paymentUSD !== undefined ? o.paymentUSD : '',
            shippingFee: o.shippingFee !== undefined ? o.shippingFee : '',
            recipient: o.recipient || '',
            phone: o.phone || '',
            country: o.country || '',
            region: o.region || '',
            address: o.address || '',
            notes: o.notes || ''
          };
        });
      };

      // 🏆 核心：將舊版「單一商品」無縫升級為「主商品 + 規格陣列 (Variants)」
      const migrateLegacyData = (periods) => {
        if (!Array.isArray(periods)) return [];
        return periods.map(sp => {
          const newVendors = (sp.vendors || []).map(vendor => {
            const newItems = (vendor.items || []).map(item => {
              // 如果已經有 variants，代表是新資料，不處理
              if (item.variants && Array.isArray(item.variants)) return item;
              
              // 如果是舊資料，將特定屬性移到 variants 裡面，並把共用屬性留在外面
              return {
                id: item.id,
                itemTitle: item.itemTitle || '',
                productName: item.productName || '',
                style: item.style || '',
                notes: item.notes || '',
                unitCost: item.unitCost || '',
                otherFeeLabel: item.otherFeeLabel || '',
                otherFee: item.otherFee || '',
                twdPrice: item.twdPrice || '',
                usdPrice: item.usdPrice || '',
                excludeFromTotal: !!item.excludeFromTotal,
                // 把數量跟規格抽出成為第一個 default variant
                variants: [
                  {
                    id: 'var_' + Date.now() + Math.random(),
                    specName: item.specs || '預設規格',
                    printQty: item.printQty || '',
                    taiwanSalesQty: item.taiwanSalesQty || '',
                    overseasSalesQty: item.overseasSalesQty || ''
                  }
                ]
              };
            });
            return { ...vendor, items: newItems };
          });
          
          // 包材的轉換 (包材暫不使用 variants 架構，維持原樣即可，因為通常不用分顏色定價)
          return { ...sp, vendors: newVendors };
        });
      };

      function MailOrderCalculator() {
        const defaultTheme = {
          headerBgColor: '#69AFB0', headerTextColor: '#FFFFFF', labelTextColor: '#4A5565', inputBgColor: '#FFFFFF', inputTextColor: '#0F172A',
          vendorBadgeBgColor: '#4A81D3', vendorHeaderBgColor: '#CAE6F7', vendorBoxBgColor: '#F8FAFC', taiwanBoxBgColor: '#F0F9FF', taiwanTitleColor: '#0369A1',
          overseasBoxBgColor: '#FFFBEB', overseasTitleColor: '#B45309', salesTextColor: '#DC2626', qtyTextColor: '#2563EB',
          packagingBadgeBgColor: '#4C7F29', packagingHeaderBgColor: '#F1F9F3', packagingBoxBgColor: '#F8FAFC'
        };

        const [activeTab, setActiveTab] = useState('cost');

        const [exchangeRate, setExchangeRate] = useState('31.5');
        const [showGoogleSheets, setShowGoogleSheets] = useState(false);
        const [gasWebappUrl, setGasWebappUrl] = useState('');

        const [exportNotice, setExportNotice] = useState('');
        
        const [theme, setTheme] = useState(defaultTheme);
        const [salesPeriods, setSalesPeriods] = useState([
          { 
            id: 1, isLocked: false, preorderTime: '', productionTime: '', 
            vendors: [{ 
              id: 101, vendorName: '', shippingCost: '', 
              items: [{ 
                id: 1001, itemTitle: '', productName: '', style: '', notes: '', 
                unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', usdPrice: '', excludeFromTotal: false,
                variants: [{ id: 'v1', specName: '預設規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }]
              }] 
            }], 
            packagings: [] 
          }
        ]);

        const [orders, setOrders] = useState([]);
        const [orderSearchQuery, setOrderSearchQuery] = useState('');
        const [orderStatusFilter, setOrderStatusFilter] = useState('all');
        const [editingOrderId, setEditingOrderId] = useState(null);
        
        const [orderForm, setOrderForm] = useState({
          orderDate: new Date().toISOString().split('T')[0], shippingDate: '', shipped: false, nickname: '',
          items: [{ id: 'item_' + Date.now(), productName: '', quantity: '', unitPrice: '' }],
          paymentUSD: '', shippingFee: '', recipient: '', phone: '', country: '', region: '', address: '', notes: ''
        });

        const [currentDocId, setCurrentDocId] = useState('sheet_' + Date.now());
        const [currentDocTitle, setCurrentDocTitle] = useState('預設成本試算表');
        const [sheetVersions, setSheetVersions] = useState([]);
        const [isLoadingSheet, setIsLoadingSheet] = useState(false);

        const [user, setUser] = useState(null);
        const [syncStatus, setSyncStatus] = useState('Offline');
        const isRemoteLoading = useRef(false);

        useEffect(() => {
          const checkFirebaseReady = () => {
            if (window.firebaseService) {
              const { auth, onAuthStateChanged, db, doc, getDoc } = window.firebaseService;
              onAuthStateChanged(auth, async (currentUser) => {
                setUser(currentUser);
                if (currentUser) {
                  setSyncStatus('Syncing...');
                  try {
                    const userDocRef = doc(db, 'users', currentUser.uid);
                    const docSnap = await getDoc(userDocRef);
                    if (docSnap.exists()) {
                      const cloudData = docSnap.data();
                      if (cloudData.gasWebappUrl) {
                        setGasWebappUrl(cloudData.gasWebappUrl);
                        localStorage.setItem('moc_gasWebappUrl', cloudData.gasWebappUrl);
                      }
                      // 讀取時，套用超級轉換函數，自動將舊版商品升級為規格版！
                      if (cloudData.salesPeriods) setSalesPeriods(migrateLegacyData(cloudData.salesPeriods));
                      if (cloudData.exchangeRate) setExchangeRate(cloudData.exchangeRate);
                      if (cloudData.currentDocId) setCurrentDocId(cloudData.currentDocId);
                      if (cloudData.currentDocTitle) setCurrentDocTitle(cloudData.currentDocTitle);
                      if (cloudData.orders) setOrders(sanitizeOrders(cloudData.orders));
                    }
                    setSyncStatus('Synced');
                  } catch (err) {
                    console.error("Cloud config load failed", err);
                    setSyncStatus('Sync failed');
                  }
                } else {
                  setSyncStatus('Offline');
                }
              });
            }
          };
          if (window.firebaseService) checkFirebaseReady();
          else window.addEventListener('firebase-ready', checkFirebaseReady);
          return () => window.removeEventListener('firebase-ready', checkFirebaseReady);
        }, []);

        const handleGoogleLogin = async () => {
          if (!window.firebaseService) return;
          const { auth, googleProvider, signInWithPopup } = window.firebaseService;
          try {
            setSyncStatus('Syncing...');
            await signInWithPopup(auth, googleProvider);
          } catch (err) {
            console.error("Login failed:", err);
            setSyncStatus('Sync failed');
          }
        };

        const handleLogout = async () => {
          if (!window.firebaseService) return;
          const { auth, signOut } = window.firebaseService;
          try {
            await signOut(auth);
            setUser(null);
            setSyncStatus('Offline');
          } catch (err) { console.error(err); }
        };

        const handleGasUrlChange = async (newUrl) => {
          setGasWebappUrl(newUrl);
          localStorage.setItem('moc_gasWebappUrl', newUrl);
          if (user && window.firebaseService) {
            const { db, doc, setDoc } = window.firebaseService;
            try { await setDoc(doc(db, 'users', user.uid), { gasWebappUrl: newUrl }, { merge: true }); } 
            catch (err) { console.error("Failed to save GAS URL to cloud", err); }
          }
        };

        const handleLoadGoogleSheetVersions = async () => {
          if (!gasWebappUrl) {
            alert("請先填寫 Google Apps Script 網址！");
            setShowGoogleSheets(true);
            return;
          }
          try {
            setIsLoadingSheet(true);
            setSyncStatus('Syncing...');
            const versions = await window.fetchGoogleSheetVersions(gasWebappUrl);
            setSheetVersions(versions);
            setSyncStatus('Synced');
            if (versions.length === 0) alert("Google 試算表中尚無任何存檔清單。");
          } catch (err) {
            alert("讀取失敗：" + err.message);
            setSyncStatus('Sync failed');
          } finally {
            setIsLoadingSheet(false);
          }
        };

        const handleSelectSheetVersion = (ver) => {
          if (!user) { alert("請先登入 Google 帳號才能讀取雲端試算表！"); return; }
          if (!confirm(`確定要從 Google 試算表讀取版本「${ver.title}」嗎？目前的未儲存資料將被覆蓋。`)) return;
          
          isRemoteLoading.current = true;
          setCurrentDocId(ver.id);
          setCurrentDocTitle(ver.title);
          if (ver.payload) {
            // 讀取並自動轉換
            if (ver.payload.salesPeriods) setSalesPeriods(migrateLegacyData(ver.payload.salesPeriods));
            if (ver.payload.exchangeRate) setExchangeRate(ver.payload.exchangeRate);
            if (ver.payload.theme) setTheme(ver.payload.theme);
            if (ver.payload.orders) setOrders(sanitizeOrders(ver.payload.orders));
          }
          setTimeout(() => { isRemoteLoading.current = false; }, 300);
          setExportNotice(`已成功從 Google 試算表讀取：${ver.title}`);
          setTimeout(() => setExportNotice(''), 4000);
        };

        const handleDeleteCloudVersion = async (ver) => {
          if (!user) { alert("請先登入 Google 帳號！"); return; }
          if (!confirm(`確定要從 Google 試算表中永久刪除版本「${ver.title}」嗎？此動作無法復原。`)) return;
          try {
            setSyncStatus('Syncing...');
            await window.syncToGoogleAppsScript({ action: 'delete', docId: ver.id }, gasWebappUrl);
            setSyncStatus('Synced');
            setExportNotice(`已成功從 Google 試算表中刪除：${ver.title}`);
            setTimeout(() => setExportNotice(''), 4000);
            handleLoadGoogleSheetVersions();
          } catch (err) {
            alert("刪除失敗：" + err.message);
            setSyncStatus('Sync failed');
          }
        };

        const handleManualSyncToCloud = async () => {
          if (!user) { alert("請先登入 Google 帳號才能覆蓋儲存至雲端試算表！"); return; }
          if (!gasWebappUrl) { alert("請先填寫 Google Apps Script 網址！"); setShowGoogleSheets(true); return; }

          const payload = {
            docId: currentDocId, title: currentDocTitle, salesPeriods, exchangeRate, theme, orders, lastUpdated: new Date().toISOString()
          };

          try {
            setSyncStatus('Syncing...');
            await window.syncToGoogleAppsScript(payload, gasWebappUrl);
            const { db, doc, setDoc } = window.firebaseService;
            await setDoc(doc(db, 'users', user.uid), { currentDocId, currentDocTitle, salesPeriods, exchangeRate, orders }, { merge: true });
            setSyncStatus('Synced');
            setExportNotice(`已成功覆蓋儲存至 Google 試算表中的「${currentDocTitle}」！`);
            setTimeout(() => setExportNotice(''), 4000);
            handleLoadGoogleSheetVersions();
          } catch (err) {
            alert("覆蓋儲存失敗：" + err.message);
            setSyncStatus('Sync failed');
          }
        };

        const handleCreateNewSheetVersion = () => {
          if (!user) { alert("請先登入 Google 帳號！"); return; }
          const newTitle = prompt("請輸入新試算表/標題名稱：", `成本試算表_${new Date().toLocaleDateString()}`);
          if (!newTitle) return;
          const newId = 'sheet_' + Date.now();
          setCurrentDocId(newId);
          setCurrentDocTitle(newTitle);
          setSalesPeriods([{ id: Date.now(), isLocked: false, preorderTime: newTitle, productionTime: '', vendors: [], packagings: [] }]);
          setExportNotice(`已建立新表單：${newTitle}，點擊「覆蓋儲存到此雲端試算表」即可寫入 Google 試算表`);
          setTimeout(() => setExportNotice(''), 4000);
        };

        const handleAddSalesPeriod = () => {
          const newSp = {
            id: Date.now(), isLocked: false, preorderTime: '', productionTime: '',
            vendors: [{ id: Date.now() + 1, vendorName: '', shippingCost: '', items: [{ id: Date.now() + 2, itemTitle: '', productName: '', style: '', notes: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', usdPrice: '', excludeFromTotal: false, variants: [{ id: 'v1', specName: '預設規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }] }] }],
            packagings: []
          };
          setSalesPeriods([...salesPeriods, newSp]);
        };

        const handleDeleteSalesPeriod = (spId) => { setSalesPeriods(salesPeriods.filter(sp => sp.id !== spId)); };
        const handleToggleLockSalesPeriod = (spId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId ? { ...sp, isLocked: !sp.isLocked } : sp)); };
        const handleSalesPeriodFieldChange = (spId, field, value) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, [field]: value } : sp)); };
        
        const handleAddVendor = (spId) => {
          const newVendor = { id: Date.now(), vendorName: '', shippingCost: '', items: [{ id: Date.now() + 1, itemTitle: '', productName: '', style: '', notes: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', usdPrice: '', excludeFromTotal: false, variants: [{ id: 'v1', specName: '預設規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }] }] };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: [...sp.vendors, newVendor] } : sp));
        };
        const handleDeleteVendor = (spId, vendorId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.filter(v => v.id !== vendorId) } : sp)); };
        const handleVendorFieldChange = (spId, vendorId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, [field]: value } : v) } : sp));
        };

        const handleAddItem = (spId, vendorId) => {
          const newItem = { id: Date.now(), itemTitle: '', productName: '', style: '', notes: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', usdPrice: '', excludeFromTotal: false, variants: [{ id: 'v1', specName: '預設規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }] };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: [...v.items, newItem] } : v) } : sp));
        };
        const handleDeleteItem = (spId, vendorId, itemId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.filter(i => i.id !== itemId) } : v) } : sp));
        };
        const handleItemFieldChange = (spId, vendorId, itemId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.map(i => i.id === itemId ? { ...i, [field]: value } : i) } : v) } : sp));
        };
        const handleMoveItem = (spId, vendorId, itemId, direction) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedVendors = sp.vendors.map(v => {
                if (v.id === vendorId) {
                  const items = [...v.items];
                  const index = items.findIndex(i => i.id === itemId);
                  if (index === -1) return v;
                  const targetIndex = direction === 'up' ? index - 1 : index + 1;
                  if (targetIndex < 0 || targetIndex >= items.length) return v;
                  const [movedItem] = items.splice(index, 1);
                  items.splice(targetIndex, 0, movedItem);
                  return { ...v, items };
                }
                return v;
              });
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        // 🏷️ 規格 (Variant) 專用 CRUD
        const handleAddVariant = (spId, vendorId, itemId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.map(i => i.id === itemId ? { ...i, variants: [...(i.variants || []), { id: 'var_' + Date.now(), specName: '新規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }] } : i) } : v) } : sp));
        };
        const handleDeleteVariant = (spId, vendorId, itemId, varId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.map(i => i.id === itemId ? { ...i, variants: i.variants.filter(va => va.id !== varId) } : i) } : v) } : sp));
        };
        const handleVariantFieldChange = (spId, vendorId, itemId, varId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.map(i => i.id === itemId ? { ...i, variants: i.variants.map(va => va.id === varId ? { ...va, [field]: value } : va) } : i) } : v) } : sp));
        };

        // 📦 包材 CRUD (維持原樣)
        const handleAddPackaging = (spId) => {
          const newPkg = { id: Date.now(), vendorName: '', shippingCost: '', items: [{ id: Date.now() + 1, packagingTitle: '', style: '', specs: '', notes: '', qty: '', unitCost: '', otherFeeLabel: '', otherFee: '', excludeFromTotal: false }] };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: [...(sp.packagings || []), newPkg] } : sp));
        };
        const handleDeletePackaging = (spId, pkgId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.filter(p => p.id !== pkgId) } : sp)); };
        const handlePkgVendorFieldChange = (spId, pkgId, field, value) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, [field]: value } : p) } : sp)); };
        const handleAddPkgItem = (spId, pkgId) => {
          const newItem = { id: Date.now(), packagingTitle: '', style: '', specs: '', notes: '', qty: '', unitCost: '', otherFeeLabel: '', otherFee: '', excludeFromTotal: false };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, items: [...(p.items || []), newItem] } : p) } : sp));
        };
        const handleDeletePkgItem = (spId, pkgId, itemId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, items: p.items.filter(i => i.id !== itemId) } : p) } : sp)); };
        const handlePkgItemFieldChange = (spId, pkgId, itemId, field, value) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, items: p.items.map(i => i.id === itemId ? { ...i, [field]: value } : i) } : p) } : sp)); };
        const handleMovePkgItem = (spId, pkgId, itemId, direction) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedPkgs = sp.packagings.map(p => {
                if (p.id === pkgId) {
                  const items = [...p.items];
                  const index = items.findIndex(i => i.id === itemId);
                  if (index === -1) return p;
                  const targetIndex = direction === 'up' ? index - 1 : index + 1;
                  if (targetIndex < 0 || targetIndex >= items.length) return p;
                  const [movedItem] = items.splice(index, 1);
                  items.splice(targetIndex, 0, movedItem);
                  return { ...p, items };
                }
                return p;
              });
              return { ...sp, packagings: updatedPkgs };
            }
            return sp;
          }));
        };

        const handleOrderFormChange = (field, value) => {
          setOrderForm(prev => {
            const updated = { ...prev, [field]: value };
            if (field === 'shipped' && value === true && !updated.shippingDate) {
              updated.shippingDate = new Date().toISOString().split('T')[0];
            }
            return updated;
          });
        };
        const handleAddOrderItem = () => { setOrderForm(prev => ({ ...prev, items: [...prev.items, { id: 'item_' + Date.now() + Math.random(), productName: '', quantity: '', unitPrice: '' }] })); };
        const handleDeleteOrderItem = (itemId) => { setOrderForm(prev => { if (prev.items.length <= 1) { alert("每筆訂單至少須包含一個購買品項！"); return prev; } return { ...prev, items: prev.items.filter(it => it.id !== itemId) }; }); };
        const handleOrderItemChange = (itemId, field, value) => { setOrderForm(prev => ({ ...prev, items: prev.items.map(it => it.id === itemId ? { ...it, [field]: value } : it) })); };
        const handleSaveOrder = (e) => {
          e.preventDefault();
          if (!orderForm.nickname && !orderForm.recipient && orderForm.items.every(it => !it.productName.trim())) { alert("請至少填寫買家暱稱、收件人或其中一個購買品項！"); return; }
          if (editingOrderId) {
            setOrders(orders.map(o => o.id === editingOrderId ? { ...orderForm, id: editingOrderId } : o));
            setEditingOrderId(null);
            setExportNotice("已成功更新訂單！");
          } else {
            setOrders([{ ...orderForm, id: 'order_' + Date.now() }, ...orders]);
            setExportNotice("已成功新增訂單！");
          }
          setTimeout(() => setExportNotice(''), 3000);
          setOrderForm({
            orderDate: new Date().toISOString().split('T')[0], shippingDate: '', shipped: false, nickname: '',
            items: [{ id: 'item_' + Date.now(), productName: '', quantity: '', unitPrice: '' }],
            paymentUSD: '', shippingFee: '', recipient: '', phone: '', country: '', region: '', address: '', notes: ''
          });
        };
        const handleEditOrder = (order) => {
          setEditingOrderId(order.id);
          let parsedItems = Array.isArray(order.items) && order.items.length > 0 ? order.items.map((it, idx) => {
            let uPrice = it.unitPrice !== undefined ? it.unitPrice : '';
            if (uPrice === '' && it.amount !== undefined && it.quantity) { const amt = parseFloat(it.amount) || 0; const qty = parseFloat(it.quantity) || 1; if (qty > 0) uPrice = (amt / qty).toString(); }
            return { id: it.id || 'item_' + Date.now() + '_' + idx, productName: it.productName || it.itemTitle || '', quantity: it.quantity || '', unitPrice: uPrice };
          }) : [{ id: 'item_' + Date.now(), productName: '', quantity: '', unitPrice: '' }];
          setOrderForm({
            orderDate: order.orderDate || new Date().toISOString().split('T')[0], shippingDate: order.shippingDate || '', shipped: !!order.shipped, nickname: order.nickname || '',
            items: parsedItems, paymentUSD: order.paymentUSD !== undefined ? order.paymentUSD : '', shippingFee: order.shippingFee !== undefined ? order.shippingFee : '',
            recipient: order.recipient || '', phone: order.phone || '', country: order.country || '', region: order.region || '', address: order.address || '', notes: order.notes || ''
          });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        const handleCancelEditOrder = () => {
          setEditingOrderId(null);
          setOrderForm({ orderDate: new Date().toISOString().split('T')[0], shippingDate: '', shipped: false, nickname: '', items: [{ id: 'item_' + Date.now(), productName: '', quantity: '', unitPrice: '' }], paymentUSD: '', shippingFee: '', recipient: '', phone: '', country: '', region: '', address: '', notes: '' });
        };
        const handleDeleteOrder = (orderId) => { if (!confirm("確定要刪除這筆訂單嗎？")) return; setOrders(orders.filter(o => o.id !== orderId)); setExportNotice("已刪除該筆訂單"); setTimeout(() => setExportNotice(''), 3000); };

        const currentFormTotals = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;
          const productTotal = (orderForm.items || []).reduce((sum, item) => sum + ((parseFloat(item.quantity) || 0) * (parseFloat(item.unitPrice) || 0)), 0);
          const usdVal = parseFloat(orderForm.paymentUSD) || 0;
          const usdConverted = Math.round(usdVal * globalRate);
          const shipping = parseFloat(orderForm.shippingFee) || 0;
          return { productTotal, usdConverted, shipping, totalPayment: productTotal + usdConverted + shipping };
        }, [orderForm, exchangeRate]);

        const orderStats = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;
          let sumProductTotal = 0, sumUSD = 0, sumUSDCond = 0, sumShipping = 0, sumGrandTotal = 0;
          orders.forEach(o => {
            const pTotal = (o.items || []).reduce((acc, it) => acc + ((parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0)), 0);
            const uVal = parseFloat(o.paymentUSD) || 0;
            const uCond = Math.round(uVal * globalRate);
            const sVal = parseFloat(o.shippingFee) || 0;
            sumProductTotal += pTotal; sumUSD += uVal; sumUSDCond += uCond; sumShipping += sVal; sumGrandTotal += (pTotal + uCond + sVal);
          });
          return { totalOrdersCount: orders.length, unshippedCount: orders.filter(o => !o.shipped).length, shippedCount: orders.filter(o => o.shipped).length, sumProductTotal, sumUSD, sumUSDCond, sumShipping, sumGrandTotal };
        }, [orders, exchangeRate]);

        const filteredOrders = useMemo(() => {
          return orders.filter(o => {
            if (orderStatusFilter === 'unshipped' && o.shipped) return false;
            if (orderStatusFilter === 'shipped' && !o.shipped) return false;
            if (orderSearchQuery.trim()) {
              const q = orderSearchQuery.toLowerCase();
              return (o.nickname || '').toLowerCase().includes(q) || (o.recipient || '').toLowerCase().includes(q) || (o.phone || '').toLowerCase().includes(q) || (Array.isArray(o.items) && o.items.some(item => (item.productName || '').toLowerCase().includes(q)));
            }
            return true;
          });
        }, [orders, orderStatusFilter, orderSearchQuery]);

        const calculatedData = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;
          return salesPeriods.map(sp => {
            let periodTotalSales = 0;
            let periodTotalProductCost = 0; // 只算商品本身成本
            let periodTotalShipping = 0; // 統一累加運費

            const calculatedVendors = (sp.vendors || []).map(vendor => {
              const vendorShipping = parseFloat(vendor.shippingCost) || 0;
              periodTotalShipping += vendorShipping; // 運費不分攤，直接加到總運費

              let vendorTotalProductCost = 0;
              let vendorTotalSales = 0;

              const calculatedItems = (vendor.items || []).map(item => {
                const twdPrice = parseFloat(item.twdPrice) || 0;
                const usdPrice = parseFloat(item.usdPrice) || 0;
                const usdToTwdPrice = Math.round(usdPrice * globalRate);
                const unitCost = parseFloat(item.unitCost) || 0;
                const otherFee = parseFloat(item.otherFee) || 0;

                let itemTotalPrintQty = 0;
                let itemTotalTaiwanSalesQty = 0;
                let itemTotalOverseasSalesQty = 0;
                
                // 計算所有子規格的總數
                const calculatedVariants = (item.variants || []).map(variant => {
                  const printQty = parseFloat(variant.printQty) || 0;
                  const taiwanSalesQty = parseFloat(variant.taiwanSalesQty) || 0;
                  const overseasSalesQty = parseFloat(variant.overseasSalesQty) || 0;
                  
                  itemTotalPrintQty += printQty;
                  itemTotalTaiwanSalesQty += taiwanSalesQty;
                  itemTotalOverseasSalesQty += overseasSalesQty;
                  
                  return { ...variant, printQty, taiwanSalesQty, overseasSalesQty };
                });

                // 結算這個主商品的總財務資料
                const itemTotalCost = (itemTotalPrintQty * unitCost) + otherFee;
                const itemTaiwanRevenue = itemTotalTaiwanSalesQty * twdPrice;
                const itemOverseasRevenue = itemTotalOverseasSalesQty * usdToTwdPrice;
                const itemTotalRevenue = itemTaiwanRevenue + itemOverseasRevenue;
                const itemProfitAndLoss = itemTotalRevenue - itemTotalCost;
                const itemTotalSalesQty = itemTotalTaiwanSalesQty + itemTotalOverseasSalesQty;

                if (!item.excludeFromTotal) {
                  periodTotalSales += itemTotalRevenue;
                  periodTotalProductCost += itemTotalCost;
                  vendorTotalProductCost += itemTotalCost;
                  vendorTotalSales += itemTotalRevenue;
                }

                return { 
                  ...item, 
                  variants: calculatedVariants,
                  itemTotalPrintQty, 
                  itemTotalSalesQty, 
                  itemTotalCost, 
                  itemTotalRevenue, 
                  itemProfitAndLoss,
                  usdToTwdPrice
                };
              });

              // 結算單一廠商的總支出 (商品成本 + 該廠運費)
              const vendorTotalCost = vendorTotalProductCost + vendorShipping;
              const vendorNetIncome = vendorTotalSales - vendorTotalCost;

              return { 
                ...vendor, 
                items: calculatedItems,
                vendorTotalProductCost,
                vendorTotalCost,
                vendorTotalSales,
                vendorNetIncome
              };
            });

            // 包材計算 (不分攤運費)
            const calculatedPackagings = (sp.packagings || []).map(pkgVendor => {
              const vendorShipping = parseFloat(pkgVendor.shippingCost) || 0;
              periodTotalShipping += vendorShipping;
              
              let pkgVendorTotalProductCost = 0;

              const calculatedPkgItems = (pkgVendor.items || []).map(item => {
                const qty = parseFloat(item.qty) || 0;
                const unitCost = parseFloat(item.unitCost) || 0;
                const otherFee = parseFloat(item.otherFee) || 0;
                const totalCost = (qty * unitCost) + otherFee;
                
                if (!item.excludeFromTotal) {
                  periodTotalProductCost += totalCost;
                  pkgVendorTotalProductCost += totalCost;
                }
                
                return { ...item, qty, unitCost, otherFee, totalCost };
              });
              
              // 結算包材廠商的總支出
              const pkgVendorTotalCost = pkgVendorTotalProductCost + vendorShipping;

              return { 
                ...pkgVendor, 
                items: calculatedPkgItems,
                pkgVendorTotalProductCost,
                pkgVendorTotalCost
              };
            });

            const periodNetIncome = periodTotalSales - periodTotalProductCost - periodTotalShipping;
            
            return { 
              ...sp, 
              vendors: calculatedVendors, 
              packagings: calculatedPackagings, 
              periodTotalSales, 
              periodTotalProductCost, 
              periodTotalShipping,
              periodNetIncome 
            };
          });
        }, [salesPeriods, exchangeRate]);

        return (
          <div className="min-h-screen bg-slate-100 p-3 sm:p-6 font-sans text-[12.7px] sm:text-[14.7px]">
            <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col font-sans">
              
              <div className="p-4 sm:p-5 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-3 font-sans" style={{ backgroundColor: theme.headerBgColor }}>
                <div className="flex items-center gap-2.5 font-sans">
                  <div className="p-2 bg-black/20 rounded-xl text-white font-sans shadow-inner"><Icons.Table /></div>
                  <div className="font-sans">
                    <h1 className="text-[16.7px] sm:text-[18.7px] font-bold tracking-tight font-sans" style={{ color: theme.headerTextColor }}>週邊成本訂單管理</h1>
                    <p className="text-[12.7px] text-white/80 font-normal">目前編輯目標：<span className="font-bold underline">{currentDocTitle}</span></p>
                  </div>
                </div>
                <div className="flex items-center gap-2 flex-wrap font-sans w-full md:w-auto justify-end">
                  <button onClick={handleLoadGoogleSheetVersions} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[12.7px] font-bold transition-all font-sans bg-amber-500 hover:bg-amber-600 text-white shadow-md border border-amber-400"><Icons.Cloud /> 讀取雲端試算表資料</button>
                  <button onClick={handleManualSyncToCloud} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[12.7px] font-bold transition-all font-sans bg-emerald-600 hover:bg-emerald-700 text-white shadow-md border border-emerald-500"><Icons.Save /> 覆蓋儲存到此雲端試算表</button>
                  <button onClick={() => setShowGoogleSheets(!showGoogleSheets)} className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12.7px] font-semibold transition-all font-sans bg-black/15 text-white hover:bg-black/25 border border-white/20 shadow-sm"><Icons.FileSpreadsheet /> 設定與網址</button>
                  {activeTab === 'cost' && <button onClick={handleAddSalesPeriod} className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2 rounded-xl text-[12.7px] font-bold transition-all shadow-md font-sans border border-slate-700"><Icons.Plus /> 新增販售</button>}
                </div>
              </div>

              <div className="bg-slate-200/75 px-4 pt-2.5 flex items-center gap-2 border-b border-slate-300">
                <button onClick={() => setActiveTab('cost')} className={`px-5 py-2.5 rounded-t-xl font-bold text-[13.7px] transition-all flex items-center gap-2 ${activeTab === 'cost' ? 'bg-white text-slate-800 shadow-sm border-t-2 border-slate-900' : 'bg-transparent text-slate-600 hover:bg-white/50'}`}><Icons.Table /> 成本試算</button>
                <button onClick={() => setActiveTab('orders')} className={`px-5 py-2.5 rounded-t-xl font-bold text-[13.7px] transition-all flex items-center gap-2 ${activeTab === 'orders' ? 'bg-white text-slate-800 shadow-sm border-t-2 border-slate-900' : 'bg-transparent text-slate-600 hover:bg-white/50'}`}><Icons.Package /> 訂單管理{orders.length > 0 && <span className="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[11px] font-bold">{orders.length}</span>}</button>
              </div>

              {showGoogleSheets && (
                <div className="p-4 sm:p-5 bg-slate-50 border-b border-slate-200 flex flex-col gap-4 animate-fade-in text-[12.7px] font-sans">
                  <div className="flex justify-between items-center border-b border-slate-200 pb-3 font-sans">
                    <h3 className="font-bold text-slate-800 text-[14.7px] flex items-center gap-2 font-sans">📊 Google 試算表資料庫設定與版本管理</h3>
                    <button onClick={() => setShowGoogleSheets(false)} className="text-[12.7px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-semibold">關閉面板</button>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3">
                    <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                      <label className="font-bold text-slate-700 whitespace-nowrap">Google Apps Script Web App URL：</label>
                      <input type="text" value={gasWebappUrl} onChange={(e) => handleGasUrlChange(e.target.value)} className="flex-grow px-3 py-2 rounded-xl border border-slate-300 outline-none text-[12.7px] bg-slate-50 focus:bg-white" />
                    </div>
                    <p className="text-[11.7px] text-slate-500">💡 <strong>提示：</strong>此網址會自動儲存到您的 Google 帳號雲端中。無論您換到哪台電腦或哪個瀏覽器，只要登入帳號就會自動帶入，不需要重複輸入！</p>
                  </div>
                  <div className="flex justify-between items-center pt-2">
                    <span className="font-bold text-slate-700">Google 試算表中的存檔清單（可選擇讀取或直接刪除）：</span>
                    <button onClick={handleCreateNewSheetVersion} className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 text-[12.7px]"><Icons.Plus /> 建立新試算表版本</button>
                  </div>
                  {isLoadingSheet ? (
                    <div className="p-6 text-center text-slate-500 font-semibold">正在從 Google 試算表讀取資料中...</div>
                  ) : sheetVersions.length > 0 ? (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[250px] overflow-y-auto">
                      {sheetVersions.map((ver) => (
                        <div key={ver.id} className={`p-3.5 rounded-xl border transition-all flex flex-col justify-between gap-2 shadow-sm ${ver.id === currentDocId ? 'bg-sky-50 border-sky-400 ring-2 ring-sky-300' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>
                          <div className="flex justify-between items-start"><span className="font-bold text-[14.7px] text-slate-800">{ver.title || '未命名'}</span>{ver.id === currentDocId && <span className="bg-sky-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">目前編輯中</span>}</div>
                          <div className="text-[11px] text-slate-500 flex justify-between items-center">
                            <span>更新: {new Date(ver.lastUpdated || Date.now()).toLocaleString('zh-TW')}</span>
                            <div className="flex items-center gap-1.5">
                              <button onClick={() => handleSelectSheetVersion(ver)} className="bg-slate-900 hover:bg-slate-800 text-white px-2.5 py-1 rounded-lg font-bold text-[11px]">讀取</button>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div><label className="block font-semibold text-slate-600 mb-1 text-[12px]">收件人</label><input type="text" value={orderForm.recipient} onChange={(e) => handleOrderFormChange('recipient', e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white outline-none font-medium" /></div>
                        <div><label className="block font-semibold text-slate-600 mb-1 text-[12px]">電話</label><input type="text" value={orderForm.phone} onChange={(e) => handleOrderFormChange('phone', e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white outline-none font-medium" /></div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div><label className="block font-semibold text-slate-600 mb-1 text-[12px]">國家</label><input type="text" value={orderForm.country} onChange={(e) => handleOrderFormChange('country', e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white outline-none font-medium" /></div>
                        <div><label className="block font-semibold text-slate-600 mb-1 text-[12px]">地區</label><input type="text" value={orderForm.region} onChange={(e) => handleOrderFormChange('region', e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white outline-none font-medium" /></div>
                        <div><label className="block font-semibold text-slate-600 mb-1 text-[12px]">地址</label><input type="text" value={orderForm.address} onChange={(e) => handleOrderFormChange('address', e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white outline-none font-medium" /></div>
                      </div>
                      <div><label className="block font-semibold text-slate-600 mb-1 text-[12px]">備註</label><textarea rows="2" value={orderForm.notes} onChange={(e) => handleOrderFormChange('notes', e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white outline-none font-medium"></textarea></div>

                      <div className="flex justify-end gap-2 pt-2">
                        {editingOrderId && <button type="button" onClick={handleCancelEditOrder} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2.5 rounded-xl font-bold transition-all shadow-sm">取消編輯</button>}
                        <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-xl font-bold transition-all shadow-md flex items-center gap-2"><Icons.Plus /> {editingOrderId ? '儲存修改' : '新增訂單'}</button>
                      </div>
                    </form>
                  </div>

                  <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-4 sm:p-6 flex flex-col gap-4">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-200 pb-4">
                      <h3 className="text-[16.7px] font-bold text-slate-800 flex items-center gap-2">📋 訂單列表 ({filteredOrders.length})</h3>
                      <div className="flex flex-wrap items-center gap-2.5 w-full sm:w-auto">
                        <div className="relative flex-grow sm:flex-grow-0"><input type="text" value={orderSearchQuery} onChange={(e) => setOrderSearchQuery(e.target.value)} className="px-3.5 py-1.5 rounded-xl border border-slate-300 text-[12.7px] bg-slate-50 focus:bg-white outline-none w-full sm:w-64" /></div>
                        <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                          <button onClick={() => setOrderStatusFilter('all')} className={`px-3 py-1 rounded-lg font-bold text-[12px] transition-all ${orderStatusFilter === 'all' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}>全部</button>
                          <button onClick={() => setOrderStatusFilter('unshipped')} className={`px-3 py-1 rounded-lg font-bold text-[12px] transition-all ${orderStatusFilter === 'unshipped' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}>未出貨</button>
                          <button onClick={() => setOrderStatusFilter('shipped')} className={`px-3 py-1 rounded-lg font-bold text-[12px] transition-all ${orderStatusFilter === 'shipped' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}>已出貨</button>
                        </div>
                      </div>
                    </div>
                    {filteredOrders.length === 0 ? (
                      <div className="py-12 text-center text-slate-400 font-medium">目前沒有符合條件的訂單記錄</div>
                    ) : (
                      <>
                        <div className="hidden md:block overflow-x-auto">
                          <table className="w-full text-left border-collapse text-[13px]">
                            <thead><tr className="border-b border-slate-200 bg-slate-50 text-slate-600 font-bold"><th className="p-3">訂購日期</th><th className="p-3">暱稱</th><th className="p-3">購買品項與小計</th><th className="p-3 text-right">付款明細</th><th className="p-3">收件人</th><th className="p-3">出貨日期</th><th className="p-3 text-center">狀態</th><th className="p-3 text-center">操作</th></tr></thead>
                            <tbody className="divide-y divide-slate-100 font-medium">
                              {filteredOrders.map((order) => {
                                const globalRate = parseFloat(exchangeRate) || 0;
                                const pTotal = (order.items || []).reduce((acc, it) => acc + ((parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0)), 0);
                                const uVal = parseFloat(order.paymentUSD) || 0; const uCond = Math.round(uVal * globalRate); const sVal = parseFloat(order.shippingFee) || 0;
                                const grandTotal = pTotal + uCond + sVal;
                                return (
                                  <tr key={order.id} className="hover:bg-slate-50/70 transition-colors">
                                    <td className="p-3 text-slate-500 text-[12px] whitespace-nowrap">{order.orderDate || '-'}</td>
                                    <td className="p-3 font-bold text-slate-800">{order.nickname || '-'}</td>
                                    <td className="p-3">
                                      <div className="flex flex-col gap-1">
                                        {Array.isArray(order.items) && order.items.map((it, idx) => (
                                          <div key={idx} className="text-slate-900 font-semibold flex items-center gap-2"><span>• {it.productName || '(未命名)'} × {it.quantity || 1}</span><span className="text-red-600 font-bold">{formatCurrency((parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0))}</span></div>
                                        ))}
                                      </div>
                                      {order.notes && <div className="text-[11px] text-slate-400 mt-1 truncate max-w-xs">備註: {order.notes}</div>}
                                    </td>
                                    <td className="p-3 text-right">
                                      <div className="flex flex-col gap-0.5 text-[12px]">
                                        <div>商品: <span className="font-bold text-red-600">{formatCurrency(pTotal)}</span></div>
                                        {uVal > 0 && <div>USD: <span className="font-bold text-amber-700">US${uVal.toLocaleString()} (折合 {formatCurrency(uCond)})</span></div>}
                                        {sVal > 0 && <div>運費: <span className="font-bold text-purple-700">{formatCurrency(sVal)}</span></div>}
                                        <div className="border-t border-slate-200 pt-1 mt-0.5 font-extrabold text-slate-900 text-[13px]">總計: {formatCurrency(grandTotal)}</div>
                                      </div>
                                    </td>
                                    <td className="p-3"><div className="font-bold">{order.recipient || '-'}</div><div className="text-[11px] text-slate-500">{order.phone || '-'}</div>{(order.country || order.region) && <div className="text-[10px] text-slate-400 truncate max-w-[120px]">{order.country} {order.region}</div>}</td>
                                    <td className="p-3 text-slate-500 text-[12px] whitespace-nowrap">{order.shippingDate || '未設定'}</td>
                                    <td className="p-3 text-center">{order.shipped ? <span className="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-[11px] font-bold">已出貨</span> : <span className="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full text-[11px] font-bold">未出貨</span>}</td>
                                    <td className="p-3 text-center whitespace-nowrap">
                                      <div className="flex items-center justify-center gap-1.5"><button onClick={() => handleEditOrder(order)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg font-bold text-[11.7px]">編輯</button><button onClick={() => handleDeleteOrder(order.id)} className="bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1 rounded-lg font-bold text-[11.7px]">刪除</button></div>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                        <div className="md:hidden flex flex-col gap-3">
                          {filteredOrders.map((order) => {
                            const globalRate = parseFloat(exchangeRate) || 0;
                            const pTotal = (order.items || []).reduce((acc, it) => acc + ((parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0)), 0);
                            const uVal = parseFloat(order.paymentUSD) || 0; const uCond = Math.round(uVal * globalRate); const sVal = parseFloat(order.shippingFee) || 0;
                            const grandTotal = pTotal + uCond + sVal;
                            return (
                              <div key={order.id} className="bg-slate-50/80 rounded-xl p-4 border border-slate-200 flex flex-col gap-3 shadow-sm">
                                <div className="flex justify-between items-start border-b border-slate-200 pb-2"><div><span className="font-extrabold text-[14.7px] text-slate-900">{order.nickname || '無暱稱'}</span><span className="text-slate-400 text-[11px] ml-2">{order.orderDate}</span></div>{order.shipped ? <span className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-[11px] font-bold">已出貨</span> : <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full text-[11px] font-bold">未出貨</span>}</div>
                                <div className="flex flex-col gap-1 text-[13px]"><span className="text-slate-500 font-semibold">購買品項：</span><div className="bg-white p-2.5 rounded-xl border border-slate-200 flex flex-col gap-1.5">
                                  {Array.isArray(order.items) && order.items.map((it, idx) => (
                                    <div key={idx} className="font-bold text-slate-900 flex justify-between items-center text-[12.5px]"><span>• {it.productName || '(未命名)'} ({it.quantity || 1} × {formatCurrency(it.unitPrice)})</span><span className="text-red-600">{formatCurrency((parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0))}</span></div>
                                  ))}
                                </div></div>
                                <div className="flex flex-col gap-1 text-[13px] bg-white p-2.5 rounded-xl border border-slate-200"><span className="text-slate-500 font-semibold text-[11px]">付款總額明細：</span><div className="flex justify-between"><span>商品總額</span><span className="font-bold text-red-600">{formatCurrency(pTotal)}</span></div>{uVal > 0 && <div className="flex justify-between"><span>USD 售價 (折合)</span><span className="font-bold text-amber-700">US${uVal} ({formatCurrency(uCond)})</span></div>}{sVal > 0 && <div className="flex justify-between"><span>運費</span><span className="font-bold text-purple-700">{formatCurrency(sVal)}</span></div>}<div className="border-t border-slate-100 pt-1 mt-1 font-extrabold text-slate-900 flex justify-between text-[14px]"><span>付款總額</span><span className="text-indigo-700">{formatCurrency(grandTotal)}</span></div></div>
                                <div className="grid grid-cols-2 gap-2 text-[13px]"><div><span className="text-slate-500">收件人：</span><span className="font-semibold">{order.recipient || '-'} ({order.phone || '-'})</span></div><div><span className="text-slate-500">出貨日期：</span><span className="font-semibold">{order.shippingDate || '未出貨'}</span></div></div>
                                {(order.country || order.region || order.address) && <div className="text-[12px] bg-white p-2.5 rounded-xl border border-slate-200 flex flex-col gap-1">{order.country && <div className="text-slate-700">🌍 {order.country}</div>}{order.region && <div className="text-slate-700">📍 {order.region}</div>}{order.address && <div className="text-slate-700">🏠 {order.address}</div>}</div>}
                                {order.notes && <div className="text-[12px] bg-amber-50/50 p-2 rounded-lg border border-amber-100 text-amber-900"><span className="font-bold">備註：</span> {order.notes}</div>}
                                <div className="flex justify-end gap-2 pt-1 border-t border-slate-200"><button onClick={() => handleEditOrder(order)} className="bg-white hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-bold text-[12px] border border-slate-300">編輯</button><button onClick={() => handleDeleteOrder(order.id)} className="bg-rose-500 hover:bg-rose-600 text-white px-3.5 py-1.5 rounded-lg font-bold text-[12px]">刪除</button></div>
                              </div>
                            );
                          })}
                        </div>
                      </>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<MailOrderCalculator />);
    </script>
</body>
</html>
