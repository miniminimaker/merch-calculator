      function MailOrderCalculator() {
        const defaultTheme = {
          headerBgColor: '#69AFB0',          
          headerTextColor: '#FFFFFF',        
          labelTextColor: '#4A5565',         
          inputBgColor: '#FFFFFF',           
          inputTextColor: '#0F172A',         
          
          vendorBadgeBgColor: '#4A81D3',     
          vendorHeaderBgColor: '#CAE6F7',     
          vendorBoxBgColor: '#F8FAFC',        
          taiwanBoxBgColor: '#F0F9FF',       
          taiwanTitleColor: '#0369A1',       
          overseasBoxBgColor: '#FFFBEB',     
          overseasTitleColor: '#B45309',     
          salesTextColor: '#DC2626',         
          qtyTextColor: '#2563EB',           

          packagingBadgeBgColor: '#4C7F29',    
          packagingHeaderBgColor: '#F1F9F3', 
          packagingBoxBgColor: '#F8FAFC'     
        };

        const [exchangeRate, setExchangeRate] = useState(() => {
          const saved = localStorage.getItem('moc_exchangeRate');
          return saved !== null ? saved : '31.5';
        });

        const [showSettings, setShowSettings] = useState(false);
        const [showDataIntegration, setShowDataIntegration] = useState(false);
        const [selectedExportIds, setSelectedExportIds] = useState({});
        const [exportNotice, setExportNotice] = useState('');
        const [lastSavedTime, setLastSavedTime] = useState(() => {
          return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        });
        
        const [theme, setTheme] = useState(() => {
          const saved = localStorage.getItem('moc_theme');
          return saved ? JSON.parse(saved) : defaultTheme;
        });

        const [salesPeriods, setSalesPeriods] = useState(() => {
          const saved = localStorage.getItem('moc_salesPeriods');
          if (saved) {
            try {
              return JSON.parse(saved);
            } catch (e) {
              console.error(e);
            }
          }
          return [
            {
              id: 1,
              preorderTime: '',
              productionTime: '',
              vendors: [
                {
                  id: 101,
                  vendorName: '',
                  shippingCost: '',
                  items: [
                    {
                      id: 1001,
                      itemTitle: '',
                      productName: '',
                      specs: '',
                      style: '',
                      notes: '',
                      printQty: '',
                      unitCost: '',
                      twdPrice: '',
                      taiwanSalesQty: '',
                      usdPrice: '',
                      overseasSalesQty: ''
                    }
                  ]
                }
              ],
              packagings: []
            }
          ];
        });

        // ==========================================
        // FIREBASE v12 AUTH & FIRESTORE SYNC LOGIC
        // ==========================================
        const [user, setUser] = useState(null);
        const [syncStatus, setSyncStatus] = useState('Offline');
        const isRemoteLoading = useRef(false);
        const lastSyncedPayloadRef = useRef(null);
        const lastUpdatedRef = useRef(new Date().toISOString());

        // Listen for Firebase Auth state changes and handle cloud synchronization with timestamp conflict resolution
        useEffect(() => {
          const checkFirebaseReady = () => {
            if (window.firebaseService) {
              const { auth, onAuthStateChanged, db, doc, getDoc, setDoc } = window.firebaseService;
              
              onAuthStateChanged(auth, async (currentUser) => {
                setUser(currentUser);
                if (currentUser) {
                  setSyncStatus('Syncing...');
                  try {
                    isRemoteLoading.current = true;
                    const userDocRef = doc(db, 'users', currentUser.uid);
                    const docSnap = await getDoc(userDocRef);
                    
                    const localLastUpdated = localStorage.getItem('moc_lastUpdated') || new Date(0).toISOString();

                    if (docSnap.exists()) {
                      const remoteData = docSnap.data();
                      const remoteLastUpdated = remoteData.lastUpdated || new Date(0).toISOString();

                      // Compare lastUpdated: Keep newest version
                      if (new Date(remoteLastUpdated) > new Date(localLastUpdated)) {
                        if (remoteData.salesPeriods) {
                          setSalesPeriods(remoteData.salesPeriods);
                          localStorage.setItem('moc_salesPeriods', JSON.stringify(remoteData.salesPeriods));
                        }
                        if (remoteData.exchangeRate !== undefined) {
                          setExchangeRate(remoteData.exchangeRate);
                          localStorage.setItem('moc_exchangeRate', remoteData.exchangeRate);
                        }
                        if (remoteData.theme) {
                          setTheme(remoteData.theme);
                          localStorage.setItem('moc_theme', JSON.stringify(remoteData.theme));
                        }
                        lastUpdatedRef.current = remoteLastUpdated;
                        localStorage.setItem('moc_lastUpdated', remoteLastUpdated);
                      } else {
                        // Local is newer or equal, upload local to Firestore
                        const currentPayload = {
                          salesPeriods,
                          exchangeRate,
                          theme,
                          lastUpdated: localLastUpdated
                        };
                        await setDoc(userDocRef, currentPayload);
                        lastUpdatedRef.current = localLastUpdated;
                      }
                      setSyncStatus('Synced');
                    } else {
                      // If Firestore document does not exist yet, upload current local data
                      const currentPayload = {
                        salesPeriods,
                        exchangeRate,
                        theme,
                        lastUpdated: lastUpdatedRef.current
                      };
                      await setDoc(userDocRef, currentPayload);
                      localStorage.setItem('moc_lastUpdated', lastUpdatedRef.current);
                      setSyncStatus('Synced');
                    }
                  } catch (err) {
                    console.error("Firestore sync error:", err);
                    setSyncStatus('Sync failed');
                  } finally {
                    isRemoteLoading.current = false;
                  }
                } else {
                  setSyncStatus(navigator.onLine ? 'Synced' : 'Offline');
                }
              });
            }
          };

          if (window.firebaseService) {
            checkFirebaseReady();
          } else {
            window.addEventListener('firebase-ready', checkFirebaseReady);
            return () => window.removeEventListener('firebase-ready', checkFirebaseReady);
          }
        }, []);

        // Online/Offline status listeners
        useEffect(() => {
          const handleOnline = () => {
            if (user) setSyncStatus('Synced');
            else setSyncStatus('Offline');
          };
          const handleOffline = () => {
            setSyncStatus('Offline');
          };
          window.addEventListener('online', handleOnline);
          window.addEventListener('offline', handleOffline);
          return () => {
            window.removeEventListener('online', handleOnline);
            window.removeEventListener('offline', handleOffline);
          };
        }, [user]);

        const handleGoogleLogin = async () => {
          if (!window.firebaseService) return;
          const { auth, googleProvider, signInWithPopup } = window.firebaseService;
          try {
            setSyncStatus('Syncing...');
            await signInWithPopup(auth, googleProvider);
          } catch (err) {
            console.error("Login failed:", err);
            setSyncStatus('Sync failed');
          }
        };

        const handleLogout = async () => {
          if (!window.firebaseService) return;
          const { auth, signOut } = window.firebaseService;
          try {
            await signOut(auth);
            setUser(null);
            setSyncStatus('Offline');
          } catch (err) {
            console.error("Logout failed:", err);
          }
        };

        // Unified single useEffect for saving to LocalStorage and Firestore (with dirty check & loop prevention)
        useEffect(() => {
          // 1. Always save to LocalStorage as offline cache
          localStorage.setItem('moc_exchangeRate', exchangeRate);
          localStorage.setItem('moc_theme', JSON.stringify(theme));
          localStorage.setItem('moc_salesPeriods', JSON.stringify(salesPeriods));
          
          const nowIso = new Date().toISOString();
          lastUpdatedRef.current = nowIso;
          localStorage.setItem('moc_lastUpdated', nowIso);

          const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setLastSavedTime(timeStr);

          // 2. Sync to Firestore only if user is logged in, not currently loading remote data, and data actually changed
          if (user && !isRemoteLoading.current && window.firebaseService) {
            const payload = {
              salesPeriods,
              exchangeRate,
              theme,
              lastUpdated: nowIso
            };
            const payloadString = JSON.stringify(payload);

            // Only upload when data really changed compared to last synced payload
            if (lastSyncedPayloadRef.current !== payloadString) {
              const { db, doc, setDoc } = window.firebaseService;
              setSyncStatus('Syncing...');
              setDoc(doc(db, 'users', user.uid), payload, { merge: true })
                .then(() => {
                  lastSyncedPayloadRef.current = payloadString;
                  setSyncStatus('Synced');
                })
                .catch((err) => {
                  console.error("Firestore save error:", err);
                  setSyncStatus('Sync failed');
                });
            }
          }
        }, [exchangeRate, theme, salesPeriods, user]);

        const handleAddSalesPeriod = () => {
          const newSp = {
            id: Date.now(),
            preorderTime: '',
            productionTime: '',
            vendors: [
              {
                id: Date.now() + 1,
                vendorName: '',
                shippingCost: '',
                items: [
                  {
                    id: Date.now() + 2,
                    itemTitle: '',
                    productName: '',
                    specs: '',
                    style: '',
                    notes: '',
                    printQty: '',
                    unitCost: '',
                    twdPrice: '',
                    taiwanSalesQty: '',
                    usdPrice: '',
                    overseasSalesQty: ''
                  }
                ]
              }
            ],
            packagings: []
          };
          setSalesPeriods([...salesPeriods, newSp]);
        };

        const handleDeleteSalesPeriod = (spId) => {
          setSalesPeriods(salesPeriods.filter(sp => sp.id !== spId));
        };

        const handleSalesPeriodFieldChange = (spId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId ? { ...sp, [field]: value } : sp));
        };

        const handleAddVendor = (spId) => {
          const newVendor = {
            id: Date.now(),
            vendorName: '',
            shippingCost: '',
            items: [
              {
                id: Date.now() + 1,
                itemTitle: '',
                productName: '',
                specs: '',
                style: '',
                notes: '',
                printQty: '',
                unitCost: '',
                twdPrice: '',
                taiwanSalesQty: '',
                usdPrice: '',
                overseasSalesQty: ''
              }
            ]
          };
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId) {
              return { ...sp, vendors: [...sp.vendors, newVendor] };
            }
            return sp;
          }));
        };

        const handleDeleteVendor = (spId, vendorId) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId) {
              return { ...sp, vendors: sp.vendors.filter(v => v.id !== vendorId) };
            }
            return sp;
          }));
        };

        const handleVendorFieldChange = (spId, vendorId, field, value) => {
          if (field === 'shippingCost') {
            if (value === '' || /^\d*\.?\d*$/.test(value)) {
              setSalesPeriods(salesPeriods.map(sp => {
                if (sp.id === spId) {
                  const updatedVendors = sp.vendors.map(v => v.id === vendorId ? { ...v, [field]: value } : v);
                  return { ...sp, vendors: updatedVendors };
                }
                return sp;
              }));
            }
          } else if (field === 'vendorName') {
            setSalesPeriods(salesPeriods.map(sp => {
              if (sp.id === spId) {
                const updatedVendors = sp.vendors.map(v => v.id === vendorId ? { ...v, vendorName: value } : v);
                return { ...sp, vendors: updatedVendors };
              }
              return sp;
            }));
          }
        };

        const handleAddItem = (spId, vendorId) => {
          const newItem = {
            id: Date.now(),
            itemTitle: '',
            productName: '',
            specs: '',
            style: '',
            notes: '',
            printQty: '',
            unitCost: '',
            twdPrice: '',
            taiwanSalesQty: '',
            usdPrice: '',
            overseasSalesQty: ''
          };
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId) {
              const updatedVendors = sp.vendors.map(v => {
                if (v.id === vendorId) {
                  return { ...v, items: [...v.items, newItem] };
                }
                return v;
              });
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        const handleDeleteItem = (spId, vendorId, itemId) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId) {
              const updatedVendors = sp.vendors.map(v => {
                if (v.id === vendorId) {
                  return { ...v, items: v.items.filter(item => item.id !== itemId) };
                }
                return v;
              });
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        const handleItemFieldChange = (spId, vendorId, itemId, field, value) => {
          const numericFields = ['printQty', 'unitCost', 'twdPrice', 'taiwanSalesQty', 'usdPrice', 'overseasSalesQty'];
          if (numericFields.includes(field)) {
            if (value === '' || /^\d*\.?\d*$/.test(value)) {
              setSalesPeriods(salesPeriods.map(sp => {
                if (sp.id === spId) {
                  const updatedVendors = sp.vendors.map(v => {
                    if (v.id === vendorId) {
                      const updatedItems = v.items.map(item => item.id === itemId ? { ...item, [field]: value } : item);
                      return { ...v, items: updatedItems };
                    }
                    return v;
                  });
                  return { ...sp, vendors: updatedVendors };
                }
                return sp;
              }));
            }
          } else {
            setSalesPeriods(salesPeriods.map(sp => {
              if (sp.id === spId) {
                const updatedVendors = sp.vendors.map(v => {
                  if (v.id === vendorId) {
                    const updatedItems = v.items.map(item => item.id === itemId ? { ...item, [field]: value } : item);
                    return { ...v, items: updatedItems };
                  }
                  return v;
                });
                return { ...sp, vendors: updatedVendors };
              }
              return sp;
            }));
          }
        };

        const handleAddPackaging = (spId) => {
          const newPkgVendor = {
            id: Date.now(),
            vendorName: '',
            shippingCost: '',
            items: [
              {
                id: Date.now() + 1,
                packagingTitle: '',
                style: '',
                specs: '',
                notes: '',
                qty: '',
                unitCost: ''
              }
            ]
          };
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId) {
              const packagings = sp.packagings || [];
              return { ...sp, packagings: [...packagings, newPkgVendor] };
            }
            return sp;
          }));
        };

        const handleDeletePackaging = (spId, pkgVendorId) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId) {
              const packagings = (sp.packagings || []).filter(p => p.id !== pkgVendorId);
              return { ...sp, packagings };
            }
            return sp;
          }));
        };

        const handlePkgVendorFieldChange = (spId, pkgVendorId, field, value) => {
          if (field === 'shippingCost') {
            if (value === '' || /^\d*\.?\d*$/.test(value)) {
              setSalesPeriods(salesPeriods.map(sp => {
                if (sp.id === spId) {
                  const updatedPackagings = (sp.packagings || []).map(p => p.id === pkgVendorId ? { ...p, [field]: value } : p);
                  return { ...sp, packagings: updatedPackagings };
                }
                return sp;
              }));
            }
          } else if (field === 'vendorName') {
            setSalesPeriods(salesPeriods.map(sp => {
              if (sp.id === spId) {
                const updatedPackagings = (sp.packagings || []).map(p => p.id === pkgVendorId ? { ...p, vendorName: value } : p);
                return { ...sp, packagings: updatedPackagings };
              }
              return sp;
            }));
          }
        };

        const handleAddPkgItem = (spId, pkgVendorId) => {
          const newItem = {
            id: Date.now(),
            packagingTitle: '',
            style: '',
            specs: '',
            notes: '',
            qty: '',
            unitCost: ''
          };
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId) {
              const updatedPackagings = (sp.packagings || []).map(p => {
                if (p.id === pkgVendorId) {
                  return { ...p, items: [...(p.items || []), newItem] };
                }
                return p;
              });
              return { ...sp, packagings: updatedPackagings };
            }
            return sp;
          }));
        };

        const handleDeletePkgItem = (spId, pkgVendorId, pkgItemId) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId) {
              const updatedPackagings = (sp.packagings || []).map(p => {
                if (p.id === pkgVendorId) {
                  return { ...p, items: (p.items || []).filter(item => item.id !== pkgItemId) };
                }
                return p;
              });
              return { ...sp, packagings: updatedPackagings };
            }
            return sp;
          }));
        };

        const handlePkgItemFieldChange = (spId, pkgVendorId, pkgItemId, field, value) => {
          const numericFields = ['qty', 'unitCost'];
          if (numericFields.includes(field)) {
            if (value === '' || /^\d*\.?\d*$/.test(value)) {
              setSalesPeriods(salesPeriods.map(sp => {
                if (sp.id === spId) {
                  const updatedPackagings = (sp.packagings || []).map(p => {
                    if (p.id === pkgVendorId) {
                      const updatedItems = (p.items || []).map(item => item.id === pkgItemId ? { ...item, [field]: value } : item);
                      return { ...p, items: updatedItems };
                    }
                    return p;
                  });
                  return { ...sp, packagings: updatedPackagings };
                }
                return sp;
              }));
            }
          } else {
            setSalesPeriods(salesPeriods.map(sp => {
              if (sp.id === spId) {
                const updatedPackagings = (sp.packagings || []).map(p => {
                  if (p.id === pkgVendorId) {
                    const updatedItems = (p.items || []).map(item => item.id === pkgItemId ? { ...item, [field]: value } : item);
                    return { ...p, items: updatedItems };
                  }
                  return p;
                });
                return { ...sp, packagings: updatedPackagings };
              }
              return sp;
            }));
          }
        };

        const handleToggleExportSelection = (spId) => {
          setSelectedExportIds(prev => ({ ...prev, [spId]: !prev[spId] }));
        };

        const handleExportSelectedData = () => {
          const selectedIds = Object.keys(selectedExportIds).filter(id => selectedExportIds[id]);
          if (selectedIds.length === 0) {
            setExportNotice('請至少勾選一個資料區塊進行匯出');
            setTimeout(() => setExportNotice(''), 3000);
            return;
          }

          let csv = '\ufeff';
          csv += '週邊成本試算表 - 勾選區塊匯出\n\n';

          calculatedData.forEach(calcSp => {
            if (selectedIds.includes(String(calcSp.id))) {
              csv += `========================================\n`;
              csv += `預購時間: ${calcSp.preorderTime}, 製作時間: ${calcSp.productionTime}\n`;
              csv += `本場次總銷售額: ${calcSp.periodTotalSales}, 最終淨收: ${calcSp.periodNetIncome}\n`;
              csv += `========================================\n`;
              csv += '【廠商】,廠商名稱,運費,品項名稱,品名,款式,規格,備註,印製數量,成本單價,台幣售價,台灣銷售量,台灣銷售額,美金售價,美金換台幣,海外銷售量,海外銷售額,總銷售數量,總銷售額\n';
              calcSp.vendors.forEach(v => {
                v.items.forEach(item => {
                  csv += `【廠商】,"${v.vendorName}",${v.shippingCost},"${item.itemTitle}","${item.productName}","${item.style}","${item.specs}","${item.notes}",${item.printQty},${item.unitCost},${item.twdPrice},${item.taiwanSalesQty},${item.taiwanRevenue},${item.usdPrice},${item.usdToTwd},${item.overseasSalesQty},${item.overseasRevenue},${item.totalSalesQty},${item.totalSalesAmount}\n`;
                });
              });

              csv += '\n【包材】,廠商名稱,運費,包材品項,款式,規格,備註,數量,單價成本,總成本\n';
              calcSp.packagings.forEach(pv => {
                const itemsList = pv.items || [];
                itemsList.forEach(pkg => {
                  csv += `【包材】,"${pv.vendorName}",${pv.shippingCost},"${pkg.packagingTitle || ''}","${pkg.style || ''}","${pkg.specs || ''}","${pkg.notes || ''}",${pkg.qty || 0},${pkg.unitCost || 0},${pkg.totalCost || 0}\n`;
                });
              });
              csv += '\n\n';
            }
          });

          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', `勾選區塊匯出_成本試算表.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const handleExportJson = () => {
          const data = {
            exchangeRate,
            theme,
            salesPeriods
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', `週邊成本試算表_備份_${new Date().toISOString().slice(0, 10)}.json`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const handleImportJson = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.salesPeriods && Array.isArray(parsed.salesPeriods)) {
                setSalesPeriods(parsed.salesPeriods);
                if (parsed.exchangeRate !== undefined) setExchangeRate(parsed.exchangeRate);
                if (parsed.theme) setTheme(parsed.theme);
                setExportNotice('JSON 匯入成功！');
              } else {
                setExportNotice('JSON 格式錯誤：找不到有效場次資料');
              }
            } catch (err) {
              setExportNotice('JSON 解析失敗，請確認檔案格式是否正確');
            }
            setTimeout(() => setExportNotice(''), 4000);
          };
          reader.readAsText(file);
          e.target.value = '';
        };

        const calculatedData = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;

          return salesPeriods.map(sp => {
            let periodTotalSales = 0;
            let periodTotalCost = 0;

            const calculatedVendors = (sp.vendors || []).map(vendor => {
              const vendorShipping = parseFloat(vendor.shippingCost) || 0;

              const rawItems = (vendor.items || []).map(item => {
                const printQty = parseFloat(item.printQty) || 0;
                const unitCost = parseFloat(item.unitCost) || 0;
                const totalAmount = printQty * unitCost;
                return { ...item, printQty, unitCost, totalAmount };
              });

              const totalVendorItemsAmount = rawItems.reduce((sum, item) => sum + item.totalAmount, 0);
              
              periodTotalCost += totalVendorItemsAmount + vendorShipping;

              const calculatedItems = rawItems.map(item => {
                const printQty = item.printQty;
                const totalAmount = item.totalAmount;

                let itemShipping = 0;
                if (totalVendorItemsAmount > 0) {
                  itemShipping = vendorShipping * (totalAmount / totalVendorItemsAmount);
                } else if (vendor.items.length > 0) {
                  itemShipping = vendorShipping / vendor.items.length;
                }

                const totalCost = totalAmount + itemShipping;

                const twdPrice = parseFloat(item.twdPrice) || 0;
                const taiwanSalesQty = parseFloat(item.taiwanSalesQty) || 0;
                const taiwanRevenue = twdPrice * taiwanSalesQty;

                const usdPrice = parseFloat(item.usdPrice) || 0;
                const overseasSalesQty = parseFloat(item.overseasSalesQty) || 0;
                const usdToTwd = Math.round(usdPrice * globalRate);
                const overseasRevenue = usdToTwd * overseasSalesQty;

                const totalSalesQty = taiwanSalesQty + overseasSalesQty;
                const totalSalesAmount = taiwanRevenue + overseasRevenue;

                periodTotalSales += totalSalesAmount;

                return {
                  ...item,
                  shippingCost: itemShipping,
                  totalAmount,
                  totalCost,
                  taiwanRevenue,
                  usdToTwd,
                  overseasRevenue,
                  totalSalesQty,
                  totalSalesAmount
                };
              });

              return {
                ...vendor,
                items: calculatedItems
              };
            });

            const calculatedPackagings = (sp.packagings || []).map(pkgVendor => {
              const itemsList = pkgVendor.items || [];
              const vendorShipping = parseFloat(pkgVendor.shippingCost) || 0;

              const rawPkgItems = itemsList.map(item => {
                const qty = parseFloat(item.qty) || 0;
                const unitCost = parseFloat(item.unitCost) || 0;
                const totalAmount = qty * unitCost;
                return { ...item, qty, unitCost, totalAmount };
              });

              const totalPkgItemsAmount = rawPkgItems.reduce((sum, item) => sum + item.totalAmount, 0);
              periodTotalCost += totalPkgItemsAmount + vendorShipping;

              const calculatedPkgItems = rawPkgItems.map(item => {
                const qty = item.qty;
                const totalAmount = item.totalAmount;
                let itemShipping = 0;
                if (totalPkgItemsAmount > 0) {
                  itemShipping = vendorShipping * (totalAmount / totalPkgItemsAmount);
                } else if (itemsList.length > 0) {
                  itemShipping = vendorShipping / itemsList.length;
                }
                const totalCost = totalAmount + itemShipping;
                return {
                  ...item,
                  shippingCost: itemShipping,
                  totalAmount,
                  totalCost
                };
              });

              return {
                ...pkgVendor,
                items: calculatedPkgItems
              };
            });

            const periodNetIncome = periodTotalSales - periodTotalCost;

            return {
              ...sp,
              vendors: calculatedVendors,
              packagings: calculatedPackagings,
              periodTotalSales,
              periodTotalCost,
              periodNetIncome
            };
          });
        }, [salesPeriods, exchangeRate]);

        return (
          <div className="min-h-screen bg-slate-100 p-3 sm:p-6 font-sans text-[12.7px] sm:text-[14.7px]">
            <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col font-sans">
              
              {/* Top Header */}
              <div 
                className="p-4 sm:p-5 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-3 font-sans"
                style={{ backgroundColor: theme.headerBgColor }}
              >
                <div className="flex items-center gap-2.5 font-sans">
                  <div className="p-2 bg-black/20 rounded-xl text-white font-sans shadow-inner">
                    <Icons.Table />
                  </div>
                  <div className="font-sans">
                    <h1 className="text-[16.7px] sm:text-[18.7px] font-bold tracking-tight font-sans" style={{ color: theme.headerTextColor }}>週邊成本試算表</h1>
                    <p className="text-[12.7px] text-white/80 font-normal">多場次與海外通販財務試算工具</p>
                  </div>
                </div>

                <div className="flex items-center gap-2 flex-wrap font-sans w-full md:w-auto justify-end">
                  <button 
                    onClick={() => { setShowSettings(!showSettings); if(!showSettings) setShowDataIntegration(false); }}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12.7px] font-semibold transition-all font-sans border border-white/20 shadow-sm ${showSettings ? 'bg-black/40 text-white' : 'bg-black/15 text-white hover:bg-black/25'}`}
                  >
                    <Icons.Settings /> 外觀顏色
                  </button>

                  <button 
                    onClick={() => { setShowDataIntegration(!showDataIntegration); if(!showDataIntegration) setShowSettings(false); }}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12.7px] font-semibold transition-all font-sans border border-white/20 shadow-sm ${showDataIntegration ? 'bg-black/40 text-white' : 'bg-black/15 text-white hover:bg-black/25'}`}
                  >
                    <Icons.Database /> 資料整合
                  </button>

                  <button 
                    onClick={handleAddSalesPeriod}
                    className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2 rounded-xl text-[12.7px] font-bold transition-all shadow-md font-sans border border-slate-700"
                  >
                    <Icons.Plus /> 新增場次
                  </button>
                </div>
              </div>

              {/* Categorized Color Settings Panel */}
              {showSettings && (
                <div className="p-4 sm:p-5 bg-slate-50 border-b border-slate-200 flex flex-col gap-5 animate-fade-in text-[12.7px] font-sans">
                  <div className="flex justify-between items-center border-b border-slate-200 pb-3 font-sans">
                    <h3 className="font-bold text-slate-800 text-[14.7px] flex items-center gap-2 font-sans">🎨 外觀色彩配置面板</h3>
                    <button 
                      onClick={() => setTheme(defaultTheme)}
                      className="text-[12.7px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-semibold transition-colors font-sans"
                    >
                      恢復預設顏色
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 font-sans">
                    <div className="bg-white p-3.5 rounded-xl shadow-sm flex flex-col gap-2.5 font-sans border border-slate-200">
                      <h4 className="font-bold text-slate-700 uppercase bg-slate-100 p-2 rounded-lg font-sans text-[12.7px]">1. 表頭與全域</h4>
                      <ColorPickerItem label="區塊表頭" value={theme.headerBgColor} onChange={(v)=>setTheme({...theme, headerBgColor:v})} />
                      <ColorPickerItem label="表頭文字" value={theme.headerTextColor} onChange={(v)=>setTheme({...theme, headerTextColor:v})} />
                      <ColorPickerItem label="欄位標籤" value={theme.labelTextColor} onChange={(v)=>setTheme({...theme, labelTextColor:v})} />
                      <ColorPickerItem label="輸入欄背景" value={theme.inputBgColor} onChange={(v)=>setTheme({...theme, inputBgColor:v})} />
                      <ColorPickerItem label="輸入文字" value={theme.inputTextColor} onChange={(v)=>setTheme({...theme, inputTextColor:v})} />
                    </div>

                    <div className="bg-white p-3.5 rounded-xl shadow-sm flex flex-col gap-2.5 font-sans border border-slate-200">
                      <h4 className="font-bold text-slate-700 uppercase bg-slate-100 p-2 rounded-lg font-sans text-[12.7px]">2. 廠商與銷售區塊</h4>
                      <ColorPickerItem label="【廠商】標籤" value={theme.vendorBadgeBgColor} onChange={(v)=>setTheme({...theme, vendorBadgeBgColor:v})} />
                      <ColorPickerItem label="廠商表頭底色" value={theme.vendorHeaderBgColor} onChange={(v)=>setTheme({...theme, vendorHeaderBgColor:v})} />
                      <ColorPickerItem label="廠商區塊底色" value={theme.vendorBoxBgColor} onChange={(v)=>setTheme({...theme, vendorBoxBgColor:v})} />
                      <ColorPickerItem label="🇹🇼 台灣區塊" value={theme.taiwanBoxBgColor} onChange={(v)=>setTheme({...theme, taiwanBoxBgColor:v})} />
                      <ColorPickerItem label="🇹🇼 台灣標題" value={theme.taiwanTitleColor} onChange={(v)=>setTheme({...theme, taiwanTitleColor:v})} />
                      <ColorPickerItem label="🌍 海外區塊" value={theme.overseasBoxBgColor} onChange={(v)=>setTheme({...theme, overseasBoxBgColor:v})} />
                      <ColorPickerItem label="🌍 海外標題" value={theme.overseasTitleColor} onChange={(v)=>setTheme({...theme, overseasTitleColor:v})} />
                      <ColorPickerItem label="銷售額文字" value={theme.salesTextColor} onChange={(v)=>setTheme({...theme, salesTextColor:v})} />
                      <ColorPickerItem label="數量文字" value={theme.qtyTextColor} onChange={(v)=>setTheme({...theme, qtyTextColor:v})} />
                    </div>

                    <div className="bg-white p-3.5 rounded-xl shadow-sm flex flex-col gap-2.5 font-sans border border-slate-200">
                      <h4 className="font-bold text-slate-700 uppercase bg-slate-100 p-2 rounded-lg font-sans text-[12.7px]">3. 包材區塊</h4>
                      <ColorPickerItem label="【包材】標籤" value={theme.packagingBadgeBgColor} onChange={(v)=>setTheme({...theme, packagingBadgeBgColor:v})} />
                      <ColorPickerItem label="包材表頭" value={theme.packagingHeaderBgColor} onChange={(v)=>setTheme({...theme, packagingHeaderBgColor:v})} />
                      <ColorPickerItem label="包材區塊" value={theme.packagingBoxBgColor} onChange={(v)=>setTheme({...theme, packagingBoxBgColor:v})} />
                    </div>
                  </div>
                </div>
              )}

              {/* Data Integration Panel */}
              {showDataIntegration && (
                <div className="p-4 sm:p-5 bg-slate-50 border-b border-slate-200 flex flex-col gap-5 animate-fade-in text-[12.7px] font-sans">
                  <div className="flex justify-between items-center border-b border-slate-200 pb-3 font-sans">
                    <h3 className="font-bold text-slate-800 text-[14.7px] flex items-center gap-2 font-sans">📥 資料整合與備份管理</h3>
                    <button 
                      onClick={() => setShowDataIntegration(false)}
                      className="text-[12.7px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-semibold transition-colors font-sans"
                    >
                      關閉面板
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 font-sans">
                    <div className="bg-white p-3.5 rounded-xl shadow-sm flex flex-col gap-3 font-sans border border-slate-200">
                      <h4 className="font-bold text-slate-700 uppercase bg-slate-100 p-2 rounded-lg font-sans text-[12.7px]">Excel 匯出</h4>
                      <button 
                        onClick={handleExportSelectedData}
                        className="w-full flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2.5 rounded-xl font-bold transition-all shadow-sm font-sans border border-slate-700 text-[12.7px]"
                      >
                        <Icons.Download /> 匯出勾選區塊 (CSV)
                      </button>
                    </div>

                    <div className="bg-white p-3.5 rounded-xl shadow-sm flex flex-col gap-3 font-sans border border-slate-200">
                      <h4 className="font-bold text-slate-700 uppercase bg-slate-100 p-2 rounded-lg font-sans text-[12.7px]">JSON 備份</h4>
                      <button 
                        onClick={handleExportJson}
                        className="w-full flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2.5 rounded-xl font-bold transition-all shadow-sm font-sans border border-slate-700 text-[12.7px]"
                      >
                        <Icons.Download /> 匯出完整備份檔
                      </button>
                    </div>

                    <div className="bg-white p-3.5 rounded-xl shadow-sm flex flex-col gap-3 font-sans border border-slate-200">
                      <h4 className="font-bold text-slate-700 uppercase bg-slate-100 p-2 rounded-lg font-sans text-[12.7px]">JSON 還原</h4>
                      <label className="w-full flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2.5 rounded-xl font-bold transition-all shadow-sm font-sans cursor-pointer border border-slate-700 text-[12.7px]">
                        <Icons.Download /> 選擇檔案還原
                        <input type="file" accept=".json" onChange={handleImportJson} className="hidden" />
                      </label>
                    </div>
                  </div>
                </div>
              )}

              {/* Status Bar (Kept unchanged with text-[11px] per instructions) */}
              <div className="px-4 sm:px-5 py-2.5 bg-slate-100 border-b border-slate-200 flex justify-between items-center gap-3 flex-wrap font-sans text-[11px]">
                <div className="flex items-center gap-2.5 flex-wrap">
                  <div className="flex items-center gap-1.5 font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 shadow-sm text-[11px]">
                    <span className="text-[11px]">✔ 已自動儲存</span>
                    <span className="text-slate-500 font-normal text-[11px]">| 最後儲存時間: {lastSavedTime}</span>
                  </div>

                  <div className="flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-lg border border-slate-200 shadow-sm text-[11px]">
                    {user ? (
                      <div className="flex items-center gap-2 text-[11px]">
                        <span className="font-bold text-slate-700 truncate max-w-[120px] text-[11px]" title={user.email || user.displayName}>{user.displayName || user.email}</span>
                        <button 
                          onClick={handleLogout}
                          className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold transition-all text-[11px]"
                        >
                          登出
                        </button>
                      </div>
                    ) : (
                      <button 
                        onClick={handleGoogleLogin}
                        className="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded-lg font-bold transition-all text-[11px] flex items-center gap-1 shadow-sm"
                      >
                        <span className="text-[11px]">Google 雲端同步</span>
                      </button>
                    )}
                    <span className="text-slate-300 text-[11px]">|</span>
                    <span className={`px-2 py-0.5 rounded font-bold text-[11px] ${
                      syncStatus === 'Synced' ? 'bg-emerald-600 text-white' :
                      syncStatus === 'Syncing...' ? 'bg-amber-500 text-white' :
                      syncStatus === 'Sync failed' ? 'bg-rose-600 text-white' :
                      'bg-slate-600 text-slate-200'
                    }`}>
                      {syncStatus}
                    </span>
                  </div>
                </div>
              </div>

              {exportNotice && (
                <div className="bg-rose-50 text-rose-600 px-4 py-2.5 text-center text-[12.7px] font-bold border-b border-rose-200 font-sans">
                  {exportNotice}
                </div>
              )}

              {/* Sales Periods Container */}
              <div className="p-3 sm:p-5 flex flex-col gap-6 bg-slate-50/60 flex-grow font-sans">
                {calculatedData.map((sp, spIndex) => {
                  const rawSp = salesPeriods[spIndex];
                  const isSelectedForExport = !!selectedExportIds[sp.id];

                  return (
                    <div key={sp.id} className="bg-white rounded-2xl shadow-md overflow-hidden flex flex-col font-sans border border-slate-200">
                      
                      {/* Sales Period Header Block */}
                      <div 
                        className="p-4 sm:p-5 flex flex-col gap-3.5 font-sans"
                        style={{ backgroundColor: theme.headerBgColor, color: theme.headerTextColor }}
                      >
                        <div className="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3 font-sans">
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 font-sans w-full lg:w-auto">
                            <div className="flex items-center gap-2 font-sans bg-black/10 px-3 py-1.5 rounded-xl border border-white/10">
                              <span className="text-[12.7px] font-bold flex items-center gap-1 whitespace-nowrap opacity-90 font-sans" style={{ color: theme.headerTextColor }}><Icons.Calendar /> 預購時間：</span>
                              <input 
                                type="text" 
                                value={sp.preorderTime || ''}
                                onChange={(e) => handleSalesPeriodFieldChange(sp.id, 'preorderTime', e.target.value)}
                                className="px-2 py-1 rounded-lg outline-none font-bold text-[12.7px] w-full sm:w-36 text-left font-sans border border-white/20"
                                style={{ backgroundColor: theme.inputBgColor, color: theme.inputTextColor }}
                                placeholder=""
                              />
                            </div>

                            <div className="flex items-center gap-2 font-sans bg-black/10 px-3 py-1.5 rounded-xl border border-white/10">
                              <span className="text-[12.7px] font-bold flex items-center gap-1 whitespace-nowrap opacity-90 font-sans" style={{ color: theme.headerTextColor }}><Icons.Calendar /> 製作時間：</span>
                              <input 
                                type="text"

                                        style={{ color: theme.qtyTextColor }}
                                        placeholder=""
                                      />
                                    </div>
                                    <div>
                                      <label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">單價成本</label>
                                      <input 
                                        type="text" 
                                        inputMode="decimal"
                                        value={pkg.unitCost} 
                                        onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'unitCost', e.target.value)}
                                        className="w-full px-2.5 py-1.5 rounded-lg outline-none font-bold shadow-sm text-left font-sans border border-slate-200 bg-slate-50/50"
                                        style={{ color: theme.inputTextColor }}
                                        placeholder=""
                                      />
                                    </div>
                                  </div>
                                </div>
                              ))}
                            </div>

                          </div>
                        ))}

                      </div>

                      {/* Sales Period Summary Footer */}
                      <div className="p-4 sm:p-5 bg-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 font-bold font-sans border-t border-slate-200 text-[12.7px] sm:text-[14.7px]">
                        <div className="flex items-center gap-2 text-slate-800 font-sans">
                          <span className="font-sans">📦 本場次總銷售額：</span>
                          <span className="text-emerald-600 font-sans text-[14.7px] sm:text-[16.7px] font-extrabold">{formatCurrency(sp.periodTotalSales)}</span>
                        </div>
                        <div className="flex items-center gap-2 font-sans">
                          <span className="text-slate-800 font-sans">最終淨收 (淨利)：</span>
                          <span className="bg-slate-900 text-amber-300 px-4 py-2 rounded-xl font-extrabold shadow-md font-sans border border-slate-700 text-[14.7px] sm:text-[16.7px]">{formatCurrency(sp.periodNetIncome)}</span>
                        </div>
                      </div>

                    </div>
                  );
                })}
              </div>

            </div>
          </div>
        );
      }

      function ColorPickerItem({ label, value, onChange }) {
        return (
          <div className="flex items-center justify-between gap-2 font-sans">
            <span className="text-slate-600 font-semibold font-sans">{label}</span>
            <label className="relative flex items-center gap-2 bg-white px-2.5 py-1 rounded-xl border border-slate-300 shadow-sm cursor-pointer hover:border-slate-400 transition-colors font-sans">
              <span className="w-4 h-4 rounded-lg border border-slate-200 shadow-inner flex-shrink-0" style={{ backgroundColor: value }}></span>
              <span className="text-slate-700 uppercase text-[12.7px] font-mono font-medium">{value}</span>
              <input 
                type="color" 
                value={value} 
                onChange={(e) => onChange(e.target.value)} 
                className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" 
              />
            </label>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<MailOrderCalculator />);
    </script>
</body>
</html>
