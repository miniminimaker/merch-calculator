      import { getFirestore, doc, collection, addDoc, getDocs, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

      const firebaseConfig = typeof __firebase_config !== 'undefined' 
        ? JSON.parse(__firebase_config) 
        : { 
            apiKey: "AIzaSyCG8wVa9CMOON6fmPei5ReMZ_nQkSkCIwo", 
            authDomain: "makermech-d88e1.firebaseapp.com", 
            projectId: "makermech-d88e1", 
            storageBucket: "makermech-d88e1.firebasestorage.app", 
            messagingSenderId: "855508150878", 
            appId: "1:855508150878:web:b9dc6f43201e4801cfe2cf" 
          };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const googleProvider = new GoogleAuthProvider();

      // Global sync function for Google Apps Script Web App
      window.syncToGoogleAppsScript = async (payload) => {
        const currentGasUrl = localStorage.getItem('moc_gasWebappUrl') || '';
        if (!currentGasUrl || !currentGasUrl.trim()) return;
        try {
          const response = await fetch(currentGasUrl.trim(), {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
          });
          
          if (response.ok || response.type === 'opaque') {
            console.log("Google Sheet Synced Successfully");
          } else {
            console.error("Google Sheet Sync Failed", response.statusText);
          }
        } catch (err) {
          console.error("Google Sheet Sync Failed", err);
        }
      };

      window.firebaseService = {
        auth,
        db,
        googleProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged,
        doc,
        collection,
        addDoc,
        getDocs,
        updateDoc,
        setDoc
      };

      window.dispatchEvent(new Event('firebase-ready'));
    </script>

      const formatCurrency = (num) => {
        return new Intl.NumberFormat('zh-TW', { 
          style: 'currency', 
          currency: 'TWD', 
          minimumFractionDigits: 0, 
          maximumFractionDigits: 2 
        }).format(num || 0);
      };

      function MailOrderCalculator() {
        const defaultTheme = {
          headerBgColor: '#69AFB0',          
          headerTextColor: '#FFFFFF',        
          labelTextColor: '#4A5565',         
          inputBgColor: '#FFFFFF',           
          inputTextColor: '#0F172A',         
          
          vendorBadgeBgColor: '#4A81D3',     
          vendorHeaderBgColor: '#CAE6F7',     
          vendorBoxBgColor: '#F8FAFC',        
          taiwanBoxBgColor: '#F0F9FF',       
          taiwanTitleColor: '#0369A1',       
          overseasBoxBgColor: '#FFFBEB',     
          overseasTitleColor: '#B45309',     
          salesTextColor: '#DC2626',         
          qtyTextColor: '#2563EB',           

          packagingBadgeBgColor: '#4C7F29',    
          packagingHeaderBgColor: '#F1F9F3', 
          packagingBoxBgColor: '#F8FAFC'     
        };

        const [exchangeRate, setExchangeRate] = useState('31.5');
        const [showSettings, setShowSettings] = useState(false);
        const [showDataIntegration, setShowDataIntegration] = useState(false);
        const [showGoogleSheets, setShowGoogleSheets] = useState(false);
        const [showCloudVersions, setShowCloudVersions] = useState(false); // 雲端多版本選取面板

        const [googleSheetUrl, setGoogleSheetUrl] = useState(() => localStorage.getItem('moc_googleSheetUrl') || '');
        const [gasWebappUrl, setGasWebappUrl] = useState(() => localStorage.getItem('moc_gasWebappUrl') || '');

        const [selectedExportIds, setSelectedExportIds] = useState({});
        const [exportNotice, setExportNotice] = useState('');
        const [lastSavedTime, setLastSavedTime] = useState(() => new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        
        const [theme, setTheme] = useState(defaultTheme);
        const [salesPeriods, setSalesPeriods] = useState([
          {
            id: 1,
            isLocked: false,
            preorderTime: '',
            productionTime: '',
            vendors: [
              {
                id: 101,
                vendorName: '',
                shippingCost: '',
                items: [
                  {
                    id: 1001,
                    itemTitle: '',
                    productName: '',
                    specs: '',
                    style: '',
                    notes: '',
                    printQty: '',
                    unitCost: '',
                    twdPrice: '',
                    taiwanSalesQty: '',
                    usdPrice: '',
                    overseasSalesQty: ''
                  }
                ]
              }
            ],
            packagings: []
          }
        ]);

        const [user, setUser] = useState(null);
        const [syncStatus, setSyncStatus] = useState('Offline');
        const [cloudVersionsList, setCloudVersionsList] = useState([]);
        const [currentCloudDocId, setCurrentCloudDocId] = useState(null); // 目前正在編輯的雲端文檔 ID
        const isRemoteLoading = useRef(false);

        // 1. Firebase Auth & Initial Cloud Document Fetch
        useEffect(() => {
          const checkFirebaseReady = () => {
            if (window.firebaseService) {
              const { auth, onAuthStateChanged, db, collection, getDocs, doc, setDoc } = window.firebaseService;
              
              onAuthStateChanged(auth, async (currentUser) => {
                setUser(currentUser);
                if (currentUser) {
                  setSyncStatus('Syncing...');
                  try {
                    isRemoteLoading.current = true;
                    // 讀取使用者的多筆雲端存檔集合：/users/{uid}/sheets
                    const sheetsRef = collection(db, 'users', currentUser.uid, 'sheets');
                    const querySnapshot = await getDocs(sheetsRef);
                    
                    let versions = [];
                    querySnapshot.forEach((docSnap) => {
                      versions.push({ id: docSnap.id, ...docSnap.data() });
                    });

                    if (versions.length > 0) {
                      // 依照最後更新時間排序，預設載入最近的一筆
                      versions.sort((a, b) => new Date(b.lastUpdated || 0) - new Date(a.lastUpdated || 0));
                      setCloudVersionsList(versions);
                      
                      // 預設讀取最新的一筆資料
                      const latest = versions[0];
                      setCurrentCloudDocId(latest.id);
                      if (latest.salesPeriods) setSalesPeriods(latest.salesPeriods);
                      if (latest.exchangeRate) setExchangeRate(latest.exchangeRate);
                      if (latest.theme) setTheme(latest.theme);
                      if (latest.googleSheetUrl !== undefined) setGoogleSheetUrl(latest.googleSheetUrl);
                      if (latest.gasWebappUrl !== undefined) setGasWebappUrl(latest.gasWebappUrl);
                    } else {
                      // 若雲端完全沒有資料，建立第一筆預設存檔
                      const defaultPayload = {
                        title: '預設成本試算表',
                        salesPeriods,
                        exchangeRate,
                        theme,
                        googleSheetUrl,
                        gasWebappUrl,
                        lastUpdated: new Date().toISOString()
                      };
                      const newDocRef = await window.firebaseService.addDoc(sheetsRef, defaultPayload);
                      setCurrentCloudDocId(newDocRef.id);
                      setCloudVersionsList([{ id: newDocRef.id, ...defaultPayload }]);
                    }
                    setSyncStatus('Synced');
                  } catch (err) {
                    console.error("Cloud fetch error:", err);
                    setSyncStatus('Sync failed');
                  } finally {
                    isRemoteLoading.current = false;
                  }
                } else {
                  setSyncStatus('Offline');
                }
              });
            }
          };

          if (window.firebaseService) {
            checkFirebaseReady();
          } else {
            window.addEventListener('firebase-ready', checkFirebaseReady);
            return () => window.removeEventListener('firebase-ready', checkFirebaseReady);
          }
        }, []);

        const handleGoogleLogin = async () => {
          if (!window.firebaseService) return;
          const { auth, googleProvider, signInWithPopup } = window.firebaseService;
          try {
            setSyncStatus('Syncing...');
            await signInWithPopup(auth, googleProvider);
          } catch (err) {
            console.error("Login failed:", err);
            setSyncStatus('Sync failed');
          }
        };

        const handleLogout = async () => {
          if (!window.firebaseService) return;
          const { auth, signOut } = window.firebaseService;
          try {
            await signOut(auth);
            setUser(null);
            setSyncStatus('Offline');
            setCloudVersionsList([]);
            setCurrentCloudDocId(null);
          } catch (err) {
            console.error("Logout failed:", err);
          }
        };

        // 2. 建立全新空白雲端試算表存檔
        const handleCreateNewCloudSheet = async () => {
          if (!user || !window.firebaseService) return;
          const { db, collection, addDoc } = window.firebaseService;
          
          const titleName = prompt("請輸入新試算表/場次名稱：", `成本試算表_${new Date().toLocaleDateString()}`);
          if (!titleName) return;

          const freshSalesPeriods = [
            {
              id: Date.now(),
              isLocked: false,
              preorderTime: titleName,
              productionTime: '',
              vendors: [],
              packagings: []
            }
          ];

          const newPayload = {
            title: titleName,
            salesPeriods: freshSalesPeriods,
            exchangeRate: '31.5',
            theme,
            googleSheetUrl,
            gasWebappUrl,
            lastUpdated: new Date().toISOString()
          };

          try {
            setSyncStatus('Syncing...');
            const sheetsRef = collection(db, 'users', user.uid, 'sheets');
            const docRef = await addDoc(sheetsRef, newPayload);
            
            setCurrentCloudDocId(docRef.id);
            setSalesPeriods(freshSalesPeriods);
            setCloudVersionsList(prev => [{ id: docRef.id, ...newPayload }, ...prev]);
            setSyncStatus('Synced');
          } catch (err) {
            console.error("Create new sheet error:", err);
            setSyncStatus('Sync failed');
          }
        };

        // 3. 讀取指定的雲端試算表版本
        const handleSelectCloudVersion = (versionId) => {
          const target = cloudVersionsList.find(v => v.id === versionId);
          if (!target) return;

          isRemoteLoading.current = true;
          setCurrentCloudDocId(target.id);
          if (target.salesPeriods) setSalesPeriods(target.salesPeriods);
          if (target.exchangeRate) setExchangeRate(target.exchangeRate);
          if (target.theme) setTheme(target.theme);
          if (target.googleSheetUrl !== undefined) setGoogleSheetUrl(target.googleSheetUrl);
          if (target.gasWebappUrl !== undefined) setGasWebappUrl(target.gasWebappUrl);

          setTimeout(() => {
            isRemoteLoading.current = false;
          }, 300);
          setShowCloudVersions(false);
          setExportNotice(`已成功載入版本：${target.title || '未命名'}`);
          setTimeout(() => setExportNotice(''), 3000);
        };

        // 4. 自動儲存與同步回目前選擇的雲端文檔
        useEffect(() => {
          localStorage.setItem('moc_googleSheetUrl', googleSheetUrl);
          localStorage.setItem('moc_gasWebappUrl', gasWebappUrl);

          const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setLastSavedTime(timeStr);

          if (isRemoteLoading.current || !user || !currentCloudDocId || !window.firebaseService) return;

          const nowIso = new Date().toISOString();
          const currentVersionObj = cloudVersionsList.find(v => v.id === currentCloudDocId);
          const currentTitle = currentVersionObj ? currentVersionObj.title : '成本試算表';

          const payload = {
            title: currentTitle,
            salesPeriods,
            exchangeRate,
            theme,
            googleSheetUrl,
            gasWebappUrl,
            lastUpdated: nowIso
          };

          const { db, doc, setDoc } = window.firebaseService;
          setSyncStatus('Syncing...');

          // 更新指定的 Firestore 文檔
          const docRef = doc(db, 'users', user.uid, 'sheets', currentCloudDocId);
          setDoc(docRef, payload, { merge: true })
            .then(async () => {
              setSyncStatus('Synced');
              // 同步更新本地端版本清單中的該筆時間與內容
              setCloudVersionsList(prev => prev.map(v => v.id === currentCloudDocId ? { ...v, ...payload } : v));
              
              if (window.syncToGoogleAppsScript) {
                await window.syncToGoogleAppsScript(payload);
              }
            })
            .catch((err) => {
              console.error("Cloud save error:", err);
              setSyncStatus('Sync failed');
            });
        }, [salesPeriods, exchangeRate, theme, googleSheetUrl, gasWebappUrl]);

        // 各項 CRUD 動作
        const handleAddSalesPeriod = () => {
          const newSp = {
            id: Date.now(),
            isLocked: false,
            preorderTime: '',
            productionTime: '',
            vendors: [
              {
                id: Date.now() + 1,
                vendorName: '',
                shippingCost: '',
                items: [
                  {
                    id: Date.now() + 2,
                    itemTitle: '',
                    productName: '',
                    specs: '',
                    style: '',
                    notes: '',
                    printQty: '',
                    unitCost: '',
                    twdPrice: '',
                    taiwanSalesQty: '',
                    usdPrice: '',
                    overseasSalesQty: ''
                  }
                ]
              }
            ],
            packagings: []
          };
          setSalesPeriods([...salesPeriods, newSp]);
        };

        const handleDeleteSalesPeriod = (spId) => {
          setSalesPeriods(salesPeriods.filter(sp => sp.id !== spId));
        };

        const handleToggleLockSalesPeriod = (spId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId ? { ...sp, isLocked: !sp.isLocked } : sp));
        };

        const handleSalesPeriodFieldChange = (spId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              return { ...sp, [field]: value };
            }
            return sp;
          }));
        };

        const handleAddVendor = (spId) => {
          const newVendor = {
            id: Date.now(),
            vendorName: '',
            shippingCost: '',
            items: [
              {
                id: Date.now() + 1,
                itemTitle: '',
                productName: '',
                specs: '',
                style: '',
                notes: '',
                printQty: '',
                unitCost: '',
                twdPrice: '',
                taiwanSalesQty: '',
                usdPrice: '',
                overseasSalesQty: ''
              }
            ]
          };
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              return { ...sp, vendors: [...sp.vendors, newVendor] };
            }
            return sp;
          }));
        };

        const handleDeleteVendor = (spId, vendorId) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              return { ...sp, vendors: sp.vendors.filter(v => v.id !== vendorId) };
            }
            return sp;
          }));
        };

        const handleVendorFieldChange = (spId, vendorId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              if (field === 'shippingCost') {
                if (value === '' || /^\d*\.?\d*$/.test(value)) {
                  const updatedVendors = sp.vendors.map(v => v.id === vendorId ? { ...v, [field]: value } : v);
                  return { ...sp, vendors: updatedVendors };
                }
              } else if (field === 'vendorName') {
                const updatedVendors = sp.vendors.map(v => v.id === vendorId ? { ...v, vendorName: value } : v);
                return { ...sp, vendors: updatedVendors };
              }
            }
            return sp;
          }));
        };

        const handleAddItem = (spId, vendorId) => {
          const newItem = {
            id: Date.now(),
            itemTitle: '',
            productName: '',
            specs: '',
            style: '',
            notes: '',
            printQty: '',
            unitCost: '',
            twdPrice: '',
            taiwanSalesQty: '',
            usdPrice: '',
            overseasSalesQty: ''
          };
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedVendors = sp.vendors.map(v => {
                if (v.id === vendorId) {
                  return { ...v, items: [...v.items, newItem] };
                }
                return v;
              });
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        const handleDeleteItem = (spId, vendorId, itemId) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedVendors = sp.vendors.map(v => {
                if (v.id === vendorId) {
                  return { ...v, items: v.items.filter(item => item.id !== itemId) };
                }
                return v;
              });
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        const handleItemFieldChange = (spId, vendorId, itemId, field, value) => {
          const numericFields = ['printQty', 'unitCost', 'twdPrice', 'taiwanSalesQty', 'usdPrice', 'overseasSalesQty'];
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              if (numericFields.includes(field)) {
                if (value === '' || /^\d*\.?\d*$/.test(value)) {
                  const updatedVendors = sp.vendors.map(v => {
                    if (v.id === vendorId) {
                      const updatedItems = v.items.map(item => item.id === itemId ? { ...item, [field]: value } : item);
                      return { ...v, items: updatedItems };
                    }
                    return v;
                  });
                  return { ...sp, vendors: updatedVendors };
                }
              } else {
                const updatedVendors = sp.vendors.map(v => {
                  if (v.id === vendorId) {
                    const updatedItems = v.items.map(item => item.id === itemId ? { ...item, [field]: value } : item);
                    return { ...v, items: updatedItems };
                  }
                  return v;
                });
                return { ...sp, vendors: updatedVendors };
              }
            }
            return sp;
          }));
        };

        const handleAddPackaging = (spId) => {
          const newPkgVendor = {
            id: Date.now(),
            vendorName: '',
            shippingCost: '',
            items: [
              {
                id: Date.now() + 1,
                packagingTitle: '',
                style: '',
                specs: '',
                notes: '',
                qty: '',
                unitCost: ''
              }
            ]
          };
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const packagings = sp.packagings || [];
              return { ...sp, packagings: [...packagings, newPkgVendor] };
            }
            return sp;
          }));
        };

        const handleDeletePackaging = (spId, pkgVendorId) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const packagings = (sp.packagings || []).filter(p => p.id !== pkgVendorId);
              return { ...sp, packagings };
            }
            return sp;
          }));
        };

        const handlePkgVendorFieldChange = (spId, pkgVendorId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              if (field === 'shippingCost') {
                if (value === '' || /^\d*\.?\d*$/.test(value)) {
                  const updatedPackagings = (sp.packagings || []).map(p => p.id === pkgVendorId ? { ...p, [field]: value } : p);
                  return { ...sp, packagings: updatedPackagings };
                }
              } else if (field === 'vendorName') {
                const updatedPackagings = (sp.packagings || []).map(p => p.id === pkgVendorId ? { ...p, vendorName: value } : p);
                return { ...sp, packagings: updatedPackagings };
              }
            }
            return sp;
          }));
        };

        const handleAddPkgItem = (spId, pkgVendorId) => {
          const newItem = {
            id: Date.now(),
            packagingTitle: '',
            style: '',
            specs: '',
            notes: '',
            qty: '',
            unitCost: ''
          };
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedPackagings = (sp.packagings || []).map(p => {
                if (p.id === pkgVendorId) {
                  return { ...p, items: [...(p.items || []), newItem] };
                }
                return p;
              });
              return { ...sp, packagings: updatedPackagings };
            }
            return sp;
          }));
        };

        const handleDeletePkgItem = (spId, pkgVendorId, pkgItemId) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedPackagings = (sp.packagings || []).map(p => {
                if (p.id === pkgVendorId) {
                  return { ...p, items: (p.items || []).filter(item => item.id !== pkgItemId) };
                }
                return p;
              });
              return { ...sp, packagings: updatedPackagings };
            }
            return sp;
          }));
        };

        const handlePkgItemFieldChange = (spId, pkgVendorId, pkgItemId, field, value) => {
          const numericFields = ['qty', 'unitCost'];
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              if (numericFields.includes(field)) {
                if (value === '' || /^\d*\.?\d*$/.test(value)) {
                  const updatedPackagings = (sp.packagings || []).map(p => {
                    if (p.id === pkgVendorId) {
                      const updatedItems = (p.items || []).map(item => item.id === pkgItemId ? { ...item, [field]: value } : item);
                      return { ...p, items: updatedItems };
                    }
                    return p;
                  });
                  return { ...sp, packagings: updatedPackagings };
                }
              } else {
                const updatedPackagings = (sp.packagings || []).map(p => {
                  if (p.id === pkgVendorId) {
                    const updatedItems = (p.items || []).map(item => item.id === pkgItemId ? { ...item, [field]: value } : item);
                    return { ...p, items: updatedItems };
                  }
                  return p;
                });
                return { ...sp, packagings: updatedPackagings };
              }
            }
            return sp;
          }));
        };

        const handleToggleExportSelection = (spId) => {
          setSelectedExportIds(prev => ({ ...prev, [spId]: !prev[spId] }));
        };

        const handleExportSelectedData = () => {
          const selectedIds = Object.keys(selectedExportIds).filter(id => selectedExportIds[id]);
          if (selectedIds.length === 0) {
            setExportNotice('請至少勾選一個資料區塊進行匯出');
            setTimeout(() => setExportNotice(''), 3000);
            return;
          }

          let csv = '\ufeff';
          csv += '週邊成本試算表 - 勾選區塊匯出\n\n';

          calculatedData.forEach(calcSp => {
            if (selectedIds.includes(String(calcSp.id))) {
              csv += `========================================\n`;
              csv += `預購時間: ${calcSp.preorderTime}, 製作時間: ${calcSp.productionTime}\n`;
              csv += `本場次總銷售額: ${calcSp.periodTotalSales}, 最終淨收: ${calcSp.periodNetIncome}\n`;
              csv += `========================================\n`;
              csv += '【廠商】,廠商名稱,運費,品項名稱,品名,款式,規格,備註,印製數量,成本單價,台幣售價,台灣銷售量,台灣銷售額,美金售價,美金換台幣,海外銷售量,海外銷售額,總銷售數量,總銷售額\n';
              calcSp.vendors.forEach(v => {
                v.items.forEach(item => {
                  csv += `【廠商】,"${v.vendorName}",${v.shippingCost},"${item.itemTitle}","${item.productName}","${item.style}","${item.specs}","${item.notes}",${item.printQty},${item.unitCost},${item.twdPrice},${item.taiwanSalesQty},${item.taiwanRevenue},${item.usdPrice},${item.usdToTwd},${item.overseasSalesQty},${item.overseasRevenue},${item.totalSalesQty},${item.totalSalesAmount}\n`;
                });
              });

              csv += '\n【包材】,廠商名稱,運費,包材品項,款式,規格,備註,數量,單價成本,總成本\n';
              calcSp.packagings.forEach(pv => {
                const itemsList = pv.items || [];
                itemsList.forEach(pkg => {
                  csv += `【包材】,"${pv.vendorName}",${pv.shippingCost},"${pkg.packagingTitle || ''}","${pkg.style || ''}","${pkg.specs || ''}","${pkg.notes || ''}",${pkg.qty || 0},${pkg.unitCost || 0},${pkg.totalCost || 0}\n`;
                });
              });
              csv += '\n\n';
            }
          });

          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', `勾選區塊匯出_成本試算表.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const handleExportJson = () => {
          const data = {
            exchangeRate,
            theme,
            salesPeriods,
            googleSheetUrl,
            gasWebappUrl
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', `週邊成本試算表_備份_${new Date().toISOString().slice(0, 10)}.json`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const handleImportJson = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.salesPeriods && Array.isArray(parsed.salesPeriods)) {
                setSalesPeriods(parsed.salesPeriods);
                if (parsed.exchangeRate !== undefined) setExchangeRate(parsed.exchangeRate);
                if (parsed.theme) setTheme(parsed.theme);
                if (parsed.googleSheetUrl !== undefined) setGoogleSheetUrl(parsed.googleSheetUrl);
                if (parsed.gasWebappUrl !== undefined) setGasWebappUrl(parsed.gasWebappUrl);
                setExportNotice('JSON 匯入成功！');
              } else {
                setExportNotice('JSON 格式錯誤：找不到有效場次資料');
              }
            } catch (err) {
              setExportNotice('JSON 解析失敗，請確認檔案格式是否正確');
            }
            setTimeout(() => setExportNotice(''), 4000);
          };
          reader.readAsText(file);
          e.target.value = '';
        };

        const calculatedData = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;

          return salesPeriods.map(sp => {
            let periodTotalSales = 0;
            let periodTotalCost = 0;

            const calculatedVendors = (sp.vendors || []).map(vendor => {
              const vendorShipping = parseFloat(vendor.shippingCost) || 0;

              const rawItems = (vendor.items || []).map(item => {
                const printQty = parseFloat(item.printQty) || 0;
                const unitCost = parseFloat(item.unitCost) || 0;
                const totalCost = printQty * unitCost;
                return { ...item, printQty, unitCost, totalCost };
              });

              const totalVendorItemsAmount = rawItems.reduce((sum, item) => sum + item.totalCost, 0);
              
              periodTotalCost += totalVendorItemsAmount + vendorShipping;

              const calculatedItems = rawItems.map(item => {
                const printQty = item.printQty;
                const totalCost = item.totalCost;

                let itemShipping = 0;
                if (totalVendorItemsAmount > 0) {
                  itemShipping = vendorShipping * (totalCost / totalVendorItemsAmount);
                } else if (vendor.items.length > 0) {
                  itemShipping = vendorShipping / vendor.items.length;
                }

                const twdPrice = parseFloat(item.twdPrice) || 0;
                const taiwanSalesQty = parseFloat(item.taiwanSalesQty) || 0;
                const taiwanRevenue = twdPrice * taiwanSalesQty;

                const usdPrice = parseFloat(item.usdPrice) || 0;
                const overseasSalesQty = parseFloat(item.overseasSalesQty) || 0;
                const usdToTwd = Math.round(usdPrice * globalRate);
                const overseasRevenue = usdToTwd * overseasSalesQty;

                const totalSalesQty = taiwanSalesQty + overseasSalesQty;
                const totalRevenue = taiwanRevenue + overseasRevenue;
                const profitAndLoss = totalRevenue - totalCost;

                periodTotalSales += totalRevenue;

                return {
                  ...item,
                  shippingCost: itemShipping,
                  taiwanRevenue,
                  usdToTwd,
                  overseasRevenue,
                  totalSalesQty,
                  totalRevenue,
                  profitAndLoss
                };
              });

              return {
                ...vendor,
                items: calculatedItems
              };
            });

            const calculatedPackagings = (sp.packagings || []).map(pkgVendor => {
              const itemsList = pkgVendor.items || [];
              const vendorShipping = parseFloat(pkgVendor.shippingCost) || 0;

              const rawPkgItems = itemsList.map(item => {
                const qty = parseFloat(item.qty) || 0;
                const unitCost = parseFloat(item.unitCost) || 0;
                const totalCost = qty * unitCost;
                return { ...item, qty, unitCost, totalCost };
              });

              const totalPkgItemsAmount = rawPkgItems.reduce((sum, item) => sum + item.totalCost, 0);
              periodTotalCost += totalPkgItemsAmount + vendorShipping;

              const calculatedPkgItems = rawPkgItems.map(item => {
                const qty = item.qty;
                const totalCost = item.totalCost;
                let itemShipping = 0;
                if (totalPkgItemsAmount > 0) {
                  itemShipping = vendorShipping * (totalCost / totalPkgItemsAmount);
                } else if (itemsList.length > 0) {
                  itemShipping = vendorShipping / itemsList.length;
                }
                return {
                  ...item,
                  shippingCost: itemShipping,
                  totalCost
                };
              });

              return {
                ...pkgVendor,
                items: calculatedPkgItems
              };
            });

            const periodNetIncome = periodTotalSales - periodTotalCost;

            return {
              ...sp,
              vendors: calculatedVendors,
              packagings: calculatedPackagings,
              periodTotalSales,
              periodTotalCost,
              periodNetIncome
            };
          });
        }, [salesPeriods, exchangeRate]);

        return (
          <div className="min-h-screen bg-slate-100 p-3 sm:p-6 font-sans text-[12.7px] sm:text-[14.7px]">
            <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col font-sans">
              
              {/* Top Header */}
              <div 
                className="p-4 sm:p-5 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-3 font-sans"
                style={{ backgroundColor: theme.headerBgColor }}
              >
                <div className="flex items-center gap-2.5 font-sans">
                  <div className="p-2 bg-black/20 rounded-xl text-white font-sans shadow-inner">
                    <Icons.Table />
                  </div>
                  <div className="font-sans">
                    <h1 className="text-[16.7px] sm:text-[18.7px] font-bold tracking-tight font-sans" style={{ color: theme.headerTextColor }}>週邊成本試算表</h1>
                    <p className="text-[12.7px] text-white/80 font-normal">多場次與海外通販財務試算工具 (支援多雲端版本切換)</p>
                  </div>
                </div>

                <div className="flex items-center gap-2 flex-wrap font-sans w-full md:w-auto justify-end">
                  <button 
                    onClick={() => { setShowCloudVersions(!showCloudVersions); if(!showCloudVersions) { setShowSettings(false); setShowDataIntegration(false); setShowGoogleSheets(false); } }}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12.7px] font-semibold transition-all font-sans border border-white/20 shadow-sm ${showCloudVersions ? 'bg-black/40 text-white' : 'bg-black/15 text-white hover:bg-black/25'}`}
                  >
                    <Icons.Cloud /> 雲端版本選擇
                  </button>

                  <button 
                    onClick={() => { setShowGoogleSheets(!showGoogleSheets); if(!showGoogleSheets) { setShowSettings(false); setShowDataIntegration(false); setShowCloudVersions(false); } }}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12.7px] font-semibold transition-all font-sans border border-white/20 shadow-sm ${showGoogleSheets ? 'bg-black/40 text-white' : 'bg-black/15 text-white hover:bg-black/25'}`}
                  >
                    <Icons.FileSpreadsheet /> 雲端試算表
                  </button>

                  <button 
                    onClick={() => { setShowDataIntegration(!showDataIntegration); if(!showDataIntegration) { setShowSettings(false); setShowGoogleSheets(false); setShowCloudVersions(false); } }}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12.7px] font-semibold transition-all font-sans border border-white/20 shadow-sm ${showDataIntegration ? 'bg-black/40 text-white' : 'bg-black/15 text-white hover:bg-black/25'}`}
                  >
                    <Icons.Database /> 資料整合
                  </button>

                  <button 
                    onClick={handleAddSalesPeriod}
                    className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2 rounded-xl text-[12.7px] font-bold transition-all shadow-md font-sans border border-slate-700"
                  >
                    <Icons.Plus /> 新增場次
                  </button>
                </div>
              </div>

              {/* Cloud Versions Selection Panel */}
              {showCloudVersions && (
                <div className="p-4 sm:p-5 bg-slate-50 border-b border-slate-200 flex flex-col gap-4 animate-fade-in text-[12.7px] font-sans">
                  <div className="flex justify-between items-center border-b border-slate-200 pb-3 font-sans">
                    <h3 className="font-bold text-slate-800 text-[14.7px] flex items-center gap-2 font-sans">☁️ 選擇要讀取與修改的雲端存檔版本</h3>
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={handleCreateNewCloudSheet}
                        className="text-[12.7px] bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl font-bold transition-colors font-sans flex items-center gap-1"
                      >
                        <Icons.Plus /> 建立新雲端版本
                      </button>
                      <button 
                        onClick={() => setShowCloudVersions(false)}
                        className="text-[12.7px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-semibold transition-colors font-sans"
                      >
                        關閉面板
                      </button>
                    </div>
                  </div>

                  <p className="text-slate-600 text-[12px]">
                    您可以點選下方不同的雲端存檔版本來載入、修改資料。修改後的內容將**自動同步並覆寫**回您目前選取的雲端版本中。
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[300px] overflow-y-auto pr-1">
                    {cloudVersionsList.map((ver) => {
                      const isSelected = ver.id === currentCloudDocId;
                      return (
                        <div 
                          key={ver.id}
                          onClick={() => handleSelectCloudVersion(ver.id)}
                          className={`p-3.5 rounded-xl border cursor-pointer transition-all flex flex-col justify-between gap-2 shadow-sm ${
                            isSelected 
                              ? 'bg-sky-50 border-sky-400 ring-2 ring-sky-300' 
                              : 'bg-white border-slate-200 hover:bg-slate-50 hover:border-slate-300'
                          }`}
                        >
                          <div className="flex justify-between items-start">
                            <span className="font-bold text-[14.7px] text-slate-800 truncate" title={ver.title}>
                              {ver.title || '未命名成本試算表'}
                            </span>
                            {isSelected && (
                              <span className="bg-sky-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">
                                目前載入中
                              </span>
                            )}
                          </div>
                          <div className="text-[11px] text-slate-500 flex justify-between items-center pt-1 border-t border-slate-100">
                            <span>最後更新: {new Date(ver.lastUpdated || Date.now()).toLocaleString('zh-TW')}</span>
                            <span className="font-semibold text-slate-700">場次數: {(ver.salesPeriods || []).length}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Categorized Color Settings Panel */}
              {showSettings && (
                <div className="p-4 sm:p-5 bg-slate-50 border-b border-slate-200 flex flex-col gap-5 animate-fade-in text-[12.7px] font-sans">
                  <div className="flex justify-between items-center border-b border-slate-200 pb-3 font-sans">
                    <h3 className="font-bold text-slate-800 text-[14.7px] flex items-center gap-2 font-sans">🎨 外觀色彩配置面板</h3>
                    <button 
                      onClick={() => setTheme(defaultTheme)}
                      className="text-[12.7px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-semibold transition-colors font-sans"
                    >
                      恢復預設顏色
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 font-sans">
                    <div className="bg-white p-3.5 rounded-xl shadow-sm flex flex-col gap-2.5 font-sans border border-slate-200">
                      <h4 className="font-bold text-slate-700 uppercase bg-slate-100 p-2 rounded-lg font-sans text-[12.7px]">1. 表頭與全域</h4>
                      <ColorPickerItem label="區塊表頭" value={theme.headerBgColor} onChange={(v)=>setTheme({...theme, headerBgColor:v})} />
                      <ColorPickerItem label="表頭文字" value={theme.headerTextColor} onChange={(v)=>setTheme({...theme, headerTextColor:v})} />
                      <ColorPickerItem label="欄位標籤" value={theme.labelTextColor} onChange={(v)=>setTheme({...theme, labelTextColor:v})} />
                      <ColorPickerItem label="輸入欄背景" value={theme.inputBgColor} onChange={(v)=>setTheme({...theme, inputBgColor:v})} />
                      <ColorPickerItem label="輸入文字" value={theme.inputTextColor} onChange={(v)=>setTheme({...theme, inputTextColor:v})} />
                    </div>

                    <div className="bg-white p-3.5 rounded-xl shadow-sm flex flex-col gap-2.5 font-sans border border-slate-200">
                      <h4 className="font-bold text-slate-700 uppercase bg-slate-100 p-2 rounded-lg font-sans text-[12.7px]">2. 廠商與銷售區塊</h4>
                      <ColorPickerItem label="【廠商】標籤" value={theme.vendorBadgeBgColor} onChange={(v)=>setTheme({...theme, vendorBadgeBgColor:v})} />
                      <ColorPickerItem label="廠商表頭底色" value={theme.vendorHeaderBgColor} onChange={(v)=>setTheme({...theme, vendorHeaderBgColor:v})} />
                      <ColorPickerItem label="廠商區塊底色" value={theme.vendorBoxBgColor} onChange={(v)=>setTheme({...theme, vendorBoxBgColor:v})} />
                      <ColorPickerItem label="🇹🇼 台灣區塊" value={theme.taiwanBoxBgColor} onChange={(v)=>setTheme({...theme, taiwanBoxBgColor:v})} />
                      <ColorPickerItem label="🇹🇼 台灣標題" value={theme.taiwanTitleColor} onChange={(v)=>setTheme({...theme, taiwanTitleColor:v})} />
                      <ColorPickerItem label="🌍 海外區塊" value={theme.overseasBoxBgColor} onChange={(v)=>setTheme({...theme, overseasBoxBgColor:v})} />

                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                      <label className="block font-bold mb-1 text-slate-700 text-[11.7px]">成本單價</label>
                                      <input 
                                        type="text" 
                                        inputMode="decimal"
                                        value={item.unitCost} 
                                        disabled={sp.isLocked}
                                        onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'unitCost', e.target.value)}
                                        className="w-full px-2.5 py-1.5 rounded-lg outline-none font-bold shadow-sm text-left font-sans border border-slate-200 bg-white disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                        style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                        placeholder=""
                                      />
                                    </div>
                                  </div>

                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 font-sans pt-1">
                                    
                                    <div 
                                      className="p-3 rounded-xl flex flex-col gap-2.5 font-sans border border-sky-100 shadow-sm"
                                      style={{ backgroundColor: theme.taiwanBoxBgColor }}
                                    >
                                      <span className="font-bold text-[12.7px] font-sans flex items-center gap-1" style={{ color: theme.taiwanTitleColor }}>🇹🇼 台灣販售</span>
                                      <div className="grid grid-cols-3 gap-2 font-sans">
                                        <div>
                                          <label className="block font-medium mb-1 text-[10.7px]" style={{ color: theme.labelTextColor }}>售價(TWD)</label>
                                          <input 
                                            type="text" 
                                            inputMode="decimal"
                                            value={item.twdPrice} 
                                            disabled={sp.isLocked}
                                            onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'twdPrice', e.target.value)}
                                            className="w-full px-2 py-1.5 rounded-lg outline-none font-bold text-[12.7px] shadow-sm text-left font-sans border border-sky-200 bg-white disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                            style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                            placeholder=""
                                          />
                                        </div>
                                        <div>
                                          <label className="block font-medium mb-1 text-[10.7px]" style={{ color: theme.labelTextColor }}>銷售量</label>
                                          <input 
                                            type="text" 
                                            inputMode="decimal"
                                            value={item.taiwanSalesQty} 
                                            disabled={sp.isLocked}
                                            onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'taiwanSalesQty', e.target.value)}
                                            className="w-full px-2 py-1.5 rounded-lg outline-none font-bold text-[12.7px] shadow-sm text-left font-sans border border-sky-200 bg-white disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                            style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                            placeholder=""
                                          />
                                        </div>
                                        <div>
                                          <label className="block font-medium mb-1 text-[10.7px]" style={{ color: theme.salesTextColor }}>銷售額</label>
                                          <div 
                                            className="w-full px-2 py-1.5 rounded-lg text-left font-bold text-[12.7px] shadow-sm bg-white border border-sky-200 truncate" 
                                            style={{ color: theme.salesTextColor }}
                                          >
                                            {formatCurrency(item.taiwanRevenue)}
                                          </div>
                                        </div>
                                      </div>
                                    </div>

                                    <div 
                                      className="p-3 rounded-xl flex flex-col gap-2.5 font-sans border border-amber-100 shadow-sm"
                                      style={{ backgroundColor: theme.overseasBoxBgColor }}
                                    >
                                      <div className="flex justify-between items-center gap-1">
                                        <span className="font-bold text-[12.7px] font-sans" style={{ color: theme.overseasTitleColor }}>🌍 海外販售</span>
                                        <div className="flex items-center gap-1 text-[11.7px]">
                                          <span className="text-slate-600 font-medium">匯率:</span>
                                          <input 
                                            type="text" 
                                            inputMode="decimal"
                                            value={exchangeRate} 
                                            disabled={sp.isLocked}
                                            onChange={(e) => setExchangeRate(e.target.value)} 
                                            className="w-12 bg-white text-slate-900 font-bold text-center rounded px-1 py-0.5 outline-none font-sans border border-amber-200 shadow-sm text-[11.7px] disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed" 
                                          />
                                        </div>
                                      </div>

                                      <div className="grid grid-cols-4 gap-1.5 font-sans">
                                        <div>
                                          <label className="block font-medium mb-1 text-[10.7px]" style={{ color: theme.labelTextColor }}>售價(USD)</label>
                                          <input 
                                            type="text" 
                                            inputMode="decimal"
                                            value={item.usdPrice} 
                                            disabled={sp.isLocked}
                                            onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'usdPrice', e.target.value)}
                                            className="w-full px-1.5 py-1.5 rounded-lg outline-none font-bold text-[12.7px] shadow-sm text-left font-sans border border-amber-200 bg-white disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                            style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                            placeholder=""
                                          />
                                        </div>
                                        <div>
                                          <label className="block font-medium mb-1 text-[10.7px]" style={{ color: theme.labelTextColor }}>折合台幣</label>
                                          <div className="w-full px-1.5 py-1.5 rounded-lg text-left font-bold text-[12.7px] shadow-sm bg-white border border-amber-200 truncate" style={{ color: theme.inputTextColor }}>
                                            {formatCurrency(item.usdToTwd)}
                                          </div>
                                        </div>
                                        <div>
                                          <label className="block font-medium mb-1 text-[10.7px]" style={{ color: theme.labelTextColor }}>銷售量</label>
                                          <input 
                                            type="text" 
                                            inputMode="decimal"
                                            value={item.overseasSalesQty} 
                                            disabled={sp.isLocked}
                                            onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'overseasSalesQty', e.target.value)}
                                            className="w-full px-1.5 py-1.5 rounded-lg outline-none font-bold text-[12.7px] shadow-sm text-left font-sans border border-amber-200 bg-white disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                            style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                            placeholder=""
                                          />
                                        </div>
                                        <div>
                                          <label className="block font-medium mb-1 text-[10.7px]" style={{ color: theme.salesTextColor }}>銷售額</label>
                                          <div className="w-full px-1.5 py-1.5 rounded-lg text-left font-bold text-[12.7px] shadow-sm bg-white border border-amber-200 truncate" style={{ color: theme.salesTextColor }}>
                                            {formatCurrency(item.overseasRevenue)}
                                          </div>
                                        </div>
                                      </div>
                                    </div>

                                  </div>

                                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-2.5 pt-2 border-t border-slate-100 text-[12.7px] font-sans">
                                    <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 shadow-sm">
                                      <span className="font-semibold text-slate-600">總銷售數量：</span>
                                      <span className="font-bold text-[14.7px]" style={{ color: theme.qtyTextColor }}>{item.totalSalesQty}</span>
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 shadow-sm">
                                      <span className="font-semibold text-slate-600">總收入：</span>
                                      <span className="font-bold text-[14.7px]" style={{ color: theme.salesTextColor }}>{formatCurrency(item.totalRevenue)}</span>
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 shadow-sm">
                                      <span className="font-semibold text-slate-600">總成本：</span>
                                      <span className="font-bold text-[14.7px]" style={{ color: theme.inputTextColor }}>{formatCurrency(item.totalCost)}</span>
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 shadow-sm">
                                      <span className="font-semibold text-slate-600">損益：</span>
                                      <span className="font-bold text-[14.7px]">
                                        {item.profitAndLoss < 0 ? (
                                          <span className="text-red-600">-{formatCurrency(Math.abs(item.profitAndLoss))}</span>
                                        ) : item.profitAndLoss === 0 ? (
                                          <span className="text-emerald-600">{formatCurrency(0)}</span>
                                        ) : (
                                          <span className="text-emerald-600">+{formatCurrency(item.profitAndLoss)}</span>
                                        )}
                                      </span>
                                    </div>

                                  </div>

                                </div>
                              ))}
                            </div>

                          </div>
                        ))}

                        {/* 2. Packaging Materials Section */}
                        {(sp.packagings || []).map((pkgVendor) => (
                          <div 
                            key={pkgVendor.id} 
                            className="rounded-2xl shadow-sm overflow-hidden flex flex-col font-sans border border-slate-200"
                            style={{ backgroundColor: theme.packagingBoxBgColor }}
                          >
                            
                            <div 
                              className="px-4 py-3 m-3 mb-0 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 font-sans shadow-sm border border-slate-200/60"
                              style={{ backgroundColor: theme.packagingHeaderBgColor }}
                            >
                              <div className="flex items-center gap-3 flex-wrap w-full sm:w-auto font-sans">
                                <span className="text-white px-3 py-1 rounded-lg text-[12.7px] font-bold tracking-wider shadow-sm font-sans" style={{ backgroundColor: theme.packagingBadgeBgColor }}>【包材】</span>
                                <div className="flex items-center gap-1.5 font-sans">
                                  <span className="font-bold whitespace-nowrap font-sans" style={{ color: theme.labelTextColor }}>廠商:</span>
                                  <input 
                                    type="text" 
                                    value={pkgVendor.vendorName}
                                    disabled={sp.isLocked}
                                    onChange={(e) => handlePkgVendorFieldChange(sp.id, pkgVendor.id, 'vendorName', e.target.value)}
                                    className="px-2.5 py-1 rounded-lg outline-none font-bold text-[12.7px] w-36 text-left font-sans border border-slate-300 disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                    style={{ backgroundColor: sp.isLocked ? undefined : theme.inputBgColor, color: sp.isLocked ? undefined : theme.inputTextColor }}
                                    placeholder=""
                                  />
                                </div>

                                <div className="flex items-center gap-1.5 font-sans">
                                  <span className="font-bold whitespace-nowrap font-sans" style={{ color: theme.labelTextColor }}>運費:</span>
                                  <input 
                                    type="text" 
                                    inputMode="decimal"
                                    value={pkgVendor.shippingCost}
                                    disabled={sp.isLocked}
                                    onChange={(e) => handlePkgVendorFieldChange(sp.id, pkgVendor.id, 'shippingCost', e.target.value)}
                                    className="px-2.5 py-1 rounded-lg outline-none font-bold text-[12.7px] w-24 text-left font-sans border border-slate-300 disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                    style={{ backgroundColor: sp.isLocked ? undefined : theme.inputBgColor, color: sp.isLocked ? undefined : theme.inputTextColor }}
                                    placeholder=""
                                  />
                                </div>
                              </div>

                              <div className="flex items-center gap-2 flex-wrap font-sans">
                                <button 
                                  onClick={() => handleAddPkgItem(sp.id, pkgVendor.id)}
                                  disabled={sp.isLocked}
                                  className="bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-1.5 rounded-xl transition-colors flex items-center gap-1 font-bold text-[12.7px] shadow-sm font-sans border border-slate-700 disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                  <Icons.Plus /> 新增品項
                                </button>
                                <button 
                                  onClick={() => handleDeletePackaging(sp.id, pkgVendor.id)}
                                  disabled={sp.isLocked}
                                  className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl transition-colors flex items-center gap-1 font-bold text-[12.7px] font-sans border border-slate-300 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                  <Icons.Trash /> 刪除包材
                                </button>
                              </div>
                            </div>

                            <div className="p-3 sm:p-4 flex flex-col gap-3.5 font-sans">
                              {(pkgVendor.items || []).map((pkg) => (
                                <div key={pkg.id} className="bg-white rounded-xl shadow-sm p-4 flex flex-col gap-3 font-sans border border-slate-200 relative">
                                  <div className="flex justify-between items-center gap-3 font-sans border-b border-slate-100 pb-2.5">
                                    <div className="flex items-center gap-2 flex-grow font-sans">
                                      <span className="text-[12.7px] font-bold bg-slate-100 px-2 py-0.5 rounded text-slate-600">品項</span>
                                      <input 
                                        type="text"
                                        value={pkg.packagingTitle}
                                        disabled={sp.isLocked}
                                        onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'packagingTitle', e.target.value)}
                                        className="rounded-lg px-2.5 py-1 font-bold text-[12.7px] sm:text-[14.7px] w-full sm:w-56 outline-none text-left font-sans border border-slate-200 bg-slate-50 focus:bg-white disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                        style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                        placeholder=""
                                      />
                                    </div>
                                    <button 
                                      onClick={() => handleDeletePkgItem(sp.id, pkgVendor.id, pkg.id)}
                                      disabled={sp.isLocked}
                                      className="text-slate-400 hover:text-red-600 p-1 rounded-lg transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
                                      title="刪除此品項"
                                    >
                                      <Icons.Trash />
                                    </button>
                                  </div>

                                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-2.5 font-sans">
                                    <div>
                                      <label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">款式</label>
                                      <input 
                                        type="text" 
                                        value={pkg.style} 
                                        disabled={sp.isLocked}
                                        onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'style', e.target.value)}
                                        className="w-full px-2.5 py-1.5 rounded-lg outline-none font-medium shadow-sm text-left font-sans border border-slate-200 bg-slate-50/50 disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                        style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                        placeholder=""
                                      />
                                    </div>
                                    <div>
                                      <label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">規格</label>
                                      <input 
                                        type="text" 
                                        value={pkg.specs} 
                                        disabled={sp.isLocked}
                                        onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'specs', e.target.value)}
                                        className="w-full px-2.5 py-1.5 rounded-lg outline-none font-medium shadow-sm text-left font-sans border border-slate-200 bg-slate-50/50 disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                        style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                        placeholder=""
                                      />
                                    </div>
                                    <div>
                                      <label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">數量</label>
                                      <input 
                                        type="text" 
                                        inputMode="decimal"
                                        value={pkg.qty} 
                                        disabled={sp.isLocked}
                                        onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'qty', e.target.value)}
                                        className="w-full px-2.5 py-1.5 rounded-lg outline-none font-bold shadow-sm text-left font-sans border border-slate-200 bg-slate-50/50 disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                        style={{ color: sp.isLocked ? undefined : theme.qtyTextColor }}
                                        placeholder=""
                                      />
                                    </div>
                                    <div>
                                      <label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">單價成本</label>
                                      <input 
                                        type="text" 
                                        inputMode="decimal"
                                        value={pkg.unitCost} 
                                        disabled={sp.isLocked}
                                        onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'unitCost', e.target.value)}
                                        className="w-full px-2.5 py-1.5 rounded-lg outline-none font-bold shadow-sm text-left font-sans border border-slate-200 bg-slate-50/50 disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed"
                                        style={{ color: sp.isLocked ? undefined : theme.inputTextColor }}
                                        placeholder=""
                                      />
                                    </div>
                                  </div>
                                </div>
                              ))}
                            </div>

                          </div>
                        ))}

                      </div>

                      {/* Sales Period Summary Footer */}
                      <div className="p-4 sm:p-5 bg-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 font-bold font-sans border-t border-slate-200 text-[12.7px] sm:text-[14.7px]">
                        <div className="flex items-center gap-2 text-slate-800 font-sans">
                          <span className="font-sans">📦 本場次總銷售額：</span>
                          <span className="text-emerald-600 font-sans text-[14.7px] sm:text-[16.7px] font-extrabold">{formatCurrency(sp.periodTotalSales)}</span>
                        </div>
                        <div className="flex items-center gap-2 font-sans">
                          <span className="text-slate-800 font-sans">最終淨收 (淨利)：</span>
                          <span className="bg-slate-900 text-amber-300 px-4 py-2 rounded-xl font-extrabold shadow-md font-sans border border-slate-700 text-[14.7px] sm:text-[16.7px]">{formatCurrency(sp.periodNetIncome)}</span>
                        </div>
                      </div>

                    </div>
                  );
                })}
              </div>

            </div>
          </div>
        );
      }

      function ColorPickerItem({ label, value, onChange }) {
        return (
          <div className="flex items-center justify-between gap-2 font-sans">
            <span className="text-slate-600 font-semibold font-sans">{label}</span>
            <label className="relative flex items-center gap-2 bg-white px-2.5 py-1 rounded-xl border border-slate-300 shadow-sm cursor-pointer hover:border-slate-400 transition-colors font-sans">
              <span className="w-4 h-4 rounded-lg border border-slate-200 shadow-inner flex-shrink-0" style={{ backgroundColor: value }}></span>
              <span className="text-slate-700 uppercase text-[12.7px] font-mono font-medium">{value}</span>
              <input 
                type="color" 
                value={value} 
                onChange={(e) => onChange(e.target.value)} 
                className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" 
              />
            </label>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<MailOrderCalculator />);
    </script>
</body>
</html>
