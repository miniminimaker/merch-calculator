      import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

      const firebaseConfig = typeof __firebase_config !== 'undefined' 
        ? JSON.parse(__firebase_config) 
        : { 
            apiKey: "AIzaSyCG8wVa9CMOON6fmPei5ReMZ_nQkSkCIwo", 
            authDomain: "makermech-d88e1.firebaseapp.com", 
            projectId: "makermech-d88e1", 
            storageBucket: "makermech-d88e1.firebasestorage.app", 
            messagingSenderId: "855508150878", 
            appId: "1:855508150878:web:b9dc6f43201e4801cfe2cf" 
          };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const googleProvider = new GoogleAuthProvider();

      window.syncToGoogleAppsScript = async (payload, customGasUrl) => {
        const currentGasUrl = customGasUrl || localStorage.getItem('moc_gasWebappUrl') || '';
        if (!currentGasUrl || !currentGasUrl.trim()) return;
        try {
          const response = await fetch(currentGasUrl.trim(), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          if (response.ok || response.type === 'opaque') {
            console.log("Google Sheet Action Success");
          } else {
            console.error("Google Sheet Action Failed", response.statusText);
          }
        } catch (err) {
          console.error("Google Sheet Action Failed", err);
        }
      };

      window.fetchGoogleSheetVersions = async (customGasUrl) => {
        const currentGasUrl = customGasUrl || localStorage.getItem('moc_gasWebappUrl') || '';
        if (!currentGasUrl || !currentGasUrl.trim()) throw new Error("請先填寫 Google Apps Script 網址");
        
        try {
          const response = await fetch(currentGasUrl.trim());
          const result = await response.json();
          if (result.status === "success") {
            return result.versions || [];
          } else {
            throw new Error(result.message || "讀取失敗");
          }
        } catch (err) {
          console.error("Fetch Google Sheet Versions Failed", err);
          throw err;
        }
      };

      window.firebaseService = { auth, db, googleProvider, signInWithPopup, signOut, onAuthStateChanged, doc, getDoc, setDoc };
      window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

        Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,

      const formatCurrency = (num) => {
        return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(num || 0);
      };

      const sanitizeOrders = (rawOrders) => {
        if (!Array.isArray(rawOrders)) return [];
        return rawOrders.map(o => {
          let formattedItems = [];
          if (Array.isArray(o.items)) {
            formattedItems = o.items.map((it, idx) => {
              let uPrice = it.unitPrice !== undefined ? it.unitPrice : '';
              if (uPrice === '' && it.amount !== undefined && it.quantity) {
                const amt = parseFloat(it.amount) || 0;
                const qty = parseFloat(it.quantity) || 1;
                if (qty > 0) uPrice = (amt / qty).toString();
              }
              return {
                id: it.id || 'item_' + Date.now() + '_' + idx,
                productName: it.productName || it.itemTitle || '',
                style: it.style || '',
                quantity: it.quantity || '',
                unitPrice: uPrice
              };
            });
          } else {
            formattedItems = [{ id: 'item_' + Date.now(), productName: '', style: '', quantity: '', unitPrice: '' }];
          }

          const legacyHasUSD = parseFloat(o.paymentUSD) > 0;

          return {
            id: o.id || 'order_' + Date.now() + Math.random(),
            orderType: o.orderType || (legacyHasUSD ? 'USD' : 'TWD'),
            orderNumber: o.orderNumber || '', // 加入訂單編號
            orderDate: o.orderDate || new Date().toISOString().split('T')[0],
            shippingDate: o.shippingDate || '',
            shipped: !!o.shipped,
            nickname: o.nickname || '',
            email: o.email || '',
            items: formattedItems,
            paymentUSD: o.paymentUSD !== undefined ? o.paymentUSD : '',
            preShippingFee: o.preShippingFee !== undefined ? o.preShippingFee : '',
            shippingFee: o.shippingFee !== undefined ? o.shippingFee : '',
            recipient: o.recipient || '',
            phone: o.phone || '',
            country: o.country || '',
            region: o.region || '',
            zipCode: o.zipCode || '', // 新增郵遞區號
            address: o.address || '',
            notes: o.notes || ''
          };
        });
      };

      const migrateLegacyData = (periods) => {
        if (!Array.isArray(periods)) return [];
        return periods.map(sp => {
          const newVendors = (sp.vendors || []).map(vendor => {
            const newItems = (vendor.items || []).map(item => {
              if (item.variants && Array.isArray(item.variants)) return item;
              return {
                id: item.id,
                itemTitle: item.itemTitle || '',
                productName: item.productName || '',
                style: item.style || '',
                notes: item.notes || '',
                unitCost: item.unitCost || '',
                otherFeeLabel: item.otherFeeLabel || '',
                otherFee: item.otherFee || '',
                twdPrice: item.twdPrice || '',
                usdPrice: item.usdPrice || '',
                excludeFromTotal: !!item.excludeFromTotal,
                variants: [
                  {
                    id: 'var_' + Date.now() + Math.random(),
                    specName: item.specs || '預設規格',
                    printQty: item.printQty || '',
                    taiwanSalesQty: item.taiwanSalesQty || '',
                    overseasSalesQty: item.overseasSalesQty || ''
                  }
                ]
              };
            });
            return { ...vendor, items: newItems };
          });
          return { ...sp, vendors: newVendors };
        });
      };

      function MailOrderCalculator() {
        const defaultTheme = {
          headerBgColor: '#69AFB0', headerTextColor: '#FFFFFF', labelTextColor: '#4A5565', inputBgColor: '#FFFFFF', inputTextColor: '#0F172A',
          vendorBadgeBgColor: '#4A81D3', vendorHeaderBgColor: '#CAE6F7', vendorBoxBgColor: '#F8FAFC', taiwanBoxBgColor: '#F0F9FF', taiwanTitleColor: '#0369A1',
          overseasBoxBgColor: '#FFFBEB', overseasTitleColor: '#B45309', salesTextColor: '#DC2626', qtyTextColor: '#2563EB',
          packagingBadgeBgColor: '#4C7F29', packagingHeaderBgColor: '#F1F9F3', packagingBoxBgColor: '#F8FAFC'
        };

        const [activeTab, setActiveTab] = useState('orders');
        const [exchangeRate, setExchangeRate] = useState('31.5');
        const [showGoogleSheets, setShowGoogleSheets] = useState(false);
        const [gasWebappUrl, setGasWebappUrl] = useState('');
        const [exportNotice, setExportNotice] = useState('');
        const [theme, setTheme] = useState(defaultTheme);
        const [salesPeriods, setSalesPeriods] = useState([
          { 
            id: 1, isLocked: false, preorderTime: '', productionTime: '', 
            vendors: [{ 
              id: 101, vendorName: '', shippingCost: '', 
              items: [{ 
                id: 1001, itemTitle: '', productName: '', style: '', notes: '', 
                unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', usdPrice: '', excludeFromTotal: false,
                variants: [{ id: 'v1', specName: '預設規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }]
              }] 
            }], 
            packagings: [] 
          }
        ]);

        const [orders, setOrders] = useState([]);
        const [orderSearchQuery, setOrderSearchQuery] = useState('');
        const [orderStatusFilter, setOrderStatusFilter] = useState('all');
        const [editingOrderId, setEditingOrderId] = useState(null);
        
        const generateDefaultDraft = () => ({
          orderNumber: '',
          orderDate: new Date().toISOString().split('T')[0], 
          shippingDate: '', 
          shipped: false, 
          nickname: '',
          email: '',
          items: [{ id: 'item_' + Date.now() + Math.random(), productName: '', style: '', quantity: '', unitPrice: '' }],
          preShippingFee: '', 
          paymentUSD: '', 
          shippingFee: '', 
          recipient: '', 
          phone: '', 
          country: '', 
          region: '', 
          zipCode: '', // 新增郵遞區號
          address: '', 
          notes: ''
        });

        const [orderForm, setOrderForm] = useState({
          activeType: 'TWD',
          TWD: generateDefaultDraft(),
          USD: generateDefaultDraft()
        });

        const [currentDocId, setCurrentDocId] = useState('sheet_' + Date.now());
        const [currentDocTitle, setCurrentDocTitle] = useState('預設成本試算表');
        const [sheetVersions, setSheetVersions] = useState([]);
        const [isLoadingSheet, setIsLoadingSheet] = useState(false);

        const [user, setUser] = useState(null);
        const [syncStatus, setSyncStatus] = useState('Offline');
        const isRemoteLoading = useRef(false);

        const [modalState, setModalState] = useState({ type: null, title: '', message: '', onConfirm: null, onCancel: null, inputPlaceholder: '', inputValue: '' });
        const showAlert = (msg, title="提示") => setModalState({ type: 'alert', title, message: msg, onConfirm: () => setModalState({type: null}) });
        const showConfirm = (msg, onConfirm, title="確認") => setModalState({ type: 'confirm', title, message: msg, onConfirm: () => { onConfirm(); setModalState({type: null}); }, onCancel: () => setModalState({type: null}) });
        const showPrompt = (msg, defaultVal, onConfirm, title="輸入") => setModalState({ type: 'prompt', title, message: msg, inputValue: defaultVal, onConfirm: (val) => { onConfirm(val); setModalState({type: null}); }, onCancel: () => setModalState({type: null}) });

        useEffect(() => {
          const checkFirebaseReady = () => {
            if (window.firebaseService) {
              const { auth, onAuthStateChanged, db, doc, getDoc } = window.firebaseService;
              onAuthStateChanged(auth, async (currentUser) => {
                setUser(currentUser);
                if (currentUser) {
                  setSyncStatus('Syncing...');
                  isRemoteLoading.current = true;
                  try {
                    const userDocRef = doc(db, 'users', currentUser.uid);
                    const docSnap = await getDoc(userDocRef);
                    if (docSnap.exists()) {
                      const cloudData = docSnap.data();
                      if (cloudData.gasWebappUrl) {
                        setGasWebappUrl(cloudData.gasWebappUrl);
                        localStorage.setItem('moc_gasWebappUrl', cloudData.gasWebappUrl);
                      }
                      if (cloudData.salesPeriods) setSalesPeriods(migrateLegacyData(cloudData.salesPeriods));
                      if (cloudData.exchangeRate) setExchangeRate(cloudData.exchangeRate);
                      if (cloudData.currentDocId) setCurrentDocId(cloudData.currentDocId);
                      if (cloudData.currentDocTitle) setCurrentDocTitle(cloudData.currentDocTitle);
                      if (cloudData.orders) setOrders(sanitizeOrders(cloudData.orders));
                    }
                    setSyncStatus('Synced');
                  } catch (err) {
                    console.error("Cloud config load failed", err);
                    setSyncStatus('Sync failed');
                  } finally {
                    setTimeout(() => { isRemoteLoading.current = false; }, 1000);
                  }
                } else {
                  setSyncStatus('Offline');
                }
              });
            }
          };
          if (window.firebaseService) checkFirebaseReady();
          else window.addEventListener('firebase-ready', checkFirebaseReady);
          return () => window.removeEventListener('firebase-ready', checkFirebaseReady);
        }, []);

        // 新增：自動存檔至雲端機制
        useEffect(() => {
          if (!user || !window.firebaseService || isRemoteLoading.current) return;
          
          const { db, doc, setDoc } = window.firebaseService;
          const autoSaveTimer = setTimeout(async () => {
            try {
              setSyncStatus('Syncing...');
              await setDoc(doc(db, 'users', user.uid), {
                currentDocId,
                currentDocTitle,
                salesPeriods,
                exchangeRate,
                orders,
                lastAutoSaved: new Date().toISOString()
              }, { merge: true });
              setSyncStatus('Synced');
            } catch (err) {
              console.error("Auto-save failed", err);
              setSyncStatus('Sync failed');
            }
          }, 1500); // 停止動作 1.5 秒後自動儲存

          return () => clearTimeout(autoSaveTimer);
        }, [salesPeriods, exchangeRate, orders, currentDocId, currentDocTitle, user]);

        const handleGoogleLogin = async () => {
          if (!window.firebaseService) return;
          const { auth, googleProvider, signInWithPopup } = window.firebaseService;
          try {
            setSyncStatus('Syncing...');
            await signInWithPopup(auth, googleProvider);
          } catch (err) {
            console.error("Login failed:", err);
            setSyncStatus('Sync failed');
          }
        };

        const handleLogout = async () => {
          if (!window.firebaseService) return;
          const { auth, signOut } = window.firebaseService;
          try {
            await signOut(auth);
            setUser(null);
            setSyncStatus('Offline');
          } catch (err) { console.error(err); }
        };

        const handleGasUrlChange = async (newUrl) => {
          setGasWebappUrl(newUrl);
          localStorage.setItem('moc_gasWebappUrl', newUrl);
          if (user && window.firebaseService) {
            const { db, doc, setDoc } = window.firebaseService;
            try { await setDoc(doc(db, 'users', user.uid), { gasWebappUrl: newUrl }, { merge: true }); } 
            catch (err) { console.error("Failed to save GAS URL to cloud", err); }
          }
        };

        const handleLoadGoogleSheetVersions = async () => {
          if (!gasWebappUrl) {
            showAlert("請先填寫 Google Apps Script 網址！");
            setShowGoogleSheets(true);
            return;
          }
          try {
            setIsLoadingSheet(true);
            setSyncStatus('Syncing...');
            const versions = await window.fetchGoogleSheetVersions(gasWebappUrl);
            setSheetVersions(versions);
            setSyncStatus('Synced');
            if (versions.length === 0) showAlert("Google 試算表中尚無任何存檔清單。");
          } catch (err) {
            showAlert("讀取失敗：" + err.message);
            setSyncStatus('Sync failed');
          } finally {
            setIsLoadingSheet(false);
          }
        };

        const handleSelectSheetVersion = (ver) => {
          if (!user) { showAlert("請先登入 Google 帳號才能讀取雲端試算表！"); return; }
          showConfirm(`確定要從 Google 試算表讀取版本「${ver.title}」嗎？目前的未儲存資料將被覆蓋。`, () => {
              isRemoteLoading.current = true;
              setCurrentDocId(ver.id);
              setCurrentDocTitle(ver.title);
              if (ver.payload) {
                if (ver.payload.salesPeriods) setSalesPeriods(migrateLegacyData(ver.payload.salesPeriods));
                if (ver.payload.exchangeRate) setExchangeRate(ver.payload.exchangeRate);
                if (ver.payload.theme) setTheme(ver.payload.theme);
                if (ver.payload.orders) setOrders(sanitizeOrders(ver.payload.orders));
              }
              setTimeout(() => { isRemoteLoading.current = false; }, 1000);
              setExportNotice(`已成功從 Google 試算表讀取：${ver.title}`);
              setTimeout(() => setExportNotice(''), 4000);
          });
        };

        const handleDeleteCloudVersion = async (ver) => {
          if (!user) { showAlert("請先登入 Google 帳號！"); return; }
          showConfirm(`確定要從 Google 試算表中永久刪除版本「${ver.title}」嗎？此動作無法復原。`, async () => {
              try {
                setSyncStatus('Syncing...');
                await window.syncToGoogleAppsScript({ action: 'delete', docId: ver.id }, gasWebappUrl);
                setSyncStatus('Synced');
                setExportNotice(`已成功從 Google 試算表中刪除：${ver.title}`);
                setTimeout(() => setExportNotice(''), 4000);
                handleLoadGoogleSheetVersions();
              } catch (err) {
                showAlert("刪除失敗：" + err.message);
                setSyncStatus('Sync failed');
              }
          });
        };

        const handleManualSyncToCloud = async () => {
          if (!user) { showAlert("請先登入 Google 帳號才能覆蓋儲存至雲端試算表！"); return; }
          if (!gasWebappUrl) { showAlert("請先填寫 Google Apps Script 網址！"); setShowGoogleSheets(true); return; }

          const payload = {
            docId: currentDocId, title: currentDocTitle, salesPeriods, exchangeRate, theme, orders, lastUpdated: new Date().toISOString()
          };

          try {
            setSyncStatus('Syncing...');
            await window.syncToGoogleAppsScript(payload, gasWebappUrl);
            const { db, doc, setDoc } = window.firebaseService;
            await setDoc(doc(db, 'users', user.uid), { currentDocId, currentDocTitle, salesPeriods, exchangeRate, orders }, { merge: true });
            setSyncStatus('Synced');
            setExportNotice(`已成功覆蓋儲存至 Google 試算表中的「${currentDocTitle}」！`);
            setTimeout(() => setExportNotice(''), 4000);
            handleLoadGoogleSheetVersions();
          } catch (err) {
            showAlert("覆蓋儲存失敗：" + err.message);
            setSyncStatus('Sync failed');
          }
        };

        const handleCreateNewSheetVersion = () => {
          if (!user) { showAlert("請先登入 Google 帳號！"); return; }
          showPrompt("請輸入新試算表/標題名稱：", `成本試算表_${new Date().toLocaleDateString()}`, (newTitle) => {
              if (!newTitle) return;
              const newId = 'sheet_' + Date.now();
              setCurrentDocId(newId);
              setCurrentDocTitle(newTitle);
              setSalesPeriods([{ id: Date.now(), isLocked: false, preorderTime: newTitle, productionTime: '', vendors: [], packagings: [] }]);
              setExportNotice(`已建立新表單：${newTitle}，點擊「覆蓋儲存到此雲端試算表」即可寫入 Google 試算表`);
              setTimeout(() => setExportNotice(''), 4000);
          });
        };

        const handleAddSalesPeriod = () => {
          const newSp = {
            id: Date.now(), isLocked: false, preorderTime: '', productionTime: '',
            vendors: [{ id: Date.now() + 1, vendorName: '', shippingCost: '', items: [{ id: Date.now() + 2, itemTitle: '', productName: '', style: '', notes: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', usdPrice: '', excludeFromTotal: false, variants: [{ id: 'v1', specName: '預設規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }] }] }],
            packagings: []
          };
          setSalesPeriods([...salesPeriods, newSp]);
        };

        const handleDeleteSalesPeriod = (spId) => { setSalesPeriods(salesPeriods.filter(sp => sp.id !== spId)); };
        const handleToggleLockSalesPeriod = (spId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId ? { ...sp, isLocked: !sp.isLocked } : sp)); };
        const handleSalesPeriodFieldChange = (spId, field, value) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, [field]: value } : sp)); };
        
        const handleAddVendor = (spId) => {
          const newVendor = { id: Date.now(), vendorName: '', shippingCost: '', items: [{ id: Date.now() + 1, itemTitle: '', productName: '', style: '', notes: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', usdPrice: '', excludeFromTotal: false, variants: [{ id: 'v1', specName: '預設規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }] }] };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: [...sp.vendors, newVendor] } : sp));
        };
        const handleDeleteVendor = (spId, vendorId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.filter(v => v.id !== vendorId) } : sp)); };
        const handleVendorFieldChange = (spId, vendorId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, [field]: value } : v) } : sp));
        };

        const handleAddItem = (spId, vendorId) => {
          const newItem = { id: Date.now(), itemTitle: '', productName: '', style: '', notes: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', usdPrice: '', excludeFromTotal: false, variants: [{ id: 'v1', specName: '預設規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }] };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: [...v.items, newItem] } : v) } : sp));
        };
        const handleDeleteItem = (spId, vendorId, itemId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.filter(i => i.id !== itemId) } : v) } : sp));
        };
        const handleItemFieldChange = (spId, vendorId, itemId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.map(i => i.id === itemId ? { ...i, [field]: value } : i) } : v) } : sp));
        };
        const handleMoveItem = (spId, vendorId, itemId, direction) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedVendors = sp.vendors.map(v => {
                if (v.id === vendorId) {
                  const items = [...v.items];
                  const index = items.findIndex(i => i.id === itemId);
                  if (index === -1) return v;
                  const targetIndex = direction === 'up' ? index - 1 : index + 1;
                  if (targetIndex < 0 || targetIndex >= items.length) return v;
                  const [movedItem] = items.splice(index, 1);
                  items.splice(targetIndex, 0, movedItem);
                  return { ...v, items };
                }
                return v;
              });
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        const handleAddVariant = (spId, vendorId, itemId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.map(i => i.id === itemId ? { ...i, variants: [...(i.variants || []), { id: 'var_' + Date.now(), specName: '新規格', printQty: '', taiwanSalesQty: '', overseasSalesQty: '' }] } : i) } : v) } : sp));
        };
        const handleDeleteVariant = (spId, vendorId, itemId, varId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.map(i => i.id === itemId ? { ...i, variants: i.variants.filter(va => va.id !== varId) } : i) } : v) } : sp));
        };
        const handleVariantFieldChange = (spId, vendorId, itemId, varId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.map(i => i.id === itemId ? { ...i, variants: i.variants.map(va => va.id === varId ? { ...va, [field]: value } : va) } : i) } : v) } : sp));
        };

        const handleAddPackaging = (spId) => {
          const newPkg = { id: Date.now(), vendorName: '', shippingCost: '', items: [{ id: Date.now() + 1, packagingTitle: '', style: '', specs: '', notes: '', qty: '', unitCost: '', otherFeeLabel: '', otherFee: '', excludeFromTotal: false }] };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: [...(sp.packagings || []), newPkg] } : sp));
        };
        const handleDeletePackaging = (spId, pkgId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.filter(p => p.id !== pkgId) } : sp)); };
        const handlePkgVendorFieldChange = (spId, pkgId, field, value) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, [field]: value } : p) } : sp)); };
        const handleAddPkgItem = (spId, pkgId) => {
          const newItem = { id: Date.now(), packagingTitle: '', style: '', specs: '', notes: '', qty: '', unitCost: '', otherFeeLabel: '', otherFee: '', excludeFromTotal: false };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, items: [...(p.items || []), newItem] } : p) } : sp));
        };
        const handleDeletePkgItem = (spId, pkgId, itemId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, items: p.items.filter(i => i.id !== itemId) } : p) } : sp)); };
        const handlePkgItemFieldChange = (spId, pkgId, itemId, field, value) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, items: p.items.map(i => i.id === itemId ? { ...i, [field]: value } : i) } : p) } : sp)); };
        const handleMovePkgItem = (spId, pkgId, itemId, direction) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedPkgs = sp.packagings.map(p => {
                if (p.id === pkgId) {
                  const items = [...p.items];
                  const index = items.findIndex(i => i.id === itemId);
                  if (index === -1) return p;
                  const targetIndex = direction === 'up' ? index - 1 : index + 1;
                  if (targetIndex < 0 || targetIndex >= items.length) return p;
                  const [movedItem] = items.splice(index, 1);
                  items.splice(targetIndex, 0, movedItem);
                  return { ...p, items };
                }
                return p;
              });
              return { ...sp, packagings: updatedPkgs };
            }
            return sp;
          }));
        };

        const handleOrderFormChange = (field, value) => {
          if (field === 'activeType') {
             setOrderForm(prev => ({ ...prev, activeType: value }));
             return;
          }
          setOrderForm(prev => {
            const activeDraft = { ...prev[prev.activeType], [field]: value };
            if (field === 'shipped' && value === true && !activeDraft.shippingDate) {
              activeDraft.shippingDate = new Date().toISOString().split('T')[0];
            }
            return { ...prev, [prev.activeType]: activeDraft };
          });
        };

        const handleAddOrderItem = () => { 
          setOrderForm(prev => {
            const activeDraft = prev[prev.activeType];
            const newItem = { id: 'item_' + Date.now() + Math.random(), productName: '', style: '', quantity: '', unitPrice: '' };
            return { ...prev, [prev.activeType]: { ...activeDraft, items: [...activeDraft.items, newItem] } };
          }); 
        };

        const handleDeleteOrderItem = (itemId) => { 
          setOrderForm(prev => { 
            const activeDraft = prev[prev.activeType];
            if (activeDraft.items.length <= 1) { showAlert("每筆訂單至少須包含一個購買品項！"); return prev; } 
            return { ...prev, [prev.activeType]: { ...activeDraft, items: activeDraft.items.filter(it => it.id !== itemId) } };
          }); 
        };

        const handleOrderItemChange = (itemId, field, value) => { 
          setOrderForm(prev => {
            const activeDraft = prev[prev.activeType];
            return { ...prev, [prev.activeType]: { ...activeDraft, items: activeDraft.items.map(it => it.id === itemId ? { ...it, [field]: value } : it) } };
          }); 
        };
        
        const handleSaveOrder = (e) => {
          e.preventDefault();
          const activeDraft = orderForm[orderForm.activeType];

          if (!activeDraft.nickname && !activeDraft.recipient && activeDraft.items.every(it => !it.productName.trim())) { 
            showAlert("請至少填寫買家暱稱、收件人或其中一個購買品項！"); 
            return; 
          }

          const orderToSave = {
            ...activeDraft,
            orderType: orderForm.activeType,
            id: editingOrderId || 'order_' + Date.now()
          };

          if (editingOrderId) {
            setOrders(orders.map(o => o.id === editingOrderId ? orderToSave : o));
            setEditingOrderId(null);
            setExportNotice("已成功更新訂單！");
          } else {
            setOrders([orderToSave, ...orders]);
            setExportNotice("已成功新增訂單！");
          }
          setTimeout(() => setExportNotice(''), 3000);
          
          setOrderForm({
            activeType: 'TWD',
            TWD: generateDefaultDraft(),
            USD: generateDefaultDraft()
          });
        };

        const handleEditOrder = (order) => {
          setEditingOrderId(order.id);
          const isUSD = order.orderType === 'USD' || parseFloat(order.paymentUSD) > 0;
          const type = isUSD ? 'USD' : 'TWD';

          let parsedItems = Array.isArray(order.items) && order.items.length > 0 ? order.items.map((it, idx) => {
            let uPrice = it.unitPrice !== undefined ? it.unitPrice : '';
            if (uPrice === '' && it.amount !== undefined && it.quantity) { const amt = parseFloat(it.amount) || 0; const qty = parseFloat(it.quantity) || 1; if (qty > 0) uPrice = (amt / qty).toString(); }
            return { id: it.id || 'item_' + Date.now() + '_' + idx, productName: it.productName || it.itemTitle || '', style: it.style || '', quantity: it.quantity || '', unitPrice: uPrice };
          }) : [{ id: 'item_' + Date.now(), productName: '', style: '', quantity: '', unitPrice: '' }];
          
          const editedDraft = {
            orderNumber: order.orderNumber || '', 
            orderDate: order.orderDate || new Date().toISOString().split('T')[0], 
            shippingDate: order.shippingDate || '', 
            shipped: !!order.shipped, 
            nickname: order.nickname || '',
            email: order.email || '',
            items: parsedItems,
            preShippingFee: order.preShippingFee !== undefined ? order.preShippingFee : '',
            paymentUSD: order.paymentUSD !== undefined ? order.paymentUSD : '', 
            shippingFee: order.shippingFee !== undefined ? order.shippingFee : '',
            recipient: order.recipient || '', 
            phone: order.phone || '', 
            country: order.country || '', 
            region: order.region || '', 
            zipCode: order.zipCode || '', // 新增郵遞區號
            address: order.address || '', 
            notes: order.notes || ''
          };

          setOrderForm({
            activeType: type,
            TWD: type === 'TWD' ? editedDraft : generateDefaultDraft(),
            USD: type === 'USD' ? editedDraft : generateDefaultDraft()
          });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const handleCancelEditOrder = () => {
          setEditingOrderId(null);
          setOrderForm({
            activeType: 'TWD',
            TWD: generateDefaultDraft(),
            USD: generateDefaultDraft()
          });
        };

        const handleDeleteOrder = (orderId) => { 
          showConfirm("確定要刪除這筆訂單嗎？", () => {
            setOrders(orders.filter(o => o.id !== orderId)); 
            setExportNotice("已刪除該筆訂單"); 
            setTimeout(() => setExportNotice(''), 3000); 
          });
        };

        const currentFormTotals = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;
          const type = orderForm.activeType;
          const draft = orderForm[type];
          
          let itemsTotal = (draft.items || []).reduce((sum, item) => sum + ((parseFloat(item.quantity) || 0) * (parseFloat(item.unitPrice) || 0)), 0);

          const preShipping = parseFloat(draft.preShippingFee) || 0;
          const hasActualShipping = draft.shippingFee !== undefined && draft.shippingFee !== '';
          const actualShipping = parseFloat(draft.shippingFee) || 0;
          
          let totalUSD = 0;
          let usdConverted = 0;
          let preShippingTWD = 0;
          let shippingBalance = 0;
          let totalPayment = 0;

          if (type === 'USD') {
              totalUSD = itemsTotal + preShipping;
              usdConverted = Math.round(totalUSD * globalRate);
              preShippingTWD = Math.round(preShipping * globalRate);

              if (hasActualShipping) {
                  shippingBalance = preShippingTWD - actualShipping;
              }
              totalPayment = totalUSD; 
          } else {
              preShippingTWD = preShipping;

              if (hasActualShipping) {
                  shippingBalance = preShippingTWD - actualShipping; 
              }
              totalPayment = itemsTotal + preShippingTWD;
          }

          const legacyUSD = parseFloat(draft.paymentUSD) || 0;
          if (legacyUSD > 0 && type !== 'USD') {
             usdConverted += Math.round(legacyUSD * globalRate);
             totalPayment += Math.round(legacyUSD * globalRate);
          }
          
          return { 
              itemsTotal, 
              totalUSD, 
              usdConverted, 
              preShippingTWD,
              hasActualShipping,
              actualShipping,
              shippingBalance,
              totalPayment,
              legacyUSD
          };
        }, [orderForm, exchangeRate]);

        const orderStats = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;
          let sumProductTWD = 0, sumProductUSD = 0, sumGrandTotal = 0;
          
          orders.forEach(o => {
            const type = o.orderType || (parseFloat(o.paymentUSD) > 0 ? 'USD' : 'TWD');
            const itemsSum = (o.items || []).reduce((acc, it) => acc + ((parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0)), 0);
            
            const preSVal = parseFloat(o.preShippingFee) || 0;
            const hasActualShipping = o.shippingFee !== undefined && o.shippingFee !== '';
            const actualSVal = parseFloat(o.shippingFee) || 0;
            
            let orderGrandTotalTWD = 0;

            if (type === 'USD') {
                sumProductUSD += itemsSum;
                const totalUSD = itemsSum + preSVal;
                const converted = Math.round(totalUSD * globalRate);
                orderGrandTotalTWD = converted;
            } else {
                sumProductTWD += itemsSum;
                orderGrandTotalTWD = itemsSum + preSVal;
            }

            const oldUsd = parseFloat(o.paymentUSD) || 0;
            if (oldUsd > 0 && type !== 'USD') {
                sumProductUSD += oldUsd;
                orderGrandTotalTWD += Math.round(oldUsd * globalRate);
            }

            sumGrandTotal += orderGrandTotalTWD;
          });
          
          return { 
              totalOrdersCount: orders.length, 
              unshippedCount: orders.filter(o => !o.shipped).length, 
              shippedCount: orders.filter(o => o.shipped).length, 
              sumProductTWD, 
              sumProductUSD, 
              sumGrandTotal 
          };
        }, [orders, exchangeRate]);

        const filteredOrders = useMemo(() => {
          return orders.filter(o => {
            if (orderStatusFilter === 'unshipped' && o.shipped) return false;
            if (orderStatusFilter === 'shipped' && !o.shipped) return false;
            if (orderSearchQuery.trim()) {
              const q = orderSearchQuery.toLowerCase();
              return (o.orderNumber || '').toLowerCase().includes(q) || (o.nickname || '').toLowerCase().includes(q) || (o.recipient || '').toLowerCase().includes(q) || (o.phone || '').toLowerCase().includes(q) || (o.email || '').toLowerCase().includes(q) || (Array.isArray(o.items) && o.items.some(item => (item.productName || '').toLowerCase().includes(q)));
            }
            return true;
          });
        }, [orders, orderStatusFilter, orderSearchQuery]);

        const calculatedData = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;
          return salesPeriods.map(sp => {
            let periodTotalSales = 0;
            let periodTotalCost = 0;

            const calculatedVendors = (sp.vendors || []).map(vendor => {
              const vendorShipping = parseFloat(vendor.shippingCost) || 0;
              const rawItems = (vendor.items || []).map(item => {
                let itemTotalPrintQty = 0;
                (item.variants || []).forEach(v => {
                  itemTotalPrintQty += parseFloat(v.printQty) || 0;
                });
                const unitCost = parseFloat(item.unitCost) || 0;
                const otherFee = parseFloat(item.otherFee) || 0;
                const totalCost = (itemTotalPrintQty * unitCost) + otherFee;
                return { ...item, itemTotalPrintQty, totalCost };
              });

              const activeVendorItems = rawItems.filter(item => !item.excludeFromTotal);
              const totalVendorItemsAmount = activeVendorItems.reduce((sum, item) => sum + item.totalCost, 0);

              let allocatedShippingSum = 0;
              const calculatedItems = rawItems.map((item, index) => {
                let itemShipping = 0;
                if (!item.excludeFromTotal) {
                  if (index === rawItems.length - 1) {
                    itemShipping = vendorShipping - allocatedShippingSum;
                  } else if (totalVendorItemsAmount > 0) {
                    itemShipping = Math.round(vendorShipping * (item.totalCost / totalVendorItemsAmount));
                    allocatedShippingSum += itemShipping;
                  } else if (activeVendorItems.length > 0) {
                    itemShipping = Math.round(vendorShipping / activeVendorItems.length);
                    allocatedShippingSum += itemShipping;
                  }
                }

                const finalItemCost = item.totalCost + itemShipping;

                let itemTotalPrintQty = 0;
                let itemTotalTaiwanSalesQty = 0;
                let itemTotalOverseasSalesQty = 0;
                
                const calculatedVariants = (item.variants || []).map(variant => {
                  const printQty = parseFloat(variant.printQty) || 0;
                  const taiwanSalesQty = parseFloat(variant.taiwanSalesQty) || 0;
                  const overseasSalesQty = parseFloat(variant.overseasSalesQty) || 0;
                  itemTotalPrintQty += printQty;
                  itemTotalTaiwanSalesQty += taiwanSalesQty;
                  itemTotalOverseasSalesQty += overseasSalesQty;
                  return { ...variant, printQty, taiwanSalesQty, overseasSalesQty };
                });

                const twdPrice = parseFloat(item.twdPrice) || 0;
                const usdPrice = parseFloat(item.usdPrice) || 0;
                const usdToTwdPrice = Math.round(usdPrice * globalRate);

                const itemTaiwanRevenue = itemTotalTaiwanSalesQty * twdPrice;
                const itemOverseasRevenue = itemTotalOverseasSalesQty * usdToTwdPrice;
                const itemTotalRevenue = itemTaiwanRevenue + itemOverseasRevenue;
                
                const itemProfitAndLoss = itemTotalRevenue - finalItemCost;
                const itemTotalSalesQty = itemTotalTaiwanSalesQty + itemTotalOverseasSalesQty;

                if (!item.excludeFromTotal) {
                  periodTotalSales += itemTotalRevenue;
                  periodTotalCost += finalItemCost;
                }

                return { 
                  ...item, 
                  variants: calculatedVariants,
                  itemTotalPrintQty, 
                  itemTotalSalesQty, 
                  itemTotalCost: finalItemCost,
                  itemShipping,
                  itemTotalRevenue, 
                  itemProfitAndLoss,
                  usdToTwdPrice
                };
              });

              return { ...vendor, items: calculatedItems };
            });

            const calculatedPackagings = (sp.packagings || []).map(pkgVendor => {
              const vendorShipping = parseFloat(pkgVendor.shippingCost) || 0;
              const rawPkgItems = (pkgVendor.items || []).map(item => {
                const qty = parseFloat(item.qty) || 0;
                const unitCost = parseFloat(item.unitCost) || 0;
                const otherFee = parseFloat(item.otherFee) || 0;
                const totalCost = (qty * unitCost) + otherFee;
                return { ...item, qty, unitCost, otherFee, totalCost };
              });

              const activePkgItems = rawPkgItems.filter(item => !item.excludeFromTotal);
              const totalPkgItemsAmount = activePkgItems.reduce((sum, item) => sum + item.totalCost, 0);

              let allocatedPkgShippingSum = 0;
              const calculatedPkgItems = rawPkgItems.map((item, index) => {
                let itemShipping = 0;
                if (!item.excludeFromTotal) {
                  if (index === rawPkgItems.length - 1) {
                    itemShipping = vendorShipping - allocatedPkgShippingSum;
                  } else if (totalPkgItemsAmount > 0) {
                    itemShipping = Math.round(vendorShipping * (item.totalCost / totalPkgItemsAmount));
                    allocatedPkgShippingSum += itemShipping;
                  } else if (activePkgItems.length > 0) {
                    itemShipping = Math.round(vendorShipping / activePkgItems.length);
                    allocatedPkgShippingSum += itemShipping;
                  }
                }
                const finalPkgCost = item.totalCost + itemShipping;
                if (!item.excludeFromTotal) {
                  periodTotalCost += finalPkgCost;
                }
                return { ...item, totalCost: finalPkgCost };
              });

              return { ...pkgVendor, items: calculatedPkgItems };
            });

            const periodNetIncome = periodTotalSales - periodTotalCost;
            return { ...sp, vendors: calculatedVendors, packagings: calculatedPackagings, periodTotalSales, periodTotalCost, periodNetIncome };
          });
        }, [salesPeriods, exchangeRate]);

        const activeDraft = orderForm[orderForm.activeType];

        return (
          <div className="min-h-screen bg-slate-100 p-3 sm:p-6 font-sans text-[12.7px] sm:text-[14.7px]">
            {/* Modal Layer */}
            {modalState.type && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm overflow-hidden flex flex-col">
                        <div className="px-5 py-4 border-b border-slate-100 flex items-center gap-2">
                            <span className="font-bold text-slate-800 text-[15px]">{modalState.title}</span>
                        </div>
                        <div className="p-5 flex flex-col gap-4">
                            <p className="text-[13.7px] text-slate-600 font-medium">{modalState.message}</p>
                            {modalState.type === 'prompt' && (
                                <input type="text" autoFocus value={modalState.inputValue} onChange={(e) => setModalState({...modalState, inputValue: e.target.value})} className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-[13.7px]" />
                            )}
                        </div>
                        <div className="px-5 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-2">
                            {(modalState.type === 'confirm' || modalState.type === 'prompt') && (
                                <button onClick={modalState.onCancel} className="px-4 py-2 rounded-xl font-bold text-[13px] text-slate-600 hover:bg-slate-200 transition-colors">取消</button>
                            )}
                            <button onClick={() => modalState.onConfirm(modalState.inputValue)} className="px-4 py-2 rounded-xl font-bold text-[13px] bg-slate-900 text-white hover:bg-slate-800 transition-colors">確定</button>
                        </div>
                    </div>

                                const totalUSD = itemsSum + preSVal; // 預收為 USD
                                uCond = Math.round(totalUSD * globalRate);
                                preShippingTWD = Math.round(preSVal * globalRate);

                                if (hasActualShipping) {
                                    shippingBalance = preShippingTWD - actualSVal;
                                }
                                grandTotal = uCond;
                            } else {
                                preShippingTWD = preSVal;
                                if (hasActualShipping) {
                                    shippingBalance = preShippingTWD - actualSVal;
                                }
                                grandTotal = itemsSum + preShippingTWD;
                            }

                            const oldUsd = parseFloat(order.paymentUSD) || 0;
                            if (oldUsd > 0 && order.orderType !== 'USD') {
                                uVal += oldUsd;
                                uCond += Math.round(oldUsd * globalRate);
                                grandTotal += Math.round(oldUsd * globalRate);
                            }

                            return (
                              <div key={order.id} className="bg-slate-50/80 rounded-xl p-4 border border-slate-200 flex flex-col gap-3 shadow-sm">
                                <div className="flex justify-between items-start border-b border-slate-200 pb-2">
                                  <div>
                                    <div className="flex items-center gap-2 flex-wrap">
                                      <span className="font-extrabold text-[14.7px] text-slate-900">{order.nickname || '無暱稱'}</span>
                                      {order.orderNumber && <span className="text-slate-500 text-[12px] font-mono">#{order.orderNumber}</span>}
                                      {order.orderType === 'USD' 
                                        ? <span className="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded text-[10px] font-bold">USD</span>
                                        : <span className="bg-sky-100 text-sky-700 px-1.5 py-0.5 rounded text-[10px] font-bold">TWD</span>
                                      }
                                    </div>
                                    <span className="text-slate-400 text-[11px] block mt-0.5">{order.orderDate}</span>
                                  </div>
                                  {order.shipped ? <span className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-[11px] font-bold">已出貨</span> : <span className="bg-white border border-slate-300 text-slate-500 px-2 py-0.5 rounded-full text-[11px] font-bold">未出貨</span>}
                                </div>
                                <div className="flex flex-col gap-1 text-[13px]">
                                  <span className="text-slate-500 font-semibold text-[11px]">購買品項：</span>
                                  <div className="bg-white p-2.5 rounded-xl border border-slate-200 flex flex-col gap-1.5">
                                    {Array.isArray(order.items) && order.items.map((it, idx) => {
                                      const subtotal = (parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0);
                                      const symbol = order.orderType === 'USD' ? 'US$' : '';
                                      const displayName = it.productName || '(未命名)';
                                      const styleSuffix = it.style ? ` - ${it.style}` : '';
                                      return (
                                        <div key={idx} className="font-bold text-slate-800 flex justify-between items-center text-[12px] border-b border-slate-50 last:border-0 pb-1 last:pb-0">
                                          <span>• {displayName}{styleSuffix} <span className="text-slate-400 ml-1 font-normal">({it.quantity || 1} × {symbol}{it.unitPrice})</span></span>
                                          <span className="text-red-600">{order.orderType === 'USD' ? `US$ ${subtotal.toLocaleString()}` : formatCurrency(subtotal)}</span>
                                        </div>
                                      )
                                    })}
                                  </div>
                                </div>
                                <div className="flex flex-col gap-1 text-[13px] bg-white p-3 rounded-xl border border-slate-200 shadow-inner">
                                  <span className="text-slate-500 font-semibold text-[11px] mb-1">付款總額明細：</span>
                                  {order.orderType === 'USD' ? (
                                    <>
                                      <div className="flex justify-between items-center"><span>商品總額 (USD)</span><span className="font-bold text-amber-700">US${uVal.toLocaleString()}</span></div>
                                      {preSVal > 0 && <div className="flex justify-between items-center"><span>預收運費 (USD)</span><span className="font-bold text-indigo-700">US${preSVal.toLocaleString()}</span></div>}
                                      <div className="flex justify-between items-center text-[11px] text-slate-500 mt-0.5"><span>折合台幣 (TWD)</span><span>{formatCurrency(uCond)}</span></div>
                                    </>
                                  ) : (
                                    <>
                                      <div className="flex justify-between items-center"><span>商品總額 (TWD)</span><span className="font-bold text-sky-700">{formatCurrency(itemsSum)}</span></div>
                                      {preSVal !== 0 && <div className="flex justify-between items-center mt-1"><span>預收運費 (TWD)</span><span className="font-bold text-indigo-700">{formatCurrency(preSVal)}</span></div>}
                                    </>
                                  )}
                                  
                                  {hasActualShipping && (
                                    <>
                                      <div className="flex justify-between items-center mt-1"><span>實際運費 (TWD)</span><span className="font-bold text-slate-700">{formatCurrency(actualSVal)}</span></div>
                                      <div className="flex justify-between items-center mt-1 text-[11.5px] bg-slate-50 px-2 py-1 rounded">
                                        <span className="text-slate-600 font-bold">運費差額</span>
                                        <span className={`font-bold ${shippingBalance < 0 ? 'text-red-700' : 'text-emerald-700'}`}>
                                          {shippingBalance < 0 ? '-' : ''}{formatCurrency(Math.abs(shippingBalance))}
                                        </span>
                                      </div>
                                    </>
                                  )}
                                  <div className="border-t border-slate-100 pt-2 mt-1.5 font-extrabold text-slate-900 flex justify-between items-center text-[15px]"><span>付款總額</span><span className="text-slate-900 bg-slate-200 px-2 py-0.5 rounded-lg">{formatCurrency(grandTotal)}</span></div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-[12px] bg-slate-100 p-2.5 rounded-lg">
                                  <div><span className="text-slate-500 block mb-0.5">收件人</span><span className="font-bold text-slate-800">{order.recipient || '-'}</span><div className="text-[10.5px] text-slate-500 mt-0.5">{order.phone || '-'}</div>{order.email && <div className="text-[10.5px] text-slate-500 mt-0.5 truncate">{order.email}</div>}</div>
                                  <div><span className="text-slate-500 block mb-0.5">出貨日期</span><span className="font-bold text-slate-800">{order.shippingDate || '未設定'}</span></div>
                                </div>
                                {(order.country || order.region || order.zipCode || order.address) && (
                                  <div className="text-[11.5px] bg-white p-2.5 rounded-lg border border-slate-200 flex flex-col gap-1">
                                    {(order.country || order.region || order.zipCode) && <div className="text-slate-700">🌍 {order.country} {order.zipCode} {order.region}</div>}
                                    {order.address && <div className="text-slate-700">🏠 {order.address}</div>}
                                  </div>
                                )}
                                {order.notes && <div className="text-[12px] bg-amber-50/50 p-2.5 rounded-lg border border-amber-100 text-amber-900 leading-relaxed"><span className="font-bold text-amber-700">備註：</span> {order.notes}</div>}
                                <div className="flex justify-end gap-2 pt-2 border-t border-slate-200 mt-1">
                                  <button onClick={() => handleEditOrder(order)} className="bg-white hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold text-[12.5px] border border-slate-300 transition-colors">編輯</button>
                                  <button onClick={() => handleDeleteOrder(order.id)} className="bg-white hover:bg-rose-50 border border-rose-200 text-rose-600 px-4 py-2 rounded-lg font-bold text-[12.5px] transition-colors">刪除</button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<MailOrderCalculator />);
    </script>
</body>
</html>
