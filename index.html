    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

      const firebaseConfig = typeof __firebase_config !== 'undefined' 
        ? JSON.parse(__firebase_config) 
        : { 
            apiKey: "AIzaSyCG8wVa9CMOON6fmPei5ReMZ_nQkSkCIwo", 
            authDomain: "makermech-d88e1.firebaseapp.com", 
            projectId: "makermech-d88e1", 
            storageBucket: "makermech-d88e1.firebasestorage.app", 
            messagingSenderId: "855508150878", 
            appId: "1:855508150878:web:b9dc6f43201e4801cfe2cf" 
          };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const googleProvider = new GoogleAuthProvider();

      window.syncToGoogleAppsScript = async (payload, customGasUrl) => {
        const currentGasUrl = customGasUrl || localStorage.getItem('moc_gasWebappUrl') || '';
        if (!currentGasUrl || !currentGasUrl.trim()) return;
        try {
          const response = await fetch(currentGasUrl.trim(), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          if (response.ok || response.type === 'opaque') {
            console.log("Google Sheet Action Success");
          } else {
            console.error("Google Sheet Action Failed", response.statusText);
          }
        } catch (err) {
          console.error("Google Sheet Action Failed", err);
        }
      };

      window.fetchGoogleSheetVersions = async (customGasUrl) => {
        const currentGasUrl = customGasUrl || localStorage.getItem('moc_gasWebappUrl') || '';
        if (!currentGasUrl || !currentGasUrl.trim()) throw new Error("請先填寫 Google Apps Script 網址");
        
        try {
          const response = await fetch(currentGasUrl.trim());
          const result = await response.json();
          if (result.status === "success") {
            return result.versions || [];
          } else {
            throw new Error(result.message || "讀取失敗");
          }
        } catch (err) {
          console.error("Fetch Google Sheet Versions Failed", err);
          throw err;
        }
      };

      window.firebaseService = { auth, db, googleProvider, signInWithPopup, signOut, onAuthStateChanged, doc, getDoc, setDoc };
      window.dispatchEvent(new Event('firebase-ready'));
    </script>

      const formatCurrency = (num) => {
        return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(num || 0);
      };

      function MailOrderCalculator() {
        const defaultTheme = {
          headerBgColor: '#69AFB0', headerTextColor: '#FFFFFF', labelTextColor: '#4A5565', inputBgColor: '#FFFFFF', inputTextColor: '#0F172A',
          vendorBadgeBgColor: '#4A81D3', vendorHeaderBgColor: '#CAE6F7', vendorBoxBgColor: '#F8FAFC', taiwanBoxBgColor: '#F0F9FF', taiwanTitleColor: '#0369A1',
          overseasBoxBgColor: '#FFFBEB', overseasTitleColor: '#B45309', salesTextColor: '#DC2626', qtyTextColor: '#2563EB',
          packagingBadgeBgColor: '#4C7F29', packagingHeaderBgColor: '#F1F9F3', packagingBoxBgColor: '#F8FAFC'
        };

        const [exchangeRate, setExchangeRate] = useState('31.5');
        const [showGoogleSheets, setShowGoogleSheets] = useState(false);
        const [gasWebappUrl, setGasWebappUrl] = useState('');

        const [exportNotice, setExportNotice] = useState('');
        const [lastSavedTime, setLastSavedTime] = useState(() => new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        
        const [theme, setTheme] = useState(defaultTheme);
        const [salesPeriods, setSalesPeriods] = useState([
          { id: 1, isLocked: false, preorderTime: '', productionTime: '', vendors: [{ id: 101, vendorName: '', shippingCost: '', items: [{ id: 1001, itemTitle: '', productName: '', specs: '', style: '', notes: '', printQty: '', unitCost: '', otherFee: '', twdPrice: '', taiwanSalesQty: '', usdPrice: '', overseasSalesQty: '' }] }], packagings: [] }
        ]);

        const [currentDocId, setCurrentDocId] = useState('sheet_' + Date.now());
        const [currentDocTitle, setCurrentDocTitle] = useState('預設成本試算表');
        const [sheetVersions, setSheetVersions] = useState([]);
        const [isLoadingSheet, setIsLoadingSheet] = useState(false);

        const [user, setUser] = useState(null);
        const [syncStatus, setSyncStatus] = useState('Offline');
        const isRemoteLoading = useRef(false);

        useEffect(() => {
          const checkFirebaseReady = () => {
            if (window.firebaseService) {
              const { auth, onAuthStateChanged, db, doc, getDoc } = window.firebaseService;
              onAuthStateChanged(auth, async (currentUser) => {
                setUser(currentUser);
                if (currentUser) {
                  setSyncStatus('Syncing...');
                  try {
                    const userDocRef = doc(db, 'users', currentUser.uid);
                    const docSnap = await getDoc(userDocRef);
                    if (docSnap.exists()) {
                      const cloudData = docSnap.data();
                      if (cloudData.gasWebappUrl) {
                        setGasWebappUrl(cloudData.gasWebappUrl);
                        localStorage.setItem('moc_gasWebappUrl', cloudData.gasWebappUrl);
                      }
                      if (cloudData.salesPeriods) setSalesPeriods(cloudData.salesPeriods);
                      if (cloudData.exchangeRate) setExchangeRate(cloudData.exchangeRate);
                      if (cloudData.currentDocId) setCurrentDocId(cloudData.currentDocId);
                      if (cloudData.currentDocTitle) setCurrentDocTitle(cloudData.currentDocTitle);
                    }
                    setSyncStatus('Synced');
                  } catch (err) {
                    console.error("Cloud config load failed", err);
                    setSyncStatus('Sync failed');
                  }
                } else {
                  setSyncStatus('Offline');
                }
              });
            }
          };
          if (window.firebaseService) checkFirebaseReady();
          else window.addEventListener('firebase-ready', checkFirebaseReady);
          return () => window.removeEventListener('firebase-ready', checkFirebaseReady);
        }, []);

        const handleGoogleLogin = async () => {
          if (!window.firebaseService) return;
          const { auth, googleProvider, signInWithPopup } = window.firebaseService;
          try {
            setSyncStatus('Syncing...');
            await signInWithPopup(auth, googleProvider);
          } catch (err) {
            console.error("Login failed:", err);
            setSyncStatus('Sync failed');
          }
        };

        const handleLogout = async () => {
          if (!window.firebaseService) return;
          const { auth, signOut } = window.firebaseService;
          try {
            await signOut(auth);
            setUser(null);
            setSyncStatus('Offline');
          } catch (err) { console.error(err); }
        };

        const handleGasUrlChange = async (newUrl) => {
          setGasWebappUrl(newUrl);
          localStorage.setItem('moc_gasWebappUrl', newUrl);
          
          if (user && window.firebaseService) {
            const { db, doc, setDoc } = window.firebaseService;
            try {
              await setDoc(doc(db, 'users', user.uid), { gasWebappUrl: newUrl }, { merge: true });
            } catch (err) {
              console.error("Failed to save GAS URL to cloud", err);
            }
          }
        };

        const handleLoadGoogleSheetVersions = async () => {
          if (!gasWebappUrl) {
            alert("請先填寫 Google Apps Script 網址！");
            setShowGoogleSheets(true);
            return;
          }
          try {
            setIsLoadingSheet(true);
            setSyncStatus('Syncing...');
            const versions = await window.fetchGoogleSheetVersions(gasWebappUrl);
            setSheetVersions(versions);
            setSyncStatus('Synced');
            if (versions.length === 0) {
              alert("Google 試算表中尚無任何存檔清單。");
            }
          } catch (err) {
            alert("讀取失敗：" + err.message);
            setSyncStatus('Sync failed');
          } finally {
            setIsLoadingSheet(false);
          }
        };

        const handleSelectSheetVersion = (ver) => {
          if (!user) {
            alert("請先登入 Google 帳號才能讀取雲端試算表！");
            return;
          }
          if (!confirm(`確定要從 Google 試算表讀取版本「${ver.title}」嗎？目前的未儲存資料將被覆蓋。`)) return;
          
          isRemoteLoading.current = true;
          setCurrentDocId(ver.id);
          setCurrentDocTitle(ver.title);
          if (ver.payload) {
            if (ver.payload.salesPeriods) setSalesPeriods(ver.payload.salesPeriods);
            if (ver.payload.exchangeRate) setExchangeRate(ver.payload.exchangeRate);
            if (ver.payload.theme) setTheme(ver.payload.theme);
          }
          setTimeout(() => { isRemoteLoading.current = false; }, 300);

          setExportNotice(`已成功從 Google 試算表讀取：${ver.title}`);
          setTimeout(() => setExportNotice(''), 4000);
        };

        const handleDeleteCloudVersion = async (ver) => {
          if (!user) {
            alert("請先登入 Google 帳號！");
            return;
          }
          if (!confirm(`確定要從 Google 試算表中永久刪除版本「${ver.title}」嗎？此動作無法復原。`)) return;

          try {
            setSyncStatus('Syncing...');
            await window.syncToGoogleAppsScript({ action: 'delete', docId: ver.id }, gasWebappUrl);
            setSyncStatus('Synced');
            setExportNotice(`已成功從 Google 試算表中刪除：${ver.title}`);
            setTimeout(() => setExportNotice(''), 4000);
            handleLoadGoogleSheetVersions();
          } catch (err) {
            alert("刪除失敗：" + err.message);
            setSyncStatus('Sync failed');
          }
        };

        const handleManualSyncToCloud = async () => {
          if (!user) {
            alert("請先登入 Google 帳號才能覆蓋儲存至雲端試算表！");
            return;
          }
          if (!gasWebappUrl) {
            alert("請先填寫 Google Apps Script 網址！");
            setShowGoogleSheets(true);
            return;
          }

          const payload = {
            docId: currentDocId,
            title: currentDocTitle,
            salesPeriods,
            exchangeRate,
            theme,
            lastUpdated: new Date().toISOString()
          };

          try {
            setSyncStatus('Syncing...');
            await window.syncToGoogleAppsScript(payload, gasWebappUrl);
            
            const { db, doc, setDoc } = window.firebaseService;
            await setDoc(doc(db, 'users', user.uid), { currentDocId, currentDocTitle, salesPeriods, exchangeRate }, { merge: true });

            setSyncStatus('Synced');
            setLastSavedTime(new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            setExportNotice(`已成功覆蓋儲存至 Google 試算表中的「${currentDocTitle}」！`);
            setTimeout(() => setExportNotice(''), 4000);
            handleLoadGoogleSheetVersions();
          } catch (err) {
            alert("覆蓋儲存失敗：" + err.message);
            setSyncStatus('Sync failed');
          }
        };

        const handleCreateNewSheetVersion = () => {
          if (!user) {
            alert("請先登入 Google 帳號！");
            return;
          }
          const newTitle = prompt("請輸入新試算表/標題名稱：", `成本試算表_${new Date().toLocaleDateString()}`);
          if (!newTitle) return;

          const newId = 'sheet_' + Date.now();
          setCurrentDocId(newId);
          setCurrentDocTitle(newTitle);
          setSalesPeriods([
            { id: Date.now(), isLocked: false, preorderTime: newTitle, productionTime: '', vendors: [], packagings: [] }
          ]);
          setExportNotice(`已建立新表單：${newTitle}，點擊「覆蓋儲存到此雲端試算表」即可寫入 Google 試算表`);
          setTimeout(() => setExportNotice(''), 4000);
        };

        const handleAddSalesPeriod = () => {
          const newSp = {
            id: Date.now(), isLocked: false, preorderTime: '', productionTime: '',
            vendors: [{ id: Date.now() + 1, vendorName: '', shippingCost: '', items: [{ id: Date.now() + 2, itemTitle: '', productName: '', specs: '', style: '', notes: '', printQty: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', taiwanSalesQty: '', usdPrice: '', overseasSalesQty: '', excludeFromTotal: false }] }],
            packagings: []
          };
          setSalesPeriods([...salesPeriods, newSp]);
        };

        const handleDeleteSalesPeriod = (spId) => { setSalesPeriods(salesPeriods.filter(sp => sp.id !== spId)); };
        const handleToggleLockSalesPeriod = (spId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId ? { ...sp, isLocked: !sp.isLocked } : sp)); };
        const handleSalesPeriodFieldChange = (spId, field, value) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, [field]: value } : sp)); };
        
        const handleAddVendor = (spId) => {
          const newVendor = { id: Date.now(), vendorName: '', shippingCost: '', items: [{ id: Date.now() + 1, itemTitle: '', productName: '', specs: '', style: '', notes: '', printQty: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', taiwanSalesQty: '', usdPrice: '', overseasSalesQty: '', excludeFromTotal: false }] };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: [...sp.vendors, newVendor] } : sp));
        };
        const handleDeleteVendor = (spId, vendorId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.filter(v => v.id !== vendorId) } : sp)); };
        const handleVendorFieldChange = (spId, vendorId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedVendors = sp.vendors.map(v => v.id === vendorId ? { ...v, [field]: value } : v);
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        const handleAddItem = (spId, vendorId) => {
          const newItem = { id: Date.now(), itemTitle: '', productName: '', specs: '', style: '', notes: '', printQty: '', unitCost: '', otherFeeLabel: '', otherFee: '', twdPrice: '', taiwanSalesQty: '', usdPrice: '', overseasSalesQty: '', excludeFromTotal: false };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: [...v.items, newItem] } : v) } : sp));
        };
        const handleDeleteItem = (spId, vendorId, itemId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, vendors: sp.vendors.map(v => v.id === vendorId ? { ...v, items: v.items.filter(i => i.id !== itemId) } : v) } : sp));
        };
        const handleItemFieldChange = (spId, vendorId, itemId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedVendors = sp.vendors.map(v => {
                if (v.id === vendorId) {
                  const updatedItems = v.items.map(i => i.id === itemId ? { ...i, [field]: value } : i);
                  return { ...v, items: updatedItems };
                }
                return v;
              });
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        const handleAddPackaging = (spId) => {
          const newPkg = { id: Date.now(), vendorName: '', shippingCost: '', items: [{ id: Date.now() + 1, packagingTitle: '', style: '', specs: '', notes: '', qty: '', unitCost: '', otherFeeLabel: '', otherFee: '', excludeFromTotal: false }] };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: [...(sp.packagings || []), newPkg] } : sp));
        };
        const handleDeletePackaging = (spId, pkgId) => { setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.filter(p => p.id !== pkgId) } : sp)); };
        const handlePkgVendorFieldChange = (spId, pkgId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, [field]: value } : p) } : sp));
        };
        const handleAddPkgItem = (spId, pkgId) => {
          const newItem = { id: Date.now(), packagingTitle: '', style: '', specs: '', notes: '', qty: '', unitCost: '', otherFeeLabel: '', otherFee: '', excludeFromTotal: false };
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, items: [...(p.items || []), newItem] } : p) } : sp));
        };
        const handleDeletePkgItem = (spId, pkgId, itemId) => {
          setSalesPeriods(salesPeriods.map(sp => sp.id === spId && !sp.isLocked ? { ...sp, packagings: sp.packagings.map(p => p.id === pkgId ? { ...p, items: p.items.filter(i => i.id !== itemId) } : p) } : sp));
        };
        const handleMoveItem = (spId, vendorId, itemId, direction) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedVendors = sp.vendors.map(v => {
                if (v.id === vendorId) {
                  const items = [...v.items];
                  const index = items.findIndex(i => i.id === itemId);
                  if (index === -1) return v;
                  const targetIndex = direction === 'up' ? index - 1 : index + 1;
                  if (targetIndex < 0 || targetIndex >= items.length) return v;
                  const [movedItem] = items.splice(index, 1);
                  items.splice(targetIndex, 0, movedItem);
                  return { ...v, items };
                }
                return v;
              });
              return { ...sp, vendors: updatedVendors };
            }
            return sp;
          }));
        };

        const handleMovePkgItem = (spId, pkgId, itemId, direction) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedPkgs = sp.packagings.map(p => {
                if (p.id === pkgId) {
                  const items = [...p.items];
                  const index = items.findIndex(i => i.id === itemId);
                  if (index === -1) return p;
                  const targetIndex = direction === 'up' ? index - 1 : index + 1;
                  if (targetIndex < 0 || targetIndex >= items.length) return p;
                  const [movedItem] = items.splice(index, 1);
                  items.splice(targetIndex, 0, movedItem);
                  return { ...p, items };
                }
                return p;
              });
              return { ...sp, packagings: updatedPkgs };
            }
            return sp;
          }));
        };

        const handlePkgItemFieldChange = (spId, pkgId, itemId, field, value) => {
          setSalesPeriods(salesPeriods.map(sp => {
            if (sp.id === spId && !sp.isLocked) {
              const updatedPkgs = sp.packagings.map(p => {
                if (p.id === pkgId) {
                  const updatedItems = p.items.map(i => i.id === itemId ? { ...i, [field]: value } : i);
                  return { ...p, items: updatedItems };
                }
                return p;
              });
              return { ...sp, packagings: updatedPkgs };
            }
            return sp;
          }));
        };

        const calculatedData = useMemo(() => {
          const globalRate = parseFloat(exchangeRate) || 0;
          return salesPeriods.map(sp => {
            let periodTotalSales = 0;
            let periodTotalCost = 0;

            const calculatedVendors = (sp.vendors || []).map(vendor => {
              const vendorShipping = parseFloat(vendor.shippingCost) || 0;
              const rawItems = (vendor.items || []).map(item => {
                const printQty = parseFloat(item.printQty) || 0;
                const unitCost = parseFloat(item.unitCost) || 0;
                const otherFee = parseFloat(item.otherFee) || 0;
                const totalCost = (printQty * unitCost) + otherFee;
                return { ...item, printQty, unitCost, otherFee, totalCost };
              });
              
              // 僅計算未被排除的品項總成本來分攤運費及計算總成本
              const activeVendorItems = rawItems.filter(item => !item.excludeFromTotal);
              const totalVendorItemsAmount = activeVendorItems.reduce((sum, item) => sum + item.totalCost, 0);
              
              // 廠商運費與有效品項成本計入總成本
              periodTotalCost += totalVendorItemsAmount + vendorShipping;

              const calculatedItems = rawItems.map(item => {
                let itemShipping = 0;
                if (!item.excludeFromTotal && totalVendorItemsAmount > 0) {
                  itemShipping = vendorShipping * (item.totalCost / totalVendorItemsAmount);
                } else if (!item.excludeFromTotal && activeVendorItems.length > 0) {
                  itemShipping = vendorShipping / activeVendorItems.length;
                }
                
                const totalCost = item.totalCost + itemShipping;

                const twdPrice = parseFloat(item.twdPrice) || 0;
                const taiwanSalesQty = parseFloat(item.taiwanSalesQty) || 0;
                const taiwanRevenue = twdPrice * taiwanSalesQty;

                const usdPrice = parseFloat(item.usdPrice) || 0;
                const overseasSalesQty = parseFloat(item.overseasSalesQty) || 0;
                const usdToTwd = Math.round(usdPrice * globalRate);
                const overseasRevenue = usdToTwd * overseasSalesQty;

                const totalSalesQty = taiwanSalesQty + overseasSalesQty;
                const totalRevenue = taiwanRevenue + overseasRevenue;
                const profitAndLoss = totalRevenue - totalCost;

                if (!item.excludeFromTotal) {
                  periodTotalSales += totalRevenue;
                }
                return { ...item, shippingCost: itemShipping, taiwanRevenue, usdToTwd, overseasRevenue, totalSalesQty, totalRevenue, profitAndLoss };
              });
              return { ...vendor, items: calculatedItems };
            });

            const calculatedPackagings = (sp.packagings || []).map(pkgVendor => {
              const itemsList = pkgVendor.items || [];
              const vendorShipping = parseFloat(pkgVendor.shippingCost) || 0;
              const rawPkgItems = itemsList.map(item => {
                const qty = parseFloat(item.qty) || 0;
                const unitCost = parseFloat(item.unitCost) || 0;
                const otherFee = parseFloat(item.otherFee) || 0;
                const totalCost = (qty * unitCost) + otherFee;
                return { ...item, qty, unitCost, otherFee, totalCost };
              });

              const activePkgItems = rawPkgItems.filter(item => !item.excludeFromTotal);
              const totalPkgItemsAmount = activePkgItems.reduce((sum, item) => sum + item.totalCost, 0);
              periodTotalCost += totalPkgItemsAmount + vendorShipping;

              const calculatedPkgItems = rawPkgItems.map(item => {
                let itemShipping = 0;
                if (!item.excludeFromTotal && totalPkgItemsAmount > 0) {
                  itemShipping = vendorShipping * (item.totalCost / totalPkgItemsAmount);
                } else if (!item.excludeFromTotal && activePkgItems.length > 0) {
                  itemShipping = vendorShipping / activePkgItems.length;
                }
                return { ...item, shippingCost: itemShipping, totalCost: item.totalCost + itemShipping };
              });
              return { ...pkgVendor, items: calculatedPkgItems };
            });

            const periodNetIncome = periodTotalSales - periodTotalCost;
            return { ...sp, vendors: calculatedVendors, packagings: calculatedPackagings, periodTotalSales, periodTotalCost, periodNetIncome };
          });
        }, [salesPeriods, exchangeRate]);

        return (
          <div className="min-h-screen bg-slate-100 p-3 sm:p-6 font-sans text-[12.7px] sm:text-[14.7px]">
            <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col font-sans">
              
              {/* Top Header */}
              <div className="p-4 sm:p-5 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-3 font-sans" style={{ backgroundColor: theme.headerBgColor }}>
                <div className="flex items-center gap-2.5 font-sans">
                  <div className="p-2 bg-black/20 rounded-xl text-white font-sans shadow-inner">
                    <Icons.Table />
                  </div>
                  <div className="font-sans">
                    <h1 className="text-[16.7px] sm:text-[18.7px] font-bold tracking-tight font-sans" style={{ color: theme.headerTextColor }}>週邊成本試算表</h1>
                    <p className="text-[12.7px] text-white/80 font-normal">
                      目前編輯目標：<span className="font-bold underline">{currentDocTitle}</span>
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2 flex-wrap font-sans w-full md:w-auto justify-end">
                  <button 
                    onClick={handleLoadGoogleSheetVersions}
                    className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[12.7px] font-bold transition-all font-sans bg-amber-500 hover:bg-amber-600 text-white shadow-md border border-amber-400"
                  >
                    <Icons.Cloud /> 讀取雲端試算表資料
                  </button>

                  <button 
                    onClick={handleManualSyncToCloud}
                    className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[12.7px] font-bold transition-all font-sans bg-emerald-600 hover:bg-emerald-700 text-white shadow-md border border-emerald-500"
                  >
                    <Icons.Save /> 覆蓋儲存到此雲端試算表
                  </button>

                  <button 
                    onClick={() => setShowGoogleSheets(!showGoogleSheets)}
                    className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12.7px] font-semibold transition-all font-sans bg-black/15 text-white hover:bg-black/25 border border-white/20 shadow-sm"
                  >
                    <Icons.FileSpreadsheet /> 設定與網址
                  </button>

                  <button 
                    onClick={handleAddSalesPeriod}
                    className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2 rounded-xl text-[12.7px] font-bold transition-all shadow-md font-sans border border-slate-700"
                  >
                    <Icons.Plus /> 新增販售
                  </button>
                </div>
              </div>

              {/* Google Sheets / Gas Config & Versions Modal Panel */}
              {showGoogleSheets && (
                <div className="p-4 sm:p-5 bg-slate-50 border-b border-slate-200 flex flex-col gap-4 animate-fade-in text-[12.7px] font-sans">
                  <div className="flex justify-between items-center border-b border-slate-200 pb-3 font-sans">
                    <h3 className="font-bold text-slate-800 text-[14.7px] flex items-center gap-2 font-sans">📊 Google 試算表資料庫設定與版本管理</h3>
                    <button onClick={() => setShowGoogleSheets(false)} className="text-[12.7px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-semibold">關閉面板</button>
                  </div>

                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3">
                    <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                      <label className="font-bold text-slate-700 whitespace-nowrap">Google Apps Script Web App URL：</label>
                      <input 
                        type="text" 
                        value={gasWebappUrl}
                        onChange={(e) => handleGasUrlChange(e.target.value)}
                        placeholder="https://script.google.com/macros/s/.../exec" 
                        className="flex-grow px-3 py-2 rounded-xl border border-slate-300 outline-none text-[12.7px] bg-slate-50 focus:bg-white"
                      />
                    </div>
                    <p className="text-[11.7px] text-slate-500">
                      💡 <strong>提示：</strong>此網址會自動儲存到您的 Google 帳號雲端中。無論您換到哪台電腦或哪個瀏覽器，只要登入帳號就會自動帶入，不需要重複輸入！
                    </p>
                  </div>

                  <div className="flex justify-between items-center pt-2">
                    <span className="font-bold text-slate-700">Google 試算表中的存檔清單（可選擇讀取或直接刪除）：</span>
                    <button onClick={handleCreateNewSheetVersion} className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 text-[12.7px]">
                      <Icons.Plus /> 建立新試算表版本

                  {isLoadingSheet ? (
                    <div className="p-6 text-center text-slate-500 font-semibold">正在從 Google 試算表讀取資料中...</div>

                        const isCurrent = ver.id === currentDocId;
                        return (
                          <div 
                            key={ver.id}
                            className={`p-3.5 rounded-xl border transition-all flex flex-col justify-between gap-2 shadow-sm ${isCurrent ? 'bg-sky-50 border-sky-400 ring-2 ring-sky-300' : 'bg-white border-slate-200 hover:bg-slate-50'}`}

                            <div className="flex justify-between items-start">
                              <span className="font-bold text-[14.7px] text-slate-800">{ver.title || '未命名'}</span>
                              {isCurrent && <span className="bg-sky-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">目前編輯中</span>}
                            </div>
                            <div className="text-[11px] text-slate-500 flex justify-between items-center">
                              <span>更新: {new Date(ver.lastUpdated || Date.now()).toLocaleString('zh-TW')}</span>
                              <div className="flex items-center gap-1.5">
                                <button 
                                  onClick={() => handleSelectSheetVersion(ver)}
                                  className="bg-slate-900 hover:bg-slate-800 text-white px-2.5 py-1 rounded-lg font-bold text-[11px]"

                                  讀取

                                <button 
                                  onClick={() => handleDeleteCloudVersion(ver)}
                                  className="bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded-lg font-bold text-[11px] flex items-center gap-1"
                                >
                                  <Icons.Trash /> 刪除
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })}

                    <div className="p-6 bg-white rounded-xl border border-slate-200 text-center text-slate-500 flex flex-col items-center gap-2">
                      <p>尚未讀取或找不到雲端清單</p>
                      <button onClick={handleLoadGoogleSheetVersions} className="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-[12.7px]">立即讀取 Google 試算表清單</button>
                    </div>
                  )}
                </div>
              )}

              {/* Status Bar */}
              <div className="px-4 sm:px-5 py-2.5 bg-slate-100 border-b border-slate-200 flex justify-between items-center gap-3 flex-wrap font-sans text-[11px]">
                <div className="flex items-center gap-2.5 flex-wrap">
                  <div className="flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-lg border border-slate-200 shadow-sm text-[11px]">
                    {user ? (
                      <div className="flex items-center gap-2 text-[11px]">
                        <span className="font-bold text-slate-700 truncate max-w-[140px]" title={user.email}>{user.displayName || user.email}</span>
                        <button onClick={handleLogout} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold">登出</button>
                      </div>
                    ) : (
                      <button onClick={handleGoogleLogin} className="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 shadow-sm">
                        <span>Google 帳號登入</span>
                      </button>
                    )}
                    <span className="text-slate-300">|</span>
                    <span className={`px-2 py-0.5 rounded font-bold ${syncStatus === 'Synced' ? 'bg-emerald-600 text-white' : syncStatus === 'Syncing...' ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white'}`}>
                      {syncStatus}
                    </span>
                  </div>
                </div>
              </div>

              {exportNotice && (
                <div className="bg-sky-50 text-sky-700 px-4 py-2.5 text-center text-[12.7px] font-bold border-b border-sky-200 font-sans">
                  {exportNotice}
                </div>
              )}

              {/* Sales Periods Container */}
              <div className="p-3 sm:p-5 flex flex-col gap-6 bg-slate-50/60 flex-grow font-sans">
                {calculatedData.map((sp) => (
                  <div key={sp.id} className="bg-white rounded-2xl shadow-md overflow-hidden flex flex-col font-sans border border-slate-200">
                    
                    {/* Sales Period Header Block */}
                    <div className="p-4 sm:p-5 flex flex-col gap-3.5 font-sans" style={{ backgroundColor: theme.headerBgColor, color: theme.headerTextColor }}>
                      <div className="flex flex-wrap items-center justify-between gap-3 font-sans">
                        <div className="flex flex-wrap items-center gap-3 font-sans">
                          <div className="flex items-center gap-2 font-sans bg-black/10 px-3 py-1.5 rounded-xl border border-white/10 shadow-sm">
                            <span className="text-[12.7px] font-bold flex items-center gap-1 whitespace-nowrap opacity-90 font-sans"><Icons.Calendar /> 預購時間：</span>
                            <input 
                              type="text" 
                              value={sp.preorderTime || ''}
                              disabled={sp.isLocked}
                              onChange={(e) => handleSalesPeriodFieldChange(sp.id, 'preorderTime', e.target.value)}
                              className="px-2.5 py-1 rounded-lg outline-none font-bold text-[12.7px] w-28 sm:w-32 text-left font-sans bg-white text-slate-900 border border-white/25 shadow-sm disabled:bg-slate-200"
                            />
                          </div>

                          <div className="flex items-center gap-2 font-sans bg-black/10 px-3 py-1.5 rounded-xl border border-white/10 shadow-sm">
                            <span className="text-[12.7px] font-bold flex items-center gap-1 whitespace-nowrap opacity-90 font-sans"><Icons.Calendar /> 製作時間：</span>
                            <input 
                              type="text" 
                              value={sp.productionTime || ''}
                              disabled={sp.isLocked}
                              onChange={(e) => handleSalesPeriodFieldChange(sp.id, 'productionTime', e.target.value)}
                              className="px-2.5 py-1 rounded-lg outline-none font-bold text-[12.7px] w-28 sm:w-32 text-left font-sans bg-white text-slate-900 border border-white/25 shadow-sm disabled:bg-slate-200"
                            />
                          </div>
                        </div>

                        <div className="flex items-center gap-2.5 font-sans flex-wrap">
                          <button 
                            onClick={() => handleToggleLockSalesPeriod(sp.id)}
                            className={`px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1 font-bold text-[12.7px] shadow-sm font-sans border ${sp.isLocked ? 'bg-amber-500 text-white border-amber-400' : 'bg-black/20 text-white border-white/20'}`}
                          >
                            {sp.isLocked ? <Icons.Lock /> : <Icons.Unlock />}
                            {sp.isLocked ? '鎖定' : '解鎖'}
                          </button>
                          
                          <button 
                            onClick={() => handleDeleteSalesPeriod(sp.id)}
                            disabled={sp.isLocked}
                            className="bg-red-500 hover:bg-red-600 text-white px-3.5 py-1.5 rounded-xl transition-colors flex items-center gap-1 font-bold text-[12.7px] shadow-sm font-sans border border-red-400/30 disabled:opacity-50"
                          >
                            <Icons.Trash /> 刪除
                          </button>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 pt-2 border-t border-white/15 font-sans">
                        <button onClick={() => handleAddVendor(sp.id)} disabled={sp.isLocked} className="bg-white/15 hover:bg-white/25 text-white px-3.5 py-1.5 rounded-xl transition-colors flex items-center gap-1.5 font-bold text-[12.7px] shadow-sm border border-white/20 disabled:opacity-50">
                          <Icons.Plus /> 新增廠商
                        </button>
                        <button onClick={() => handleAddPackaging(sp.id)} disabled={sp.isLocked} className="bg-white/15 hover:bg-white/25 text-white px-3.5 py-1.5 rounded-xl transition-colors flex items-center gap-1.5 font-bold text-[12.7px] shadow-sm border border-white/20 disabled:opacity-50">
                          <Icons.Box /> 新增包材
                        </button>
                      </div>
                    </div>

                    {/* Vendors and Packagings Container */}
                    <div className="p-3 sm:p-5 flex flex-col gap-5 bg-slate-50/50 font-sans text-[12.7px]">
                      
                      {sp.vendors.map((vendor) => (
                        <div key={vendor.id} className="rounded-2xl shadow-sm overflow-hidden flex flex-col font-sans border border-slate-200" style={{ backgroundColor: theme.vendorBoxBgColor }}>
                          <div className="px-4 py-3 m-3 mb-0 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 font-sans shadow-sm border border-slate-200/60" style={{ backgroundColor: theme.vendorHeaderBgColor }}>
                            <div className="flex items-center gap-3 flex-wrap w-full sm:w-auto font-sans">
                              <span className="text-white px-3 py-1 rounded-lg text-[12.7px] font-bold tracking-wider shadow-sm" style={{ backgroundColor: theme.vendorBadgeBgColor }}>【廠商】</span>
                              <div className="flex items-center gap-1.5">
                                <span className="font-bold">廠商:</span>
                                <input type="text" value={vendor.vendorName} disabled={sp.isLocked} onChange={(e) => handleVendorFieldChange(sp.id, vendor.id, 'vendorName', e.target.value)} className="px-2.5 py-1 rounded-lg outline-none font-bold text-[12.7px] w-36 border border-slate-300 bg-white" />
                              </div>
                              <div className="flex items-center gap-1.5">
                                <span className="font-bold">運費:</span>
                                <input type="text" inputMode="decimal" value={vendor.shippingCost} disabled={sp.isLocked} onChange={(e) => handleVendorFieldChange(sp.id, vendor.id, 'shippingCost', e.target.value)} className="px-2.5 py-1 rounded-lg outline-none font-bold text-[12.7px] w-24 border border-slate-300 bg-white" />
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => handleAddItem(sp.id, vendor.id)} disabled={sp.isLocked} className="bg-slate-900 text-white px-3.5 py-1.5 rounded-xl font-bold text-[12.7px] flex items-center gap-1"><Icons.Plus /> 新增品項</button>
                              <button onClick={() => handleDeleteVendor(sp.id, vendor.id)} disabled={sp.isLocked} className="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold text-[12.7px]"><Icons.Trash /></button>
                            </div>
                          </div>

                          <div className="p-3 sm:p-4 flex flex-col gap-3.5">
                            {vendor.items.map((item, itemIdx) => (
                              <div key={item.id} className="bg-white rounded-xl shadow-sm p-4 flex flex-col gap-3 border border-slate-200">
                                <div className="flex justify-between items-center gap-3 border-b border-slate-100 pb-2.5 flex-wrap">
                                  <div className="flex items-center gap-2 flex-grow">
                                    <span className="text-[12.7px] font-bold bg-slate-100 px-2 py-0.5 rounded text-slate-600">品項</span>
                                    <input type="text" value={item.itemTitle} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'itemTitle', e.target.value)} className="rounded-lg px-2.5 py-1 font-bold text-[12.7px] w-full sm:w-56 border border-slate-200 bg-slate-50" />
                                  </div>
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <div className="flex items-center gap-0.5 bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                                      <button

                                        onClick={() => handleMoveItem(sp.id, vendor.id, item.id, 'down')}

                                    <button onClick={() => handleDeleteItem(sp.id, vendor.id, item.id)} disabled={sp.isLocked} className="text-slate-400 hover:text-red-600 p-1"><Icons.Trash /></button>

                                  <div><label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">款式</label><input type="text" value={item.style} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'style', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/50" /></div>
                                  <div><label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">規格</label><input type="text" value={item.specs} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'specs', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/50" /></div>
                                  <div><label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">備註</label><input type="text" value={item.notes} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'notes', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/50" /></div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                  <div className="bg-blue-50/40 p-2.5 rounded-xl border border-blue-100"><label className="block font-bold mb-1 text-blue-700 text-[11.7px]">印製數量</label><input type="text" inputMode="decimal" value={item.printQty} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'printQty', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-blue-200 bg-white font-bold" /></div>
                                  <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200"><label className="block font-bold mb-1 text-slate-700 text-[11.7px]">單價成本</label><input type="text" inputMode="decimal" value={item.unitCost} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'unitCost', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white font-bold" /></div>
                                  <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                    <div className="flex items-center justify-between mb-1">
                                      <label className="font-bold text-slate-700 text-[11.7px]">其他費用</label>
                                      <input 
                                        type="text" 
                                        value={item.otherFeeLabel || ''} 
                                        disabled={sp.isLocked} 
                                        onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'otherFeeLabel', e.target.value)} 
                                        placeholder="備註" 
                                        className="text-[10px] px-1.5 py-0.5 rounded border border-slate-300 bg-white w-20 text-right font-normal"
                                      />
                                    </div>
                                    <input type="text" inputMode="decimal" value={item.otherFee} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'otherFee', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white font-bold" />
                                  </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                                  <div className="p-3 rounded-xl flex flex-col gap-2.5 border border-sky-100 shadow-sm" style={{ backgroundColor: theme.taiwanBoxBgColor }}>
                                    <span className="font-bold text-[12.7px]" style={{ color: theme.taiwanTitleColor }}>🇹🇼 台灣販售</span>
                                    <div className="grid grid-cols-3 gap-2">
                                      <div><label className="block text-[10.7px]">售價(TWD)</label><input type="text" inputMode="decimal" value={item.twdPrice} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'twdPrice', e.target.value)} className="w-full px-2 py-1.5 rounded-lg border border-sky-200 bg-white font-bold" /></div>
                                      <div><label className="block text-[10.7px]">銷售量</label><input type="text" inputMode="decimal" value={item.taiwanSalesQty} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'taiwanSalesQty', e.target.value)} className="w-full px-2 py-1.5 rounded-lg border border-sky-200 bg-white font-bold" /></div>
                                      <div><label className="block text-[10.7px]" style={{ color: theme.salesTextColor }}>銷售額</label><div className="w-full px-2 py-1.5 rounded-lg bg-white border border-sky-200 font-bold truncate" style={{ color: theme.salesTextColor }}>{formatCurrency(item.taiwanRevenue)}</div></div>
                                    </div>
                                  </div>

                                  <div className="p-3 rounded-xl flex flex-col gap-2.5 border border-amber-100 shadow-sm" style={{ backgroundColor: theme.overseasBoxBgColor }}>
                                    <div className="flex justify-between items-center"><span className="font-bold text-[12.7px]" style={{ color: theme.overseasTitleColor }}>🌍 海外販售</span>
                                      <div className="flex items-center gap-1 text-[11.7px]"><span>匯率:</span><input type="text" value={exchangeRate} disabled={sp.isLocked} onChange={(e) => setExchangeRate(e.target.value)} className="w-12 bg-white font-bold text-center rounded border border-amber-200 px-1" /></div>
                                    </div>
                                    <div className="grid grid-cols-4 gap-1.5">
                                      <div><label className="block text-[10.7px]">售價(USD)</label><input type="text" value={item.usdPrice} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'usdPrice', e.target.value)} className="w-full px-1.5 py-1.5 rounded-lg border border-amber-200 bg-white font-bold" /></div>
                                      <div><label className="block text-[10.7px]">折合台幣</label><div className="w-full px-1.5 py-1.5 rounded-lg bg-white border border-amber-200 font-bold truncate">{formatCurrency(item.usdToTwd)}</div></div>
                                      <div><label className="block text-[10.7px]">銷售量</label><input type="text" value={item.overseasSalesQty} disabled={sp.isLocked} onChange={(e) => handleItemFieldChange(sp.id, vendor.id, item.id, 'overseasSalesQty', e.target.value)} className="w-full px-1.5 py-1.5 rounded-lg border border-amber-200 bg-white font-bold" /></div>
                                      <div><label className="block text-[10.7px]" style={{ color: theme.salesTextColor }}>銷售額</label><div className="w-full px-1.5 py-1.5 rounded-lg bg-white border border-amber-200 font-bold truncate" style={{ color: theme.salesTextColor }}>{formatCurrency(item.overseasRevenue)}</div></div>
                                    </div>
                                  </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-4 gap-2.5 pt-2 border-t border-slate-100 text-[12.7px]">
                                  <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"><span className="text-slate-600">總數量：</span><span className="font-bold text-[14.7px]" style={{ color: theme.qtyTextColor }}>{item.totalSalesQty}</span></div>
                                  <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"><span className="text-slate-600">總收入：</span><span className="font-bold text-[14.7px]" style={{ color: theme.salesTextColor }}>{formatCurrency(item.totalRevenue)}</span></div>
                                  <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"><span className="text-slate-600">總成本：</span><span className="font-bold text-[14.7px]">{formatCurrency(item.totalCost)}</span></div>
                                  <div className="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"><span className="text-slate-600">損益：</span><span className="font-bold text-[14.7px]">{item.profitAndLoss < 0 ? <span className="text-red-600">-{formatCurrency(Math.abs(item.profitAndLoss))}</span> : <span className="text-emerald-600">+{formatCurrency(item.profitAndLoss)}</span>}</span></div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}

                      {/* Packaging Section */}
                      {(sp.packagings || []).map((pkgVendor) => (
                        <div key={pkgVendor.id} className="rounded-2xl shadow-sm overflow-hidden flex flex-col font-sans border border-slate-200" style={{ backgroundColor: theme.packagingBoxBgColor }}>
                          <div className="px-4 py-3 m-3 mb-0 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-3 shadow-sm border border-slate-200/60" style={{ backgroundColor: theme.packagingHeaderBgColor }}>
                            <div className="flex items-center gap-3 flex-wrap">
                              <span className="text-white px-3 py-1 rounded-lg text-[12.7px] font-bold tracking-wider" style={{ backgroundColor: theme.packagingBadgeBgColor }}>【包材】</span>
                              <div className="flex items-center gap-1.5"><span className="font-bold">廠商:</span><input type="text" value={pkgVendor.vendorName} disabled={sp.isLocked} onChange={(e) => handlePkgVendorFieldChange(sp.id, pkgVendor.id, 'vendorName', e.target.value)} className="px-2.5 py-1 rounded-xl outline-none font-bold text-[12.7px] w-36 border border-slate-300 bg-white" /></div>
                              <div className="flex items-center gap-1.5"><span className="font-bold">運費:</span><input type="text" inputMode="decimal" value={pkgVendor.shippingCost} disabled={sp.isLocked} onChange={(e) => handlePkgVendorFieldChange(sp.id, pkgVendor.id, 'shippingCost', e.target.value)} className="px-2.5 py-1 rounded-xl outline-none font-bold text-[12.7px] w-24 border border-slate-300 bg-white" /></div>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => handleAddPkgItem(sp.id, pkgVendor.id)} disabled={sp.isLocked} className="bg-slate-900 text-white px-3.5 py-1.5 rounded-xl font-bold text-[12.7px] flex items-center gap-1"><Icons.Plus /> 新增品項</button>
                              <button onClick={() => handleDeletePackaging(sp.id, pkgVendor.id)} disabled={sp.isLocked} className="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold text-[12.7px]"><Icons.Trash /></button>
                            </div>
                          </div>

                          <div className="p-3 sm:p-4 flex flex-col gap-3.5">
                            {(pkgVendor.items || []).map((pkg, pkgIdx) => (
                              <div key={pkg.id} className="bg-white rounded-xl shadow-sm p-4 flex flex-col gap-3 border border-slate-200">
                                <div className="flex justify-between items-center gap-3 border-b border-slate-100 pb-2.5 flex-wrap">
                                  <div className="flex items-center gap-2 flex-grow">
                                    <span className="text-[12.7px] font-bold bg-slate-100 px-2 py-0.5 rounded text-slate-600">品項</span>
                                    <input type="text" value={pkg.packagingTitle} disabled={sp.isLocked} onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'packagingTitle', e.target.value)} className="rounded-lg px-2.5 py-1 font-bold text-[12.7px] w-full sm:w-56 border border-slate-200 bg-slate-50" />
                                  </div>
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <div className="flex items-center gap-0.5 bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                                      <button 
                                        onClick={() => handleMovePkgItem(sp.id, pkgVendor.id, pkg.id, 'up')} 
                                        disabled={sp.isLocked || pkgIdx === 0}
                                        title="往上一格"
                                        className="p-1 hover:bg-slate-200 rounded disabled:opacity-30 text-slate-700 font-bold text-[11px]"
                                      >
                                        ▲
                                      </button>
                                      <button 
                                        onClick={() => handleMovePkgItem(sp.id, pkgVendor.id, pkg.id, 'down')} 
                                        disabled={sp.isLocked || pkgIdx === pkgVendor.items.length - 1}
                                        title="往下一格"
                                        className="p-1 hover:bg-slate-200 rounded disabled:opacity-30 text-slate-700 font-bold text-[11px]"
                                      >
                                        ▼
                                      </button>
                                    </div>

                                    <label className="flex items-center gap-1.5 text-[12.7px] font-semibold text-slate-600 cursor-pointer select-none">
                                      <input 
                                        type="checkbox" 
                                        checked={pkg.excludeFromTotal} 
                                        disabled={sp.isLocked}
                                        onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'excludeFromTotal', e.target.checked)}
                                        className="w-4 h-4 accent-slate-900 rounded cursor-pointer"
                                      />
                                      <span>不計入總額</span>
                                    </label>
                                    <button onClick={() => handleDeletePkgItem(sp.id, pkgVendor.id, pkg.id)} disabled={sp.isLocked} className="text-slate-400 hover:text-red-600 p-1"><Icons.Trash /></button>
                                  </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                                  <div><label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">款式</label><input type="text" value={pkg.style} disabled={sp.isLocked} onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'style', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/50" /></div>
                                  <div><label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">規格</label><input type="text" value={pkg.specs} disabled={sp.isLocked} onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'specs', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/50" /></div>
                                  <div><label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">數量</label><input type="text" inputMode="decimal" value={pkg.qty} disabled={sp.isLocked} onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'qty', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/50 font-bold" /></div>
                                  <div><label className="block font-semibold mb-1 text-slate-500 text-[11.7px]">單價成本</label><input type="text" inputMode="decimal" value={pkg.unitCost} disabled={sp.isLocked} onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'unitCost', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/50 font-bold" /></div>
                                  <div>
                                    <div className="flex items-center justify-between mb-1">
                                      <label className="font-semibold text-slate-500 text-[11.7px]">其他費用</label>
                                      <input 
                                        type="text" 
                                        value={pkg.otherFeeLabel || ''} 
                                        disabled={sp.isLocked} 
                                        onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'otherFeeLabel', e.target.value)} 
                                        placeholder="備註" 
                                        className="text-[10px] px-1.5 py-0.5 rounded border border-slate-300 bg-white w-20 text-right font-normal"
                                      />
                                    </div>
                                    <input type="text" inputMode="decimal" value={pkg.otherFee} disabled={sp.isLocked} onChange={(e) => handlePkgItemFieldChange(sp.id, pkgVendor.id, pkg.id, 'otherFee', e.target.value)} className="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/50 font-bold" />
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}

                    </div>

                    {/* Summary Footer */}
                    <div className="p-4 sm:p-5 bg-slate-100 flex flex-col md:flex-row justify-between items-center gap-3 font-bold border-t border-slate-200 text-[12.7px] sm:text-[14.7px]">
                      <div className="flex items-center gap-2 text-slate-800">
                        <span>📦 本次總銷售額：</span>
                        <span className="text-emerald-600 text-[14.7px] sm:text-[16.7px] font-extrabold">{formatCurrency(sp.periodTotalSales)}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-slate-800">最終淨收 (淨利)：</span>
                        <span className="bg-slate-900 text-amber-300 px-4 py-2 rounded-xl font-extrabold shadow-md border border-slate-700 text-[14.7px] sm:text-[16.7px]">{formatCurrency(sp.periodNetIncome)}</span>
                      </div>
                    </div>

                  </div>
                ))}
              </div>

            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<MailOrderCalculator />);
    </script>
</body>
</html>
